id: renderers.html.components
kind: renderer-registry
schemaVersion: 1
version: 0.1.0
status: draft
title: HTML 组件渲染器
summary: 面向 Agent 生成 H5 高保真原型 HTML 渲染器映射。
principle: "Figma 组件 ID 用作身份依据；本地 HTML 渲染器规则负责生成高保真的 DOM/CSS 表达。"
renderers:
  - id: renderer.html.home-topbar
    sourceComponent: component.home-topbar
    htmlStrategy:
      fidelity: high
      renderAs: reusable-web-component
      redrawForbidden: true
      defaultInteraction: static
    htmlRuntime:
      assetPath: renderers/html/components/top-bar/top-bar.assets.inline.js
      path: renderers/html/components/top-bar/top-bar.inline.js
      customElement: xzl-home-top-bar
      inlineMode: inline-assets-then-runtime-inside-script
      noExternalDependencies: true
      attributes:
        theme:
          allowed:
            - light
            - dark
          required: true
    visualReferences:
      dark: figma://pbxELN7TYDDguIgbXfc1zB/713:40812
      light: figma://pbxELN7TYDDguIgbXfc1zB/713:40841
    hardGates:
      forbidReimplementation: true
      forbidNetworkAssets: true
      requireTransparentBackground: true
      requiredHeightPx: 115
      requiredWidthBaselinePx: 390
  - id: renderer.html.primary-page-background
    sourceComponent: component.page-background
    htmlStrategy:
      fidelity: high
      renderAs: reusable-web-component
      redrawForbidden: true
      defaultInteraction: static
    htmlRuntime:
      assetPath: renderers/html/components/page-background/page-background.assets.inline.js
      path: renderers/html/components/page-background/page-background.inline.js
      customElement: xzl-page-background
      inlineMode: inline-assets-then-runtime-inside-script
      noExternalDependencies: true
      attributes:
        scene:
          allowed:
            - home
            - chat
            - morning-brief
            - limit-up-hunter
            - event-catcher
          required: true
        theme:
          allowed:
            - light
            - dark
          required: true
    visualReferences:
      dark: figma://pbxELN7TYDDguIgbXfc1zB/400:26896
      light: figma://pbxELN7TYDDguIgbXfc1zB/400:26805
    pendingSceneCoverage:
      - trading
      - stock-detail
    hardGates:
      forbidPureColorFallback: true
      forbidHandDrawnGradient: true
      requireBottomLayer: true
      requiredHeightPx: 844
      requiredWidthPx: 390
  - id: renderer.html.chat-topbar
    sourceComponent: component.chat-topbar
    htmlStrategy:
      fidelity: high
      renderAs: reusable-web-component
      redrawForbidden: true
      defaultInteraction: static
    htmlRuntime:
      assetPath: renderers/html/components/top-bar/top-bar.assets.inline.js
      path: renderers/html/components/top-bar/top-bar.inline.js
      customElement: xzl-chat-top-bar
      inlineMode: inline-assets-then-runtime-inside-script
      noExternalDependencies: true
      attributes:
        theme:
          allowed:
            - light
            - dark
          required: true
    visualReferences:
      dark: figma://pbxELN7TYDDguIgbXfc1zB/392:75358
      light: figma://pbxELN7TYDDguIgbXfc1zB/392:75374
      role: html-visual-acceptance-only
    figmaBindingsUnchanged: true
    figmaGenerationRoute: bindings/figma/components.yaml#components.component.chat-topbar
    hardGates:
      forbidReimplementation: true
      forbidNetworkAssets: true
      requireFixedTop: true
      requiredHeightPx: 91
      requiredWidthBaselinePx: 390
  - id: renderer.html.topbar
    sourceComponent: component.topbar
    htmlStrategy:
      fidelity: high
      renderAs: reusable-web-component
      redrawForbiddenForConfirmedRuntimeVariants: true
      defaultInteraction: static
    htmlRuntime:
      assetPath: renderers/html/components/top-bar/top-bar.assets.inline.js
      path: renderers/html/components/top-bar/top-bar.inline.js
      inlineMode: inline-assets-then-runtime-inside-script
      noExternalDependencies: true
      customElements:
        trade: xzl-trade-top-bar
        morning: xzl-morning-top-bar
        watchlist: xzl-watchlist-top-bar
        stockDetail: xzl-stock-top-bar
        secondary: xzl-secondary-top-bar
      attributes:
        theme:
          allowed:
            - light
            - dark
          required: true
        active:
          appliesTo: xzl-watchlist-top-bar
          allowed:
            - 自选
            - 触发
            - 模拟
            - 持股
          default: 自选
        title:
          appliesTo: xzl-secondary-top-bar
          default: 标题
    visualReferences:
      trade-dark: figma://pbxELN7TYDDguIgbXfc1zB/774:47670
      trade-light: figma://pbxELN7TYDDguIgbXfc1zB/774:47669
      morning-dark: figma://pbxELN7TYDDguIgbXfc1zB/774:55970
      morning-light: figma://pbxELN7TYDDguIgbXfc1zB/774:55971
      watchlist-dark: figma://pbxELN7TYDDguIgbXfc1zB/774:66816
      watchlist-light: figma://pbxELN7TYDDguIgbXfc1zB/774:66866
      stock-detail-dark: figma://pbxELN7TYDDguIgbXfc1zB/774:67059
      stock-detail-light: figma://pbxELN7TYDDguIgbXfc1zB/774:67217
      secondary-dark: figma://pbxELN7TYDDguIgbXfc1zB/774:67337
      secondary-light: figma://pbxELN7TYDDguIgbXfc1zB/774:67397
      role: html-visual-acceptance-only
    localAssets:
      - bindings/assets/files/top-bar/watchlist-tabs/
    sceneVariantDefaults:
      trade:
        customElement: xzl-trade-top-bar
        examples:
          - 交易页
          - 下单页
          - 委托页
          - 条件单入口
      morning:
        customElement: xzl-morning-top-bar
        examples:
          - 早点听详情页
      watchlist:
        customElement: xzl-watchlist-top-bar
        activeAllowed:
          - 自选
          - 触发
          - 模拟
          - 持股
      stock-detail:
        customElement: xzl-stock-top-bar
        requiresSelectedSecurity: true
      secondary-default:
        customElement: xzl-secondary-top-bar
        appliesTo:
          - 次级页面
          - 专题页
          - 未特殊声明页面
    hardGates:
      requireDataComponent: component.topbar
      confirmedRuntimeMustUse:
        - renderers/html/components/top-bar/top-bar.assets.inline.js
        - renderers/html/components/top-bar/top-bar.inline.js
      forbidWatchlistTabRedraw: true
      requireModeSpecificAssets: true
      defaultInteraction: static-unless-explicitly-requested
      forbiddenSubstitutes:
        - home-topbar-for-secondary-page
        - chat-topbar-for-ordinary-page
        - css-drawn-watchlist-active-tab
        - screenshot-of-whole-topbar-as-runtime
  - id: renderer.html.bottom-bar
    sourceComponent: component.bottom-bar
    htmlStrategy:
      fidelity: high
      renderAs: reusable-web-component
      redrawForbiddenForConfirmedRuntimeVariants: true
      defaultInteraction: static
    htmlRuntime:
      assetPath: renderers/html/components/bottom-bar/bottom-bar.assets.inline.js
      path: renderers/html/components/bottom-bar/bottom-bar.inline.js
      customElement: xzl-bottom-bar
      inlineMode: inline-assets-then-runtime-inside-script
      noExternalDependencies: true
      attributes:
        scene:
          allowed:
            - home
            - chat
            - stock
          required: true
        theme:
          allowed:
            - light
            - dark
          required: true
        companion:
          allowed:
            - "on"
            - "off"
          default: "off"
    visualReferences:
      chat-dark: figma://pbxELN7TYDDguIgbXfc1zB/12:10180
      chat-light: figma://pbxELN7TYDDguIgbXfc1zB/12:10189
      home-dark: figma://pbxELN7TYDDguIgbXfc1zB/12:9199
      home-light: figma://pbxELN7TYDDguIgbXfc1zB/12:9208
      stock-dark: figma://pbxELN7TYDDguIgbXfc1zB/12:9221
      stock-light: figma://pbxELN7TYDDguIgbXfc1zB/12:9232
      companion-dark: figma://pbxELN7TYDDguIgbXfc1zB/12:9237
      companion-light: figma://pbxELN7TYDDguIgbXfc1zB/12:9243
      role: html-visual-acceptance-only
    figmaBindingsUnchanged: true
    figmaGenerationRoute: bindings/figma/components.yaml#components.component.bottom-bar
    localFallbacks:
      - bindings/assets/files/bottom-bar/icons/
      - bindings/assets/files/templates/bottom-bar-component.json
    sceneVariantDefaults:
      primary-core-page:
        scene: home
        examples:
          - 首页
          - 首页早点听入口卡片
          - 账户
          - 交易
          - 涨停猎手
          - 事件捕手
      ai-conversation:
        scene: chat
        allowedPages:
          - AI 对话页
          - 任务助手页
      stock-detail:
        scene: stock
        requiresSelectedSecurity: true
      companion:
        composition: overlay
        independentScene: false
        occupiesLayoutHeight: false
        mayOverlay:
          - home
          - stock
      no-bottom-bar:
        render: omit
        appliesTo:
          - 次级页面
          - 专题页
          - 无持续输入或底部操作需求的页面
      market-index:
        scene: 首页场景
        darkVariantId: default-dark
        lightVariantId: default-light
        source: bindings/figma/components.yaml#components.component.bottom-bar.confirmedVariants
        rule: 大盘页默认绑定首页态 bottom-bar；不得用个股、交易或对话态替代。
    outputChecklist: bindings/assets/files/templates/bottom-bar-output-checklist.json
    hardGates:
      requireDataComponent: component.bottom-bar
      confirmedRuntimeMustUse:
        - renderers/html/components/bottom-bar/bottom-bar.assets.inline.js
        - renderers/html/components/bottom-bar/bottom-bar.inline.js
        - xzl-bottom-bar
      fallbackVariantsRequireTemplate:
        - bindings/assets/files/templates/bottom-bar-component.json
      requireModeSpecificAssets: true
      defaultInteraction: static-unless-explicitly-requested
      forbiddenSubstitutes:
        - ordinary-five-tab-navigation
        - tabs-as-bottom-bar
        - button-group-as-bottom-bar
        - per-page-redraw-of-bottom-bar
        - css-drawn-icons
        - emoji-icons
        - lucide-icons
        - anonymous-inline-svg-icons
      failIfMissing:
        - safe-area
        - home-indicator
        - approved-bottom-bar-assets
        - variant-context-declaration
    evidenceRequirements:
      dataComponent: component.bottom-bar
      dataAttributes:
        component: data-component
        componentFamily: data-component-family
        bindingStatus: data-binding-status
      confirmedRuntimeRequiredFields:
        - runtimePath
        - assetPath
        - customElement
        - scene
        - theme
        - companion
        - visualReference
        - checklistResult
      fallbackVariantRequiredFields:
        - variant
        - templatePath
        - backgroundAsset
        - iconAssets
        - metricsSource
        - checklistResult
  - id: renderer.html.ai-message-components
    sourceComponent: component.message-feed
    htmlStrategy:
      fidelity: high
      renderAs: reusable-web-components
      redrawForbiddenForConfirmedRuntimeParts: true
      defaultInteraction: static
      ownsBusinessAnswerContent: false
    htmlRuntime:
      assetPath: renderers/html/components/ai-message/ai-message.assets.inline.js
      path: renderers/html/components/ai-message/ai-message.inline.js
      inlineMode: inline-assets-then-runtime-inside-script
      noExternalDependencies: true
      customElements:
        userBubble: xzl-user-bubble
        yomiIdentity: xzl-yomi-identity
        yomiStatus: xzl-yomi-status
        yomiAssistActions: xzl-yomi-assist-actions
      attributes:
        theme:
          allowed:
            - light
            - dark
          required: true
        name:
          appliesTo: xzl-yomi-identity
          default: Yomi
        thinking:
          appliesTo: xzl-yomi-status
          default: 深度思考
        label:
          appliesTo: xzl-yomi-status
          default: 模型完成答案生成
    appliesTo:
      - AI 对话页
      - 任务助手页
      - 消息页问答区域
    compositionContract:
      question:
        requiredElement: xzl-user-bubble
        role: user-input-bubble
      answer:
        requiredOrder:
          - xzl-yomi-identity
          - xzl-yomi-status
          - agent-generated-answer-content
          - xzl-yomi-assist-actions
        optionalElements:
          - xzl-yomi-status
        freeformSlots:
          agent-generated-answer-content: 段落、列表、表格、卡片、图表、来源、免责声明等按用户需求生成；不得放入 runtime 黑盒。
      assistantNaming:
        requiredName: Yomi
        rule: AI 助手身份、状态和回答相关表达默认使用 Yomi。
      defaultTailActions:
        requiredByDefault: true
        mayOmitOnlyWhen: 用户明确要求隐藏回答结束辅助功能。
    visualReference:
      localPreview: ../ai-message-components-preview/index.html
      supportedThemes:
        - dark
        - light
    hardGates:
      requireRuntimeUseForHtmlChatMessages: true
      forbidPerPageRedrawOf:
        - user-input-bubble
        - yomi-identity-row
        - agent-output-status
        - answer-assist-actions
      forbidRuntimeOwningBusinessAnswerContent: true
      themeMustMatchPage: true
      defaultAssistantName: Yomi
  - id: renderer.html.financial-table
    sourceComponent: component.financial-table
    figmaBinding:
      bindingSource: canon/components/component-semantics.yaml
      verificationRequired: false
    htmlStrategy:
      fidelity: low
      renderAs: scrollable-financial-table
      useTokens: true
      useLocalAssetsWhenNeeded: true
    localFallbacks:
      - bindings/assets/files/templates/watchlist-table-module.json
      - bindings/assets/files/templates/holding-table-module.json
  - id: renderer.html.trading-action-button
    sourceComponent: component.trading-action-button
    figmaBinding:
      bindingSource: authoring/components/trading-action-button.brief.yaml
      verificationRequired: true
    htmlStrategy:
      fidelity: low
      renderAs: paired-action-buttons
      useTokens: true
      useLocalAssetsWhenNeeded: false
    localFallbacks:
      - bindings/assets/files/templates/trading-order-form-inputs.json
  - id: renderer.html.market-index-modules
    sourceComponent: component.market-index-modules
    figmaBinding:
      bindingSource: bindings/figma/components.yaml
      verificationRequired: true
    htmlStrategy:
      fidelity: low
      renderAs: scrollable-market-index-card
      useTokens: true
      useLocalAssetsWhenNeeded: true
      componentFirst: true
    requiredFamilies:
      - market-index.background-shell
      - market-index.title-block
      - market-index.index-summary
      - market-index.abnormal-a-share
      - market-index.auction-panel
      - market-index.tab-strip
      - market-index.news-card
      - market-index.scroll-guide
    optionalFamilies:
      - market-index.hot-question-toggle
      - market-index.barrage-panel
      - market-index.barrage-chip
      - market-index.news-title
      - market-index.news-tip
    requiredChecklists:
      - canon/checklists/market-index-modules-review.yaml
    familyRendering:
      market-index.background-shell:
        renderAs: market-index-background-shell
        preserveStructure:
          - top-light-layer
          - body-shell
          - stroke
          - glow-or-inner-shadow
        forbiddenSubstitutes:
          - generic-dashboard-card
      market-index.title-block:
        renderAs: market-index-title-block
        preserveStructure:
          - title-text
          - trading-status-dot
          - trading-status-text
        forbiddenSubstitutes:
          - generic-text-row
          - merged-title-status-text
      market-index.index-summary:
        renderAs: market-index-horizontal-index-summary
        preserveFinancialSemantics: true
      market-index.abnormal-a-share:
        renderAs: market-index-abnormal-a-share-module
        preserveFinancialSemantics: true
      market-index.auction-panel:
        renderAs: market-index-auction-module
        preserveFinancialSemantics: true
      market-index.tab-strip:
        renderAs: market-index-tab-strip
        systemLayerStatus: temporary_scene_reference_until_system_layer_binding
      market-index.news-card:
        renderAs: market-index-news-card
        fallbackWhenBindingUnavailable: binding-pending-news-card
      market-index.scroll-guide:
        renderAs: market-index-scroll-guide
        firstScreenOnly: true
    hardGates:
      requireComponentEvidence: true
      defaultFailOnChecklistSeverity:
        - P0
      skillEvaluationFailOnChecklistSeverity:
        - P0
        - P1
      highRiskDeliveryFailOnChecklistSeverity:
        - P0
        - P1
      scopeNote: Skill 测评与高风险交付任务中 P0/P1 都阻断；普通探索任务默认 P0 阻断、P1 作为审阅警告。
      forbiddenSubstitutes:
        - generic-dashboard-card-instead-of-background-shell
        - generic-text-row-instead-of-title-block
        - local-tab-lookalike-when-system-tab-binding-exists
        - color-swapped-theme-instead-of-structural-theme-variant
      requireFallbackDisclosure: true
    fallbackPolicy:
      allowedOnlyWhen:
        - binding-missing
        - published-import-failed
        - font-or-permission-blocked
      requiredLayerOrDomMarkers:
        - 未绑定组件
        - binding pending
      mustNotLookLikeConfirmedComponent: true
    evidenceRequirements:
      dataComponent: component.market-index-modules
      mandatoryWhen:
        - skill-evaluation
        - high-risk-delivery
      optionalWhen:
        - ordinary-exploration
      dataAttributes:
        component: data-component
        componentFamily: data-component-family
        bindingStatus: data-binding-status
      requiredFields:
        - familiesRendered
        - componentBindingEvidence
        - rendererId
        - checklistResult
        - fallbackReason
