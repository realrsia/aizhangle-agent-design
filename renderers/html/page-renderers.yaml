id: renderers.html.pages
kind: renderer-registry
schemaVersion: 1
version: 0.1.0
status: draft
title: HTML 页面渲染器
summary: 面向 Agent 生成高保证原型 H5 页面渲染器映射。
renderers:
  - id: renderer.html.topbar-selection
    sourceComponent: component.topbar
    htmlStrategy:
      fidelity: high
      renderAs: fixed-topbar-scene-selector
      fixedChromeReuseRequired: true
    requiredInputs:
      - canon/components/topbar.meta.yaml
      - renderers/html/component-renderers.yaml
      - renderers/html/components/top-bar/top-bar.assets.inline.js
      - renderers/html/components/top-bar/top-bar.inline.js
    sceneRules:
      home:
        customElement: xzl-home-top-bar
        sourceComponent: component.home-topbar
        appliesTo:
          - 首页
          - 首页出招
          - 首页大盘
          - 首页提醒
          - 首页任务
          - 首页早点听入口卡片
      ai-chat:
        customElement: xzl-chat-top-bar
        sourceComponent: component.chat-topbar
        appliesTo:
          - AI 对话页
          - 任务助手页
      trade:
        customElement: xzl-trade-top-bar
        appliesTo:
          - 交易页
          - 下单页
          - 委托页
          - 条件单入口
      morning:
        customElement: xzl-morning-top-bar
        appliesTo:
          - 早点听详情页
      watchlist:
        customElement: xzl-watchlist-top-bar
        attributes:
          active:
            allowed:
              - 自选
              - 触发
              - 模拟
              - 持股
            default: 自选
        appliesTo:
          - 自选页
          - 自选股页
      stock-detail:
        customElement: xzl-stock-top-bar
        appliesTo:
          - 个股详情页
          - 股票详情页
      default-secondary:
        customElement: xzl-secondary-top-bar
        appliesTo:
          - 次级页面
          - 专题页
          - 未特殊声明页面
        rule: 除首页、AI 对话、交易、早点听详情页、自选、个股详情之外，默认使用次级页面导航栏。
    hardGates:
      inlineOrder:
        - renderers/html/components/top-bar/top-bar.assets.inline.js
        - renderers/html/components/top-bar/top-bar.inline.js
      forbidPerPageTopbarRedraw: true
      requireThemeMatch: true
  - id: renderer.html.watchlist-page
    sourceScenario: scenario.watchlist
    sourceArchetype: archetype.mobile-list-page
    htmlStrategy:
      fidelity: low
      renderAs: mobile-fixed-shell-with-scroll-list
      useTokens: true
      useLocalAssetsWhenNeeded: true
    requiredInputs:
      - canon/scenarios/watchlist.yaml
      - canon/archetypes/mobile-list-page.yaml
      - renderers/html/component-renderers.yaml
      - canon/checklists/visual-review.yaml
  - id: renderer.html.ai-chat-page
    sourceScenario: scenario.ai-chat
    sourceArchetype: archetype.mobile-chat-page
    htmlStrategy:
      fidelity: high
      renderAs: mobile-chat-shell
      useTokens: true
      useLocalAssetsWhenNeeded: true
      fixedChromeReuseRequired: true
    requiredInputs:
      - canon/scenarios/ai-chat.yaml
      - canon/archetypes/mobile-chat-page.yaml
      - renderers/html/component-renderers.yaml
      - renderers/html/components/page-background/page-background.assets.inline.js
      - renderers/html/components/page-background/page-background.inline.js
      - renderers/html/components/top-bar/top-bar.assets.inline.js
      - renderers/html/components/top-bar/top-bar.inline.js
      - renderers/html/components/bottom-bar/bottom-bar.assets.inline.js
      - renderers/html/components/bottom-bar/bottom-bar.inline.js
      - canon/checklists/visual-review.yaml
    requiredRenderers:
      - renderer.html.primary-page-background
      - renderer.html.chat-topbar
      - renderer.html.bottom-bar
    requiredComponents:
      - component.page-background
      - component.chat-background
      - component.chat-topbar
      - component.message-feed
      - component.chat-input
      - component.bottom-bar
    fixedChrome:
      backgroundAssetPath: renderers/html/components/page-background/page-background.assets.inline.js
      backgroundRuntimePath: renderers/html/components/page-background/page-background.inline.js
      topbarAssetPath: renderers/html/components/top-bar/top-bar.assets.inline.js
      topbarRuntimePath: renderers/html/components/top-bar/top-bar.inline.js
      bottomBarAssetPath: renderers/html/components/bottom-bar/bottom-bar.assets.inline.js
      bottomBarRuntimePath: renderers/html/components/bottom-bar/bottom-bar.inline.js
      topbarElement: xzl-chat-top-bar
      backgroundElement: xzl-page-background
      backgroundAttributes:
        scene: chat
      bottomBarElement: xzl-bottom-bar
      bottomBarAttributes:
        scene: chat
        companion: "off"
      themeMustMatchPage: true
      defaultInteraction: static
      redrawForbidden: true
      figmaBindingsUnchanged: true
    layoutContract:
      viewport:
        width: 390
        height: 844
      topbar:
        fixed: true
        height: 91
      bottomInput:
        fixed: true
        height: 171
      messageFeed:
        scrollable: true
        bottomClearance:
          referenceEdge: bottom-bar-body-top
          gapPx: 20
          includeSafeAreaInReservedHeight: true
          excludeTransparentShadowFromReservedHeight: true
          allowContentUnderTransparentShadow: true
          forbidFullBottomBarHeightPlusExtraSpacer: true
  - id: renderer.html.primary-home-shell
    sourceComponent: component.page-background
    htmlStrategy:
      fidelity: high
      renderAs: primary-page-fixed-shell
      useTokens: true
      fixedChromeReuseRequired: true
    appliesTo:
      - 首页
      - 首页早点听入口卡片
      - 涨停猎手
      - 事件捕手
    requiredRenderers:
      - renderer.html.primary-page-background
      - renderer.html.home-topbar
      - renderer.html.bottom-bar
    fixedChrome:
      backgroundElement: xzl-page-background
      topbarElement: xzl-home-top-bar
      bottomBarElement: xzl-bottom-bar
      bottomBarAttributes:
        scene: home
      themeMustMatchPage: true
      defaultInteraction: static
    pendingBackgroundCoverage:
      - 交易页
      - 个股详情页
  - id: renderer.html.market-index-page
    sourceScenario: scenario.market-index
    sourceArchetype: archetype.market-overview-page
    htmlStrategy:
      fidelity: low
      renderAs: mobile-market-index-shell
      useTokens: true
      useLocalAssetsWhenNeeded: true
      componentFirst: true
    requiredInputs:
      - authoring/scenarios/market-index.brief.yaml
      - canon/archetypes/market-overview-page.yaml
      - canon/components/market-index-modules.meta.yaml
      - canon/components/bottom-bar.meta.yaml
      - renderers/html/component-renderers.yaml
      - bindings/assets/files/templates/bottom-bar-component.json
      - bindings/assets/files/templates/bottom-bar-output-checklist.json
      - canon/checklists/market-index-modules-review.yaml
      - canon/checklists/bottom-bar-review.yaml
      - canon/checklists/visual-review.yaml
    requiredRenderers:
      - renderer.html.market-index-modules
      - renderer.html.bottom-bar
    requiredComponents:
      - component.market-index-modules
      - component.bottom-bar
    defaultComponentVariants:
      component.bottom-bar:
        scene: 首页场景
        darkVariantId: default-dark
        lightVariantId: default-light
        bindingSource: bindings/figma/components.yaml#components.component.bottom-bar.confirmedVariants
        rule: 大盘页属于首页体系，默认使用 bottom-bar 首页态，不得改用个股、交易或对话态。
    requiredChecklists:
      - canon/checklists/market-index-modules-review.yaml
      - canon/checklists/bottom-bar-review.yaml
      - bindings/assets/files/templates/bottom-bar-output-checklist.json
    hardGates:
      defaultFailOnSeverity:
        - P0
      skillEvaluationFailOnSeverity:
        - P0
        - P1
      highRiskDeliveryFailOnSeverity:
        - P0
        - P1
      scopeNote: Skill 测评与高风险交付任务中 P0/P1 都阻断；普通探索任务默认 P0 阻断、P1 作为审阅警告。
      forbiddenSubstitutes:
        - ordinary-five-tab-bottom-navigation
        - css-hand-drawn-bottom-bar-icons
        - generic-dashboard-card-instead-of-market-index-background
        - generic-text-row-instead-of-market-index-title-block
      requireComponentEvidence: true
      requireChecklistEvidence: true
      requireFallbackDisclosure: true
    evidenceRequirements:
      outputFile: generation-evidence.json
      mandatoryWhen:
        - skill-evaluation
        - high-risk-delivery
      optionalWhen:
        - ordinary-exploration
      equivalentFigmaEvidence:
        - right-side-annotation-card
        - layer-name-or-shared-data-binding-markers
      requiredFields:
        - scenario
        - theme
        - componentsUsed
        - renderersUsed
        - assetsUsed
        - checklistsRun
        - fallbacksUsed
        - failedBindings
