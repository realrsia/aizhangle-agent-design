version: 1
registry_name: ai_zhangle_icons
primary_library: "lucide"
policy:
  single_library_per_screen: true
  use_whitelist_first: true
  fallback_rule: "if_exact_icon_is_missing_use_nearest_semantic_lucide_substitute"
  font_icon_policy: "not_recommended"
  notes: "Agents should pick icons from this whitelist first. Do not invent icon names and do not mix multiple icon libraries in the same screen."

icons:
  search:
    approved_name: "search"
    aliases: ["搜索", "查找"]
  filter:
    approved_name: "list-filter"
    aliases: ["筛选", "过滤"]
