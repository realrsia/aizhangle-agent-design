version: 1
registry_name: ai_zhangle_components
figma_library_file_key: WVlhA7fa8R0Vxam7Q0nP0S

figma_binding_strategy:
  verify_before_instantiation: true
  required_checks: ["component_key_or_exact_name", "variant_property_names", "variant_values", "text_override_targets"]
  fallback_rule: "if_property_names_or_variant_values_do_not_match_figma_stop_and_recheck_instead_of_guessing"
  notes: "Agents must verify the actual Figma component instance and its property schema before instantiating or overriding a component. Do not guess variant names or property values."

icon_strategy:
  primary_library: "lucide"
  fallback_library: "semantic_substitute_within_lucide"
  reserve_libraries: ["tabler_icons", "iconoir", "remix_icon"]
  default_size_px: 24
  default_style: "outline"
  color_binding: "semantic_tokens_only"
  mixing_rule: "single_library_per_screen_lucide_only_by_default"
  placement_rule: "icons_may_enter_primary_structure_only_when_allowed_by_component_or_design"
  font_icon_policy: "not_recommended"
  replacement_rule: "use_nearest_semantic_lucide_icon_when_exact_symbol_is_missing"
  notes: "Use Lucide by default for clean outline consistency. If exact coverage is missing, stay inside Lucide and choose the closest semantic substitute instead of mixing libraries or introducing font icons."

layout_strategy:
  default_container_mode: "figma_auto_layout"
  required_for: ["cards", "modules", "dense_rows", "headers", "button_groups", "bottom_docks", "chart_wrappers", "text_bearing_containers"]
  forbidden_primary_pattern: "free_floating_text_breaking_module_bounds"
  absolute_position_rule: "decorative_or_overlay_only"
  text_clipping_allowed: false
  single_line_text_vertical_alignment: "center_or_match_component_spec"
  single_line_container_min_height_rule: "line_height_plus_vertical_padding"
  auto_layout_text_overflow_policy: "fail_if_fixed_height_clips_text"
  container_height_must_not_be_less_than_rendered_text_height: true
  notes: "Primary information layout should be expressed through Auto Layout so dynamic text and data do not break the module."

chart_strategy:
  default_source: "echarts"
  allowed_sources: ["echarts", "approved_chart_library_export"]
  rendering_rule: "prefer_chart_library_output_over_manual_shape_drawing"
  wrapper_rule: "chart_modules_should_use_auto_layout_for_titles_legends_metrics_and_annotations"
  notes: "Charts should be sourced from a charting library and then placed into the design-system layout instead of being manually reconstructed with arbitrary shapes."

text_node_strategy:
  overflow_prevention_required: true
  multiline_text_horizontal: "fill_container"
  multiline_text_vertical: "auto_height"
  text_clipping_allowed: false
  multi_line_text_requires_auto_height: true
  short_label_default: "hug_contents"
  parent_layout_requirement: "text_inside_modules_should_live_in_auto_layout_containers"
  notes: "When text lives inside Auto Layout and may wrap, use fill on the horizontal axis and auto height on the vertical axis to prevent overflow."

