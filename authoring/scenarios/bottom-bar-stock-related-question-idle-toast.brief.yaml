# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: scenario.bottom-bar.stock-related-question-idle-toast
name: 个股场景关联问空闲提示 Bottom Bar
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  定义关联问空闲提示的使用方式：当用户在一级页面或个股详情页停留一段时间没有操作时，
  Bottom Bar 可以展示 Toast 式引导，提示用户进行系统预测、功能操作或个股分析。
  提示出现后持续存在，直到用户点击关闭。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户在没有主动输入时获得轻量提示，知道可以继续追问、做功能预测或进入个股分析，
  但不会被误导成交易建议或下单提示。

# [HUMAN REQUIRED]
requiredContent:
  - "真实 `bottom bar/母组件` 关联问变体。"
  - 一级页面：输入胶囊上方或内部的 Toast 覆盖提示。
  - 个股详情：左侧 Toast 引导，交易 / 买 / 卖 / 撤按钮收成一个入口按钮。
  - 个股场景默认优先使用带指数模块的黑白版关联问变体。
  - Toast 关闭入口。
  - 输入胶囊、指数模块和 iOS home indicator / safe area 按真实变体保留。

# [HUMAN REQUIRED]
behavior:
  trigger: user-idle
  persistence: persist-until-user-closes
  closeRule: 用户点击关闭后，本次提示消失；是否在后续重新出现由产品策略另行确认。
  copyExamples:
    - 当前个股创 200 日新高，去分析一下
    - 当前个股异动明显，看看可能原因
    - 要不要分析一下这只个股的趋势变化

# [HUMAN REQUIRED]
allowedZones:
  - primary_page_bottom_composer
  - stock_detail_bottom_composer
  - stock_quote_bottom_action
  - related_question_idle_toast_overlay

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不要在用户正在键盘输入、长按语音、录音或松开发送状态展示空闲 Toast。
  - 不要在订单确认、交易表单提交或买卖撤直接操作区展示空闲 Toast。
  - 不要把 Toast 文案写成确定性投资建议或收益承诺。
  - 不要在个股详情空闲提示中同时展开交易、买、卖、撤多个按钮。

# [HUMAN REQUIRED]
riskWarnings:
  - id: idle-toast-not-investment-advice
    severity: P1
    rule: 关联问 Toast 只能做引导，不得承诺收益、替用户决策或暗示确定性投资结果。
  - id: stock-related-actions-collapse-required
    severity: P1
    rule: 个股详情空闲提示出现时，交易动作应收成一个入口按钮，避免形成直接下单引导。

