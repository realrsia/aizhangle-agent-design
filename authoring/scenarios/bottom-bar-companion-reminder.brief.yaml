# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: companion-context-matches-page
    question: 陪伴场景是否与页面上下文一致？
    passCriteria: 首页、预交易、个股详情三类陪伴文案和用途不得混用。
  - id: companion-buttons-left-aligned
    question: 操作按钮是否左对齐，并正确处理单按钮 / 多按钮？
    passCriteria: 单按钮只保留左侧按钮，多按钮保持左对齐，不留空占位。
  - id: companion-link-not-primary-action
    question: 详情链接是否只用于查看提醒或文案详情？
    passCriteria: 详情链接不能替代主按钮，也不能作为下单或交易动作。
  - id: companion-copy-not-investment-advice
    question: 个股详情陪伴文案是否避免确定性投资建议？
    passCriteria: 可以引导分析原因，但不得承诺收益、直接建议买卖或替用户决策。
  - id: companion-height-accounted
    question: 陪伴模块高度和页面避让是否正确？
    passCriteria: 陪伴模块不得遮挡指数、输入胶囊、交易风险信息或 home indicator。

