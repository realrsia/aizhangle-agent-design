    rule: dark 页面中的选中胶囊需使用主红色系边框/底色和更高字重。
  - familyId: market-index.tab-pill
    variant: 选中态=Off, 场景=变体/历史记录标签, Dark=On
    rule: dark 页面中的未选中胶囊需使用次级底色和次级文字色。
  - familyId: market-index.tab-pill
    variant: 选中态=On, 场景=变体/历史记录标签, Dark=Off
    rule: light 页面中的选中胶囊需保持与 dark 对应的选中语义，但切换到 light 主题规范色。
  - familyId: market-index.tab-pill
    variant: 选中态=Off, 场景=变体/历史记录标签, Dark=Off
    rule: light 页面中的未选中胶囊需切换到 light 主题下的次级底色和文字色。
