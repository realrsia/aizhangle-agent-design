# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: scenario.market-index
name: 大盘场景
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐移动端大盘场景，承载市场状态扫描、涨跌风格判断和后续资讯进入。
  当前这一版 brief 按 Figma 中逐个选中的母组件 family 增量维护，
  每一轮只补当前选中的 component set，不把未选中的兄弟 family 视作已确认事实。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户进入大盘页后，应能在首屏快速判断整体市场强弱、主要指数走势、异动方向和可继续深入的资讯或交易线索。

# [HUMAN REQUIRED]
requiredContent:
  - 顶部导航与系统状态区域，用于明确当前页面位置和系统层入口。
  - 大盘背景壳与标题模块，用于建立大盘页身份、主题氛围和市场交易状态。
  - 指数扫描区，至少覆盖固定指数种类、涨跌数值、涨跌幅和横向浏览反馈。
  - A股异动、竞价、弹幕、资讯和 tab 区域，用于表达市场热点、资金风格和后续阅读入口。
  - 首屏滑动引导和底部结构，用于提示可继续浏览且不遮挡核心行情内容。

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不得把大盘页降级为普通 dashboard 卡片堆叠。
  - 不得改变模块顺序、指数种类、资讯标题栏目词或默认选中状态。
  - 不得把真实 Figma component family、首屏 usage instance、截图和 HTML 原型 fallback 混为同一真源。
  - 不得把 light / dark 仅当作换色处理，忽略背景壳、标题、glow、纹理、描边和内阴影的结构差异。
  - 不得反转金融红涨绿跌语义，或引入脱离 token 体系的局部特殊色。

# [HUMAN REQUIRED]
usedIn:
  - market-index-full-page
  - market-index-first-screen
  - html-prototype-market-index
  - figma-review-market-index

# [HUMAN REQUIRED]
humanRules:
  do:
    - 当前轮次只登记 Figma 当前选中的母组件 family，不把未选中的兄弟 family 视作已确认事实。
    - 全量 light 与全量 dark 仍是场景主真源，背景 family 需要同时服务这两套主样本。
    - 1屏 light 与 1屏 dark 只用于 HTML 默认 390x844 首屏裁切参考。
    - 背景 family 只作为页面或大盘卡片外壳使用，不承担正文内容表达。
    - 背景 family 必须绑定对应 light / dark 标准主题，不允许脱离标准 token 自定义局部特殊色。
    - 顶部导航栏、底bar、tab切换条按系统层组件处理，其中顶部导航栏和底bar直接沿用现有 skill 规范。
    - 指数区域默认停在上证指数，tab 默认选中涨停猎手。
    - 弹幕默认从右向左自动滚动。
    - 资讯标题栏目词固定，资讯种类与 tab 选中状态同步。
  dont:
    - 不要把页面正例 frame 或 prototype 画板误写成母组件 family。
    - 不要把背景 family 当成内容卡片、资讯项或通用容器组件复用。
    - 不要在未重新选中其他母组件前，把兄弟 family 的变体猜写进当前 brief。
    - 不要让 1屏 变体替代全屏变体成为主规范背景。
    - 不要改变模块顺序。
    - 不要改变指数种类。
    - 不要把页面做成普通 dashboard。

# [HUMAN REQUIRED]
riskWarnings:
  - id: market-index-background-source-of-truth
    severity: P0
    rule: >
      背景 family 是大盘页面壳层的真实 Figma 母组件，必须优先使用其真实变体，
      不得用相似 frame 或截图替代。
  - id: market-index-background-theme-consistency
    severity: P0
    rule: >
      light 与 dark 必须严格对应真实主题，不得混用或只维护单套主题。
      不允许局部特殊色脱离标准 token 体系单独存在。
  - id: market-index-background-first-screen-scope
    severity: P1
    rule: >
      1屏 变体只用于首屏裁切与原型视口，不得替代全屏变体作为主页面背景。

# [HUMAN REQUIRED]
allowedZones:
  - page_shell
  - market_index_card_background
  - first_screen_crop_shell

# [HUMAN REQUIRED]
forbiddenZones:
  - news_list_item
  - inline_content_module
  - generic_dashboard_card

# [HUMAN REQUIRED]
requiredPairings:
  - full-light-and-dark-reference
  - first-screen-crop-reference
  - semantic-top-nav
  - semantic-bottom-structures

# [HUMAN REQUIRED]
forbiddenPairings:
  - usage-frame-as-family
  - screenshot-as-component-definition
  - first-screen-as-primary-truth

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "7:6308"
      reason: dark 首屏背景母组件真实变体。
    - figmaNodeId: "31:18747"
      reason: dark 全屏背景母组件真实变体。
    - figmaNodeId: "7:6910"
      reason: light 首屏背景母组件真实变体。
    - figmaNodeId: "31:18755"
      reason: light 全屏背景母组件真实变体。
  needsReview:
    - figmaNodeId: "3:2360"
      reason: 1屏 dark 页面正例，只能当 usage instance，不是背景 family 定义。
    - figmaNodeId: "3:4021"
      reason: 1屏 light 页面正例，只能当 usage instance，不是背景 family 定义。
  bad:
    - reason: 把大盘_全量_light 或 大盘_全量_dark 直接写成 component family。
    - reason: 用通用白底卡片或通用深色面板替代真实背景 family。

# [HUMAN REQUIRED]
componentHumanRules:
  do:
    - 同一个 Figma component set 下的真实子变体应进入 variantGroups 与 variantHumanRules。
    - 兄弟母组件等到后续被单独选中后，再逐组补入各自 family。
    - 页面级正例只进入 usageInstanceGroups。
    - 系统层组件可以先在当前场景 brief 中登记引用规则，待系统层 brief/canon 完整后再回填正式绑定。
  dont:
    - 不要把当前已选中的 family 与未选中的兄弟 family 混写在同一轮事实区。
    - 不要在 componentKey、文本覆盖字段或 token 绑定未确认时硬猜。

# [HUMAN REQUIRED]
pageBehaviorRules:
  defaultStates:
    indexDefault: 上证指数
    tabDefault: 涨停猎手
    barrageMotion: 从右向左自动滚动
    scrollGuide:
      firstScreenOnly: true
      reappearAfterReturnToTop: false
  fixedStructure:
    moduleOrderLocked: true
    indexTypesLocked: true
    newsCategoryOrderLocked: false
    newsTitleLabelsFixed: true
    newsCategoryFollowsTab: true
  contentReplacement:
    replaceable:
      - 数字
      - 股票名
      - 资讯文案
    nonReplaceable:
      - 模块顺序
      - 指数种类
      - 资讯标题栏目词
  deliveryPriority:
    - HTML 原型
    - 审稿规则
    - 页面规范文档
  hardFailures:
    - 不能换模块顺序
    - 不能把红涨绿跌做反
    - 不能把首屏引导做错
    - 不能把系统组件替错
    - 不能把页面做成普通 dashboard

# [HUMAN REQUIRED]
systemComponentRefs:
  topNav:
    source: existing_skill
    bindingId: top_nav_secondary
    status: ready_to_reference
    note: 顶部导航栏直接沿用现有 skill 中的系统层规范，不在当前 brief 内重写。
  bottomBar:
    source: existing_skill
    bindingId: bottom_bar
    status: ready_to_reference
    note: 底bar直接沿用现有 skill 中的系统层规范，不在当前 brief 内重写。
  tabStrip:
    source: system_layer_pending
    bindingId: content_tab_strip
    status: temporary_scene_reference
    note: 建议系统层绑定名为 content_tab_strip；当前先在场景 brief 中记录 tab 结构与状态规则，系统层组件补齐后替换为正式绑定。
  tabPill:
    source: system_layer_pending
    bindingId: content_tab_pill
    status: temporary_scene_reference
    note: 建议系统层绑定名为 content_tab_pill；当前先在场景 brief 中记录胶囊状态规则，系统层组件补齐后替换为正式绑定。

# [HUMAN REQUIRED]
topNavImplementationBoundary:
  semanticRules:
    - For the market page top navigation, semantic text and rise/fall values should use tokenized color roles.
  privateVisualRules:
    - Glass fills, local strokes, and glow treatments may remain node-private values when they are component-specific and not reused across modules.
  sourceRules:
    - The sidebar entry orb is a source-sensitive visual component and must not be replaced with a lookalike single-image substitute.

# [HUMAN REQUIRED]
generationContract:
  viewport:
    prototypeDefault: 390x844
    primaryTruth: full_light_and_dark
  pageComposition:
    topNav: fixed_system_component
    pageBody: scrollable_market_card
    bottomBar: fixed_system_component
    workspaceBottomNav: fixed_required_structure
  generationTargets:
    - html_prototype
    - figma_review
    - scenario_canon
  mustKeep:
    - 模块顺序固定
    - 指数种类固定
    - 资讯标题栏目词固定
    - 资讯种类与 tab 同步
    - 弹幕自动从右向左滚动
    - 滑动引导仅在一屏初始显示且滑动后消失
  mayChange:
    - 数字
    - 股票名
    - 资讯文案
    - 资讯分类顺序

# [HUMAN REQUIRED]
backgroundShellScenarioBoundary:
  sourceOfTruth:
    familySource:
      figmaComponentSetNodeId: "7:6911"
      variants:
        darkFirstScreen: "7:6308"
        darkFullScreen: "31:18747"
        lightFirstScreen: "7:6910"
        lightFullScreen: "31:18755"
      note: family 真源用于解释背景卡组件来源与 light/dark + 1屏/全屏 变体体系。
    usageInstanceSource:
      firstScreenDark: "3:2360"
      firstScreenLight: "3:4021"
      note: 1屏实例真源用于当前页面首屏还原时的定位、层级和场景约束判断。
  restorationPriority:
    firstScreenRestoration: usage_instance_source_first
    familyNormalization: family_source_first
    rule: 当前任务若是 1屏卡片还原，应优先跟随 1屏实例真源；family 真源不覆盖实例节点的定位与层级事实。
  scenarioPositionConstraint:
    topOffsetPx: 72
    appliesTo:
      - market-index-first-screen
      - market-index-full-page
    note: 72px 顶部定位属于 market-index 场景定位约束，覆盖 1屏 与 全量，不外推为通用设计规律。
  structuralRequirements:
    - 背景卡必须保留顶部光层与卡片主体壳的分层关系。
    - 深色版必须保留深底、弱描边、顶部 glow、内发光或内阴影的层级关系。
    - 浅色版必须保留白底、白描边、顶部纹理光层，以及与卡片上沿的衔接关系。
    - light 与 dark 属于结构变体，不能只靠替换颜色 token 处理。
  forbiddenSimplifications:
    - 不得把背景卡简化成 generic dashboard card。
    - 不得默认压平成单层 background + border + shadow 容器。

# [HUMAN REQUIRED]
extensionModel:
  mode: incremental-selected-families
  mainFamily: market-index.background-shell
  rationale: >
    brief 按当前在 Figma 中逐个选中的母组件 family 增量维护。
    背景 family 作为 main family 保留在 variantGroups 中，
    其余被单独选中的 family 追加到 componentFamilies 和 familyVariantGroups 中。

# [HUMAN REQUIRED]
componentFamilies:
  - id: market-index.background-shell
    figmaNodeId: "7:6911"
    componentKey: 57900b6e064fd94b5c32a1efe9feff70bea8e4d9
    figmaName: 背景
    familyRole: main
    usedIn:
      - page_shell
      - market_index_card_background
      - first_screen_crop_shell
    allowedZones:
      - page_shell
      - market_index_card_background
      - first_screen_crop_shell
    forbiddenZones:
      - news_list_item
      - inline_content_module
      - generic_dashboard_card
    humanRules:
      do:
        - 作为大盘页面和大盘工作卡的外层背景壳使用。
        - 按 1屏 / 全屏 与 light / dark 组合选择真实变体。
        - 主题颜色必须绑定标准 light / dark token 体系。
        - 页面 1屏 还原时，优先参考 1屏 实例真源中的定位与层级事实。
        - 保留顶部光层、卡片主体壳、描边、内发光或内阴影的分层关系。
      dont:
        - 不要把背景壳层当成可自由替换的普通容器。
        - 不要在深浅色之间交叉复用。
        - 不要加入脱离标准 token 的局部特殊色。
        - 不要把 light / dark 仅当成换色处理。
        - 不要把背景卡压平成 generic dashboard card。
    riskWarnings:
      - 背景 family 是页面还原准确度的基础壳层，错误变体会直接破坏整页 fidelity。
      - 允许在首页其他场景复用，但必须保持真实背景 family 的主题与尺寸变体边界。
  - id: market-index.title-block
    figmaNodeId: "7:6941"
    componentKey: 4d75187a01c3ad765b44a17f8da1505bde802916
    figmaName: 标题
    sourceVariants:
      dark: "7:6301"
      light: "7:6940"
    stableScenarioFacts:
      structure:
        - main_title_text
        - status_dot
        - status_text
      visualVariants:
        dark: 深色版标题包含渐变字表现和独立圆点处理，应按节点保留。
        light: 浅色版标题为实色文字，圆点与文字保持一致颜色，应按节点保留。
      flowOwnership:
        appliesTo:
          - market-index-first-screen
          - market-index-full-page
        rule: 标题属于大盘工作卡内容流，不应被视为屏幕独立绝对锚定元素；位置判断需要结合卡片内容流起点。
    implementationPatchExclusions:
      - 某次圆点颜色没同步。
      - 某次渐变字 fallback 看起来偏差。
      - 某次 padding、gap 或对齐值的临时补丁。
      - 某次浏览器里偏 1px 或 2px 的调试结果。
      - 某次当前位置算错的实现事故。
    familyRole: supporting
    usedIn:
      - market_index_card_header
      - page_section_title
    allowedZones:
      - market_index_card_header
      - page_section_title
    forbiddenZones:
      - news_list_item
      - bottom_dock
      - generic_dashboard_card
    humanRules:
      do:
        - 用于大盘场景顶部标题区，表达页面标题与当前市场状态。
        - 深浅色必须绑定对应标准主题，不允许脱离标准 token。
        - 审稿与高保真原型场景优先保持与 Figma 一致的字形效果。
        - 保留主标题文本、圆点、状态文字三段结构，不要把 `• 交易中` 当成单串普通文本。
        - 标题位置必须按卡片内容流起点判断，1屏 与 全量都适用。
      dont:
        - 不要把标题 family 当成通用标签、按钮或导航项。
        - 不要拆散标题和状态文本的组合关系。
        - 不要加入脱离标准 token 的局部特殊色。
        - 在目标环境无法稳定拿到同款字体时，不要用近似字体硬替造成明显字形偏差。
        - 不要把标题当成屏幕独立绝对锚定元素。
        - 不要把 light / dark 标题只当成同一文本的换色版本。
    riskWarnings:
      - 标题 family 直接承载场景语义，误用会让大盘页失去明确标题与状态提示。
      - 当前不复用到首页其他带“标题+状态”的卡片头部，应保持为大盘场景私有 family。
  - id: market-index.index-summary
    figmaNodeId: "7:6302"
    componentKey: 2c8497856e210074e83c2183bcf545ce863041d1
    figmaName: 指数
    familyRole: supporting
    usedIn:
      - market_index_top_summary
      - market_index_horizontal_scan
    allowedZones:
      - market_index_top_summary
      - market_index_horizontal_scan
    forbiddenZones:
      - bottom_dock
      - news_list_item
      - generic_dashboard_card
    humanRules:
      do:
        - 用于大盘顶部的指数扫描区，承载多指数横向浏览。
        - 指数展示模块允许左右滑动，底部导航栏需要跟随当前滑动位置。
        - 深色版和浅色版都必须使用规范色，涨跌语义保持红涨绿跌，不允许局部特殊色脱离标准 token。
      dont:
        - 不要把指数模块改造成静态单指标卡片。
        - 不要让底部导航栏与横向滑动状态脱节。
        - 不要把涨跌颜色替换成非规范金融语义色。
    riskWarnings:
      - 指数模块是大盘首层扫描入口，横向浏览与导航反馈错误会直接影响行情阅读效率。
      - 当前不复用到首页其他场景，应保持为大盘场景私有 family。
  - id: market-index.abnormal-a-share
    figmaNodeId: "7:6303"
    componentKey: 3255456fccafa816bf6c55f489fd6838b8233773
    figmaName: A股异动
    familyRole: supporting
    usedIn:
      - abnormal_sector_scan
      - market_index_signal_map
    allowedZones:
      - abnormal_sector_scan
      - market_index_signal_map
    forbiddenZones:
      - bottom_dock
      - news_list_item
      - generic_dashboard_card
    humanRules:
      do:
        - 用于大盘场景中的板块异动扫描区，承载板块标签、走势底图、时间轴和涨跌阈值阅读。
        - 右上角的热问开关作为独立 family 使用，需按深浅色变量切换。
        - 除热问开关外，其余结构必须使用规范色对应深色版和浅色版，不允许局部特殊色脱离标准 token。
      dont:
        - 不要把 A股异动 拆成普通标签流或通用图表卡。
        - 不要把热问开关混写成主模块内部的普通文本状态。
        - 不要改变红涨绿跌和蓝色走势线的金融语义。
    riskWarnings:
      - A股异动 模块同时承担信号扫描与行情结构表达，若颜色、轴线或标签语义错误会直接误导阅读。
      - 当前不复用到首页其他场景，应继续保持大盘私有 family。
  - id: market-index.hot-question-toggle
    figmaNodeId: "23:17460"
    componentKey: f07956989f78bf36f7db0980ceea901bbcef7f56
    figmaName: A股异动/热问开关
    familyRole: supporting
    usedIn:
      - abnormal_sector_secondary_toggle
    allowedZones:
      - abnormal_sector_scan
    forbiddenZones:
      - top_nav
      - bottom_dock
      - news_list_item
    humanRules:
      do:
        - 只作为 A股异动 右上角的局部开关使用。
        - 必须根据 dark=on/off 使用对应的开关变量和文字颜色。
      dont:
        - 不要扩展成页面级通用开关。
        - 不要脱离 A股异动 family 单独漂浮使用。
    riskWarnings:
      - 热问开关的深浅色变量已明确存在，不允许用近似样式替代真实变体。
      - 当前不复用到其他板块异动类模块，应保持为 A股异动 场景私有 family。
  - id: market-index.barrage-panel
    figmaNodeId: "7:6304"
    componentKey: cf254d3f385a8f67c0d72cca09a8804371a42f32
    figmaName: 弹幕
    familyRole: supporting
    usedIn:
      - market_index_signal_barrage
      - rolling_message_zone
    allowedZones:
      - market_index_signal_barrage
      - rolling_message_zone
    forbiddenZones:
      - bottom_dock
      - news_list_item
      - generic_dashboard_card
    humanRules:
      do:
        - 用于大盘场景中的辅助消息扫描区，承载弹幕区域内的自动滚动消息。
        - 区域内消息应在遮罩范围内自动滚动播放，保持双行错位的连续扫描感。
        - 单条消息必须引用独立的 `弹幕/消息` family，并区分 `普通` 与 `热点` 两种变量。
        - 使用规范色；热点消息中的热点标识使用标准红色语义。
      dont:
        - 不要把弹幕区域改成静态列表或普通标签墙。
        - 不要把单条消息直接写死在主模块里，跳过独立消息 family。
        - 不要让滚动内容超出遮罩区裸露显示。
    riskWarnings:
      - 弹幕区域承担快速辅助扫描角色，若滚动逻辑、遮罩或消息变体错误，会直接破坏可读性。
      - 当前不复用到首页其他场景，应继续保持大盘私有 family。
