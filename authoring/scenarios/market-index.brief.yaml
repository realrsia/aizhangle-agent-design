    variant: 分类=行情速览
    rule: 行情速览需保留速览总结和信号打点，不应改成长文样式。
  - familyId: market-index.news-card
    variant: 分类=事件捕手
    rule: 事件捕手需保留事件标签、传导链路和标的滚动结构。
  - familyId: market-index.news-card
    variant: 分类=市场要闻
    rule: 市场要闻需保留时间、标题和摘要结构，不应混入速览打点。
  - familyId: market-index.news-title
    variant: 单行=on, dark=on
    rule: dark 单行标题用于简洁标题，使用深色主题下标题色。
  - familyId: market-index.news-title
    variant: 单行=on, dark=off
    rule: light 单行标题用于简洁标题，切换到浅色主题下标题色。
  - familyId: market-index.news-title
    variant: 单行=off, dark=on
    rule: dark 双行标题用于更复杂的标题+副信息组合，保持深色主题层级。
  - familyId: market-index.news-title
    variant: 单行=off, dark=off
    rule: light 双行标题用于更复杂的标题+副信息组合，切换到浅色主题层级。
  - familyId: market-index.news-tip
    variant: 状态=单条
    rule: 单条提示仅保留箭头提示，不显示数量。
  - familyId: market-index.news-tip
    variant: 状态=多条
    rule: 多条提示需显示数量和箭头，明确表示聚合入口。
  - familyId: market-index.scroll-guide
    variant: dark=On
    rule: dark 首屏中滑动引导固定出现在卡片底部上方 1 个间距高度，用户滑动后消失。
  - familyId: market-index.scroll-guide
    variant: dark=Off
    rule: light 首屏中滑动引导固定出现在卡片底部上方 1 个间距高度，用户滑动后消失。

