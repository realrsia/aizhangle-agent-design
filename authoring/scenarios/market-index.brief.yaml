reviewChecklist:
  - id: selected-set-recorded-as-family
    severity: P0
    question: 当前选中的 7:6911 背景 component set 是否被记录为真实 component family，而不是页面使用实例？
    passCriteria: componentFamilies 中存在 market-index.background-shell，且 root 指向 7:6911。
  - id: usage-frames-not-promoted
    severity: P0
    question: 是否误把 大盘_全量_* 或 大盘_1屏_* 页面正例提升成母组件 family？
    passCriteria: 这些节点只出现在 usageInstanceGroups，不出现在 componentFamilies 或 variants.confirmed 中。
  - id: all-four-background-variants-kept
    severity: P0
    question: 是否完整保留了 背景 family 的 4 个真实子变体？
    passCriteria: variants.confirmed、variantGroups 和 variantHumanRules 都同时覆盖 1屏/全屏 与 dark on/off 四种组合。
  - id: title-family-kept-separate
    severity: P0
    question: 当前选中的 标题 component set 是否作为独立 family 追加，而不是混进背景 family 或 usage instance？
    passCriteria: componentFamilies 中存在 market-index.title-block，且其 dark=on/off 变体只出现在 familyVariantGroups / familyVariantHumanRules 中。
  - id: index-family-kept-separate
    severity: P0
    question: 当前选中的 指数 模块是否作为独立 family 追加，而不是混进标题 family、背景 family 或 usage instance？
    passCriteria: componentFamilies 中存在 market-index.index-summary，且其横向浏览与底部导航关系被单独记录。
  - id: abnormal-family-kept-separate
    severity: P0
    question: 当前选中的 A股异动 模块是否作为独立 family 追加，而不是混进指数、标题、背景或 usage instance？
    passCriteria: componentFamilies 中存在 market-index.abnormal-a-share，且主模块与右上角热问开关的关系被单独记录。
  - id: hot-question-toggle-kept-separate
    severity: P0
    question: A股异动/热问开关 是否被作为独立 family 维护，而不是误写成主模块里的普通文本或装饰？
    passCriteria: componentFamilies 中存在 market-index.hot-question-toggle，且 dark=on/off 真实变体被单独记录。
  - id: barrage-family-kept-separate
    severity: P0
    question: 当前选中的 弹幕 区域是否作为独立 family 追加，而不是混进 A股异动、指数或 usage instance？
    passCriteria: componentFamilies 中存在 market-index.barrage-panel，且自动滚动区域结构被单独记录。
  - id: barrage-message-family-kept-separate
    severity: P0
    question: 弹幕/消息 是否被作为独立 family 维护，而不是直接内联写死在主弹幕区域里？
    passCriteria: "componentFamilies 中存在 market-index.barrage-chip，且 `普通/热点` 两种真实变体被单独记录。"
  - id: auction-family-kept-separate
    severity: P0
    question: 当前选中的 竞价 模块是否作为独立 family 追加，而不是混进指数、A股异动或 usage instance？
    passCriteria: componentFamilies 中存在 market-index.auction-panel，且其顶部汇总和统计区结构被单独记录。
  - id: tab-family-kept-separate
    severity: P0
    question: 当前选中的 tab 模块是否作为独立 family 追加，而不是混进导航、按钮组或 usage instance？
    passCriteria: componentFamilies 中存在 market-index.tab-strip，且 tab 区域结构被单独记录。
  - id: tab-pill-family-kept-separate
    severity: P0
    question: tab/胶囊 子组件是否被单独记录为 supporting family，而不是只当作静态文字块处理？
    passCriteria: componentFamilies 中存在 market-index.tab-pill，且选中/未选中与深浅色差异被单独记录为规则。
  - id: news-family-kept-separate
    severity: P0
    question: 当前选中的 资讯 主组件是否作为独立 family 追加，而不是被拆散成零散内容块？
    passCriteria: componentFamilies 中存在 market-index.news-card，且 7 个分类变体被单独记录。
  - id: news-title-family-kept-separate
    severity: P0
    question: 资讯/标题 是否作为独立 family 维护，而不是直接写死在资讯主组件里？
    passCriteria: componentFamilies 中存在 market-index.news-title，且单行/双行、dark/light 四种变体被单独记录。
  - id: news-tip-family-kept-separate
    severity: P0
    question: 资讯/提示 是否作为独立 family 维护，而不是直接写死在资讯主组件里？
    passCriteria: componentFamilies 中存在 market-index.news-tip，且单条/多条两种变体被单独记录。
  - id: scroll-guide-family-kept-separate
    severity: P0
    question: 当前选中的 滑动引导 是否作为独立 family 追加，而不是混进底部结构或正文内容？
    passCriteria: componentFamilies 中存在 market-index.scroll-guide，且 dark=On/off 真实变体被单独记录。
  - id: first-screen-not-primary-truth
    severity: P1
    question: 是否把 1屏 变体误写成主规范真源？
    passCriteria: brief 明确写明全量 light/dark 是主真源，1屏 只用于 390x844 首屏裁切参考。
  - id: component-keys-verified-and-traceable
    severity: P1
    question: 已登记的 component family 是否都具备可追溯的 Figma componentKey？
    passCriteria: componentFamilies 与 figma.extractedFamilies 中的真实 family 都已回填 componentKey；仍未确认的 token 绑定保留 pending_token_binding_verification 状态。
  - id: no-local-special-colors
    severity: P0
    question: 是否引入了脱离标准 token 的局部特殊色？
    passCriteria: 背景 family 的 light / dark 主题表达必须落在标准 token 体系内，不允许局部自定义特殊色。
  - id: title-font-fidelity-kept
    severity: P1
    question: 标题 family 在特殊字体不可稳定获取时，是否采用了更接近 Figma 的保真方案，而不是用近似字体硬替？
    passCriteria: 审稿和高保真原型优先保证 Figma 字形一致性；若同款字体不可稳定使用，应允许 SVG fallback。
  - id: index-scroll-and-pager-synced
    severity: P1
    question: 指数展示模块的左右滑动与底部导航栏反馈是否保持同步？
    passCriteria: 指数区允许横向浏览，底部导航栏必须跟随当前位置变化，不能静止或错位。
  - id: index-standard-colors-kept
    severity: P0
    question: 指数模块是否严格使用规范金融颜色和深浅色主题，不存在局部自定义特殊色？
    passCriteria: 深浅色都使用标准 token；涨跌语义保持红涨绿跌，不引入脱离体系的局部颜色。
  - id: abnormal-standard-colors-kept
    severity: P0
    question: A股异动 模块除热问开关外，是否严格使用规范色对应深色版和浅色版？
    passCriteria: 走势线、板块标签、阈值、时间轴和标题辅助文字都使用标准 token；只有热问开关走自己的 dark 变量。
  - id: hot-question-theme-variants-kept
    severity: P1
    question: 热问开关是否正确区分了 dark=on 和 dark=off 两套变量？
    passCriteria: 开关背景、文字和红点提示必须对应真实深浅色变体，不得混用。
  - id: barrage-auto-scroll-kept
    severity: P1
    question: 弹幕区域是否保留了区域内自动滚动播放的行为，而不是静态停留？
    passCriteria: 消息需在遮罩区内自动滚动，至少保留双行错位连续播放的结构意图。
  - id: barrage-mask-kept
    severity: P1
    question: 弹幕消息是否被限制在区域遮罩范围内显示？
    passCriteria: 滚动消息不能裸露超出 336x63 的显示区域。
  - id: barrage-message-variants-kept
    severity: P1
    question: "单条消息是否正确区分了 `普通` 与 `热点` 两种变量展示？"
    passCriteria: "`热点` 需要带图标和更强提示语义，`普通` 仅保留文本消息样式。"
  - id: auction-standard-colors-kept
    severity: P0
    question: 竞价模块是否严格使用规范色和正确的金融红绿语义？
    passCriteria: 总金额、较上日、涨停跌停、进度条和底部对比信息都使用标准 token，且红涨绿跌语义不被反转。
  - id: auction-structure-kept
    severity: P1
    question: 竞价模块是否保留了顶部汇总、涨停跌停统计、进度条和底部对比信息的完整结构？
    passCriteria: 不得删减为单层统计卡；顶部汇总和底部对比信息都应完整存在。
  - id: tab-selection-states-kept
    severity: P1
    question: tab 胶囊子组件是否正确区分了选中/未选中态？
    passCriteria: 选中项和未选中项必须在底色、边框/填充和文字权重上有明确差异。
  - id: tab-theme-states-kept
    severity: P1
    question: tab 胶囊子组件是否同时考虑了深色版和浅色版？
    passCriteria: tab 区域和胶囊子组件都需要在 dark/light 下切换到对应标准 token，不得只维护单套主题。
  - id: tab-system-component-rebound
    severity: P1
    question: 系统层 tab/胶囊 组件补齐后，当前占位引用是否已回填成正式系统层绑定？
    passCriteria: 不长期保留占位写法；系统层 brief/canon 可用后，应替换为正式组件引用。
  - id: news-category-variants-kept
    severity: P1
    question: 资讯主组件是否正确保留了不同分类对应的不同样式和结构？
    passCriteria: 板块、华泰观市、行情异动、专属内容、行情速览、事件捕手、市场要闻都应保留各自结构差异。
  - id: news-title-variants-kept
    severity: P1
    question: 资讯标题是否正确区分了单行/双行与深色版/浅色版？
    passCriteria: 标题 family 必须覆盖四种真实变体，不得只保留单一标题样式。
  - id: news-tip-variants-kept
    severity: P1
    question: 资讯提示是否正确区分了单条与多条状态？
    passCriteria: 单条只保留箭头，多条显示数量加箭头，不能互换。
  - id: scroll-guide-initial-only
    severity: P1
    question: 滑动引导是否只在 1屏 初始状态固定出现，并在用户滑动后消失？
    passCriteria: 首屏初始显示；一旦开始浏览滚动内容，提示立即消失且不再常驻。
  - id: scroll-guide-bottom-spacing-kept
    severity: P1
    question: 滑动引导是否保持在卡片底部上方 1 个间距高度的位置？
    passCriteria: 引导位置固定贴近卡片底部上方，不得漂移到正文中段或底部导航区。
  - id: human-boundaries-kept-per-variant
    severity: P1
    question: 是否为每个子变体保留了独立的人工作用边界，而不是只写一个泛化规则？
    passCriteria: 四个变体各自有单独 variantHumanRules，明确区分首屏裁切与全屏真源用途。

