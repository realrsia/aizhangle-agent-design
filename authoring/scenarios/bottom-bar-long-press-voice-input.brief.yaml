# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: voice-input-state-clear
    question: 长按语音输入状态是否清楚表达当前操作？
    passCriteria: On / Off 状态必须有清楚的发送、取消或非发送反馈。
  - id: voice-input-replaces-bottom-bar
    question: 长按语音输入出现时，Bottom Bar 是否已经消失？
    passCriteria: Bottom Bar 和长按语音输入不能同屏同时出现。
  - id: voice-input-h5-not-figma-instance
    question: H5 变体是否被正确理解为背景覆盖视觉，而不是 APP 深浅主题？
    passCriteria: H5 没有真正深色版；Dark=On / Off 只表示背景覆盖颜色差异。
  - id: voice-input-copy-verified
    question: 长按语音输入提示文案是否来自 Figma 或人工确认？
    passCriteria: 提示文案必须来自真实节点或人工确认，不得随意猜测。

