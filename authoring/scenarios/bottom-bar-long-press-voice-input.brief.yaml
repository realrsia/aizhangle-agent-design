# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: scenario.bottom-bar.long-press-voice-input
name: 长按语音输入
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  定义用户在 Bottom Bar 的输入胶囊上长按后出现的语音输入交互。
  该状态是 `bottom bar/item/长按语音输入` 组件集的独立覆盖态，
  出现时原 Bottom Bar 必须消失，两者不会同时出现。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户可以清楚识别当前正在长按语音输入、是否可发送，以及是否处于取消发送或非发送状态。

# [HUMAN REQUIRED]
requiredContent:
  - "真实 `bottom bar/item/长按语音输入` 组件集。"
  - 发送状态：On / Off。
  - 场景：通用 / H5。
  - Dark：On / Off。
  - 语音输入反馈文案、波形或等价反馈。
  - 背景覆盖视觉。

# [HUMAN REQUIRED]
interactionModel:
  trigger: long-press-on-bottom-bar-input-pill
  replacementRule: bottom-bar-disappears-while-voice-input-is-visible
  visibilityRule: Bottom Bar 和长按语音输入不会同时出现。

# [HUMAN REQUIRED]
platformRules:
  app:
    variants:
      - voice-input-send-on-generic-dark
      - voice-input-send-off-generic-dark
      - voice-input-send-on-generic-light
      - voice-input-send-off-generic-light
    rule: APP 使用通用场景变体，支持深色版和浅色版。
  h5:
    variants:
      - voice-input-send-on-h5-dark
      - voice-input-send-off-h5-dark
      - voice-input-send-on-h5-light
      - voice-input-send-off-h5-light
    rule: H5 使用 H5 场景变体；H5 没有真正深色版，Dark=On / Off 只表示背景覆盖颜色差异。

# [HUMAN REQUIRED]
allowedZones:
  - voice_input_interaction_overlay
  - bottom_bar_voice_feedback_layer
  - h5_voice_input_feedback

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不要让 Bottom Bar 和长按语音输入同屏叠加。
  - 不要把 H5 的 Dark=On / Off 当成 APP 原生深浅主题。
  - 不要把长按语音输入放进滚动正文、列表行或交易按钮区域。
  - 不要把长按语音输入当作普通 Bottom Bar 变体。

