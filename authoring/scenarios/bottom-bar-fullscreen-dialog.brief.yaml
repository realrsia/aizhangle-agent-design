id: scenario.bottom-bar.fullscreen-dialog
name: 全屏对话场景 Bottom Bar
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  定义 APP 内全屏 AI 对话或助手对话页面的底部输入区规则。该场景支持语音输入、
  文字输入、任务助手展开和 AI 生成内容提示。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户在全屏对话页中继续输入、追问或展开任务助手，同时保持底部输入区稳定可识别。

# [HUMAN REQUIRED]
requiredContent:
  - "真实 `bottom bar/母组件` 对话场景变体。"
  - "黑版使用 `chat-dark`，白版使用 `chat-light`。"
  - "`bottom bar/item/输入胶囊` 子组件。"
  - Agent 建议胶囊或任务助手入口。
  - AI 生成内容提示，除非有人工确认的隐藏规则。
  - iOS home indicator / safe area。

# [HUMAN REQUIRED]
allowedZones:
  - ai_chat_page_composer
  - assistant_conversation_bottom
  - fullscreen_dialog_bottom_composer

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不要用于首页入口、个股行情页或交易行动区。
  - 不要用于 H5 页面、账户页、搜索页、弹窗底部或二三级子页面。
  - 不要把 Bottom Bar 本体塞进消息气泡或正文内嵌内容块。
  - 不要在全屏对话 Bottom Bar 中加入买 / 卖 / 撤交易行动。

# [HUMAN REQUIRED]
riskWarnings:
  - id: ai-disclosure
    severity: P1
    rule: 全屏对话或 AI 建议胶囊可见时，应保留 AI 生成内容提示或给出人工确认。
  - id: scene-context-vs-placement
    severity: P1
    rule: AI 对话正文属于全屏对话场景上下文，但 Bottom Bar 只能放在底部输入区。

