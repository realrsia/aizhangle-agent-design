# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: scenario.action-sheet.modal-usage
name: Action Sheet 弹窗使用场景
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  定义 Action Sheet 在 APP 页面中的典型使用场景，包括 GUI阅读型底部栏上下文、
  GUI任务型常规模态弹窗、带装饰协议确认、AI 结果说明、输入任务和高风险交易确认。
  本场景只描述页面用法，不定义新的 Action Sheet 母组件或变体。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户在不中断业务理解的前提下，阅读信息、完成选择或输入、确认协议和交易风险，
  并能清楚区分低风险阅读型浮层与需要明确操作的常规模态弹窗。

# [HUMAN REQUIRED]
requiredContent:
  - "真实 `Action sheet/母组件`、`Action sheet/遮罩` 或对应 Area 组件实例。"
  - GUI阅读型必须保留 Bottom Bar 上下文和阅读型遮罩。
  - GUI任务型、LUI对话型和 Dialog弹窗必须使用常规模态遮罩。
  - 高风险交易确认必须保留风险提示、订单明细、明确主按钮和取消 / 返回路径。
  - AI 结果说明必须保留来源、限制或免责声明语义。
  - 带装饰协议确认必须保留装饰区语义；删除装饰图像后回退到非装饰变体。

# [HUMAN REQUIRED]
allowedZones:
  - action_sheet_layer
  - bottom_bar_context
  - trading_task_modal
  - agreement_modal_layer
  - ai_chat_modal_layer
  - task_input_modal
  - trading_confirmation_modal

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不要把页面 frame、样例截图或 prototype frame 当作 Action Sheet 母组件。
  - 不要把 GUI阅读型的 Bottom Bar 场景套用到常规模态弹窗。
  - 不要用普通阅读型 Action Sheet 承载交易确认、撤单、协议同意或 AI 免责声明。
  - 不要在高风险确认中自动关闭、弱化主按钮或隐藏取消路径。
  - 不要手工拼装 lookalike frame 代替 Figma library instance。

# [HUMAN REQUIRED]
riskWarnings:
  - id: action-sheet-usage-vs-component-definition
    severity: P0
    rule: 页面样例只能作为 usage / scenario，不得反向登记为真实 component family 或 variant。
  - id: action-sheet-high-risk-confirmation
    severity: P0
    rule: 撤买、撤单、批量订单确认等交易动作必须要求用户明确确认。
  - id: action-sheet-ai-result-disclosure
    severity: P1
    rule: AI 结果说明、来源展开或免责声明必须表达来源和限制，不得呈现为确定收益承诺。
  - id: action-sheet-mask-context
    severity: P1
    rule: GUI阅读型使用阅读型遮罩和 Bottom Bar 上下文；其他常规模态使用 full modal 遮罩。

