# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: action-sheet-scenario-uses-library-instance
    question: 页面里的 Action Sheet 是否来自真实 Figma library instance？
    passCriteria: 主体、遮罩、标题区、内容区、按钮区和装饰区应使用已确认的 Action Sheet component family 或其实例。
  - id: action-sheet-scenario-mask-context-valid
    question: 遮罩是否匹配 GUI阅读型或常规模态弹窗场景？
    passCriteria: GUI阅读型使用 reading mask；其余 Action Sheet 场景使用 regular full modal mask。
  - id: action-sheet-scenario-high-risk-explicit-confirmation
    question: 高风险交易或协议类场景是否要求用户明确确认？
    passCriteria: 交易、协议、授权、AI 免责声明场景必须有清楚的风险文案和明确操作路径。
  - id: action-sheet-scenario-not-component-definition
    question: 是否避免把样例 frame 写成组件定义？
    passCriteria: 这些 Figma frame 只能进入 usageInstanceGroups / scenario / case study，不进入 componentFamilies 或 variantGroups。

