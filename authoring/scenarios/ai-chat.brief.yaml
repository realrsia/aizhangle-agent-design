# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: scenario.ai-chat
name: AI 对话页
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐 AI 对话模块页面生成与还原实测，覆盖用户提问、智能体思考、
  回答正文、相关问题和底部继续输入。页面结构以设计仓库/对话流为当前模块来源。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户在 AI 对话页中提出金融相关问题，并阅读 AI 的思考过程、回答结果、
  风险提示或后续可追问内容。

# [HUMAN REQUIRED]
requiredContent:
  - 页面背景，必须使用对话流光线平铺背景，不使用首页卡片背景。
  - 固定顶部对话导航栏。
  - 用户问题气泡。
  - AI 头像/身份行。
  - AI 回答状态或思考状态。
  - AI 回答正文。
  - 底部对话输入栏。
  - 金融数据卡片或图表仅在业务问题需要时出现；无正式组件时允许 fallback，但必须标清不是正式组件。

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不要用手写色块替代设计仓库背景组件。
  - 不要用首页卡片背景、普通卡片 surface 替代 AI chat 对话页背景。
  - 不要用普通二级页 header 替代对话顶部导航。
  - 不要用普通输入框或通用底部导航替代对话底部输入栏。
  - 不要把 bottom input 放进滚动消息流。
  - 不要把思考过程画成任意普通卡片；必须先确认是否有真实组件或语义结构。
  - 不要让 K 线图、数据卡片、长正文压住底部输入栏。
  - 不要把 Figma demo/prototype frame 当成母组件 family。

# [HUMAN REQUIRED]
riskWarnings:
  - 涉及股票走势、价格、K 线、风险提示时，页面需要保留“示例/非投资建议”语义。
  - 对话结构错误会导致 AI 页面看起来像普通金融 dashboard，而不是对话模块。
  - 深色/浅色背景、文字、描边等颜色必须优先使用设计仓库变量；读不到变量时标记待 Figma 验证，不直接写死色值。

# [HUMAN REQUIRED]
manualReviewQuestions:
  - id: ai-chat-standard-source
    question: 设计仓库/对话流是否作为本模块当前页面结构标准来源？
    currentDraftAnswer: draft_yes_design_repository_dialog_flow
  - id: thinking-process-component
    question: 思考过程是独立 Figma 母组件、回答状态变体，还是页面内语义组合？
    currentDraftAnswer: pending_further_confirmation_do_not_render_as_generic_card
  - id: stock-card-chart-fallback
    question: 股票基础信息卡和 K 线图是否已有正式组件？如果没有，实测中是否允许 fallback 绘制？
    currentDraftAnswer: fallback_allowed_when_no_formal_component_mark_as_non_canonical
  - id: component-library-binding
    question: 设计仓库中的 bottom bar 是否应作为团队正式组件库绑定来源？
    currentDraftAnswer: draft_yes_dialog_flow_bottom_composer_392_75769
  - id: design-token-binding
    question: 对话模块生成时，深色/浅色背景、文字、描边等颜色是否必须优先使用设计仓库变量，不能写死色值？
    currentDraftAnswer: draft_yes_prefer_design_repository_tokens_no_hardcoded_colors
  - id: font-environment
    question: 是否需要在 Figma MCP/执行环境中安装 PingFang SC 与 SF Pro Text，避免组件文本编辑失败？
    currentDraftAnswer: needs_environment_check_before_text_override

