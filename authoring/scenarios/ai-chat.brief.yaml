knownGenerationFailures:
  - id: primitive-first-output
    summary: 首版页面主要由手绘 primitive 构成，没有复用真实组件。
  - id: fallback-overlap-output
    summary: 第二版虽然保留部分组件，但思考区和股票图表仍为 fallback，且出现底部栏压住内容的问题。
  - id: missing-fonts
    summary: 跨页克隆或改写组件文字时遇到 PingFang SC / SF Pro Text 字体不可用。
  - id: wrong-ai-chat-background
    summary: 生成对话流时误用首页卡片背景；应绑定 392:75635 的对话页光线平铺背景。

# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

agentExpansion:
  canonScenario:
    path: canon/scenarios/ai-chat.yaml
  archetype:
    path: canon/archetypes/mobile-chat-page.yaml
  checklist:
    path: canon/checklists/ai-chat-scenario-review.yaml
  docs:
    path: docs/references/fidelity/dialog-flow-gui-restoration-test.md

reviewChecklist:
  - id: ai-chat-required-components-exist
    severity: P0
    question: ai-chat 场景引用的组件是否都有 authoring brief、canon meta 和 binding 入口？
    passCriteria: chat-topbar、message-feed、chat-input 至少有 draft 级入口。
  - id: ai-chat-fixed-zones
    severity: P0
    question: topbar 和 bottom_input 是否固定，message_feed 是否为主要滚动区？
    passCriteria: 内容不会覆盖顶部或底部固定组件。
  - id: ai-chat-fallback-declared
    severity: P1
    question: 股票卡、K线图、思考步骤等 fallback 内容是否被明确声明？
    passCriteria: 没有把 fallback 当成真实 Figma 组件。
