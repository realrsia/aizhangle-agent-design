reviewChecklist:
  - id: home-entry-collapse-side-correct
    question: 交易页和我的/自选二级页展开态的收起按钮是否在正确侧？
    passCriteria: 交易页左侧入口展开后左侧为向下箭头；我的/自选二级页右侧入口展开后右侧为向下箭头。
  - id: not-trading-action-bar
    question: 是否误把交易页入口展开态当成买 / 卖 / 撤交易行动底栏？
    passCriteria: 展开态中不得出现买 / 卖 / 撤行动按钮，也不得替代下单确认区。
  - id: simulation-entry-only-in-my-simulation
    question: 模拟入口按钮是否只在“我的 / 模拟”二级页出现？
    passCriteria: 自选、触发、持股二级页不得使用模拟入口；默认显示文字状态，除非用户明确要求图标状态。

