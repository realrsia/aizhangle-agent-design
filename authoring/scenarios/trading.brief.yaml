    familyRole: supporting
    usedIn:
      - condition_order_info_panel
    allowedZones:
      - trading_info_panel
      - mid_content
    forbiddenZones:
      - top_nav
      - bottom_dock
      - trading_submit_area
    humanRules:
      do:
        - 用于条件单卡片底部快捷操作，当前观察到包含“行情/再来一单/详情”。
        - 未完成条件单如存在撤销、暂停或修改操作，需要按具体选中组件再确认。
      dont:
        - 不要把操作区误写成底部导航或主下单按钮。
        - 不要把已完结的再来一单与未完成的撤单类操作混用。
    riskWarnings:
      - 操作入口错误会改变用户后续处理条件单的路径。
  - id: trading.info.history-entrust
    figmaNodeId: "37:26400"
    figmaName: 分类=历史/历史委托, 有内容=On, Dark=Off
    familyRole: supporting
    usedIn:
      - trading_info_panel
      - history_entrust_panel
    allowedZones:
      - trading_info_panel
      - mid_content
    forbiddenZones:
      - top_nav
      - trading_setting_panel
      - bottom_dock
    humanRules:
      do:
        - 用于历史委托信息区，保留历史维度下的标题、列表、状态与结果信息。
        - 历史委托应与当前委托区分，避免混入实时撤单能力。
      dont:
        - 不要把历史委托 family 当成当前委托 family 复用。
    riskWarnings:
      - 历史与当前委托混淆会影响用户对可操作性的判断。
  - id: trading.info.history-strategy
    figmaNodeId: "37:26455"
    figmaName: 分类=历史/历史策略, 有内容=On, Dark=Off
    familyRole: supporting
    usedIn:
      - trading_info_panel
      - history_strategy_panel
    allowedZones:
      - trading_info_panel
      - mid_content
    forbiddenZones:
      - top_nav
      - trading_setting_panel
      - bottom_dock
    humanRules:
      do:
        - 用于历史策略信息区，保留策略卡片、策略说明与历史结果信息的组合关系。
        - 历史策略需与运行中的条件单策略区分，避免误导当前状态。
      dont:
        - 不要把历史策略 family 当成当前条件单或普通历史委托复用。
    riskWarnings:
      - 历史策略状态与当前运行状态混淆，会造成策略预期偏差。

