reviewChecklist:
  - id: trading-top-real-family-used
    severity: P0
    question: 是否使用了当前选中 top 区域里的真实母组件 family，而不是相似 header、页面示例或截图？
    passCriteria: 账户切换、页面滑动、模拟交易必须对应 37:26291、37:26322、37:26305 之一，且不把 37:26221 当作 family。
  - id: selected-region-not-overexpanded
    severity: P0
    question: 是否误把未选中的交易输入区、交易动作区、底部结构写成已确认事实？
    passCriteria: 当前 brief 只对 top 区域给出事实，其他区域只可作为候选组件或待后续补充项。
  - id: trading-context-established-first
    severity: P0
    question: 是否先建立交易上下文，再进入输入或下单动作？
    passCriteria: 页面顶部能明确看到账户、标的或模拟/实盘身份，不存在脱离上下文的交易入口。
  - id: paper-trading-clearly-separated
    severity: P0
    question: 是否正确区分模拟交易与实盘交易顶部 family？
    passCriteria: 模拟交易 family 保留模拟标识和规则入口，实盘页面不复用该 family。
  - id: top-right-not-submit-area
    severity: P1
    question: 是否把顶部右侧 tab 或规则入口误当成交易提交区？
    passCriteria: 右侧元素只表达模式切换或辅助入口，不承载买卖撤等高风险动作。
  - id: title-code-summary-structure
    severity: P1
    question: 是否正确保留标题、代码、摘要与图标的结构关系？
    passCriteria: 页面滑动 family 保留名称+代码与第二行摘要；账户切换和模拟交易保留主标题与第二行摘要。
  - id: theme-scope-boundary
    severity: P1
    question: 是否避免把当前深色事实直接扩写成 light、H5 或其他业务场景规则？
    passCriteria: 所有未验证的 light/H5/业务差异都标记为待补充，不当作 confirmed facts。
  - id: family-rule-independence
    severity: P2
    question: 是否为每个子变体保留了独立人工规则？
    passCriteria: 每个 family 都有自己的 usedIn、allowedZones、forbiddenZones、humanRules 和 riskWarnings。
  - id: settings-main-family-not-flattened
    severity: P0
    question: 是否把设置母组件错误压平成普通表单卡片或单一 generic input 列表？
    passCriteria: 设置主表单、基础设置行、高级设置行和底部交易按钮关系仍可被分别识别与审查。
  - id: settings-child-families-separated
    severity: P1
    question: 是否把代码、类型、价格、数量、金额、价格区间、自动撤单、监控时段混成一个不可区分的大组件？
    passCriteria: 这些子结构至少能按独立 family 或独立审查项识别。
  - id: settings-buy-sell-reuses-trading-action
    severity: P1
    question: 设置区底部双按钮是否正确复用交易行动按钮语义，而不是被当成新的设置类组件？
    passCriteria: 双按钮买卖继续归到交易行动按钮体系，设置区只负责其挂载上下文。
  - id: source-family-mapping-correct
    severity: P1
    question: 语义 family 是否正确映射回真实 Figma 源 family，而不是把同一 source family 的不同变体误登记成多个虚构母组件？
    passCriteria: 基础设置语义行映射到 37:27191，高级设置映射到 37:27436，交易行动点映射到 37:27231。
  - id: info-region-not-written-as-single-family
    severity: P0
    question: 是否只使用 37:26343 信息母组件的源 component set，而没有继续区分其下业务分类？
    passCriteria: 37:26343 作为信息区源 component set 记录；持仓、合约、委托、条件单、历史委托、历史策略仍需分别维护语义 family 和变体规则。
  - id: info-category-boundary-correct
    severity: P0
    question: 是否把持仓、合约、委托、条件单、历史委托、历史策略这些信息分类正确区分，而不是混成一个通用列表组件？
    passCriteria: 每一类都有独立 family 和独立人工规则，不发生当前委托与历史委托、条件单与历史策略混用。
  - id: info-dark-and-empty-state-correct
    severity: P1
    question: 是否正确处理了信息区的 Dark 与有内容/空态差异？
    passCriteria: 持仓保留有内容与空态的独立规则；合约、委托、条件单、历史类只记录当前已确认的有内容态；深色态不被误写成独立业务分类。
  - id: info-actions-not-confused-with-submit
    severity: P1
    question: 是否把信息区里的撤单、批量、筛选、行情、详情等操作误当成主交易提交按钮？
    passCriteria: 信息区操作只保留信息回看和后续处理语义，不与买卖主操作区混淆。
  - id: condition-order-real-family-used
    severity: P0
    question: 是否使用了 37:26434 条件单有数据浅色版这个真实 family 变体，而不是页面示例、历史策略或普通委托列表？
    passCriteria: 条件单有数据浅色版绑定到 37:26434/componentKey 744971ecd4383e173207bed9079bd4b174ca7b90，并保留其条件单卡片结构。
  - id: condition-order-child-families-separated
    severity: P1
    question: 是否把条件单标题工具区、条件单卡片、标的信息、策略信息、交易信息和操作区域继续拆开维护？
    passCriteria: 37:26438、37:28209、37:28991、37:28486、37:28507、37:28159 等已记录为条件单子 family；仍待复核的是已完结标题工具与业务状态的精确变体映射。
  - id: condition-order-header-tools-not-confused
    severity: P1
    question: 是否把条件单标题里的“仅今日触发/筛选/批量/折叠”误套成委托区的“仅手工下单/批量撤单”？
    passCriteria: 条件单未完成标题区保留仅今日触发、筛选、批量和折叠入口；委托标题工具不直接复用到条件单。
  - id: condition-order-strategy-and-ai-boundary
    severity: P1
    question: 是否正确处理策略说明、网格、AI助手和回测入口之间的关系？
    passCriteria: 定价条件不默认出现 AI/回测；网格或成交驱动类策略可出现 AI助手/回测入口，但必须与具体策略类型绑定。
  - id: condition-order-actions-not-submit-buttons
    severity: P1
    question: 是否把条件单卡片底部的行情、再来一单、详情等操作误认为主买卖提交按钮？
    passCriteria: 条件单操作区只作为卡片后续处理入口，不替代设置区底部买入/卖出主按钮。
  - id: condition-order-figma-recheck-before-promotion
    severity: P1
    question: 是否在 Figma 连接恢复后复核了条件单策略信息、交易信息、操作区域的 nodeId、componentKey 和变体属性？
    passCriteria: 当前待复核字段不能晋级为强绑定；必须在 Figma 中补齐变体面板、componentKey 和使用实例映射后才能提升绑定等级。
  - id: holdings-child-families-separated
    severity: P1
    question: 是否把持仓里的二级 tab、表头、单列和批量买卖入口继续混写成一个不可拆分的大块？
    passCriteria: 37:26366、37:26368、37:26369、37:26377 已作为可继续维护的子 family 或子结构单独记录。
  - id: holdings-fixed-copy-respected
    severity: P1
    question: 是否错误改写了持仓里的固定文案，例如 tab、表头、批量买入/卖出按钮？
    passCriteria: 持仓/合约/委托/条件单/历史 tab，表头文案，批量买入/批量卖出文案默认固定，只有标签文案在明确需要展示时才允许调整。
  - id: holdings-empty-state-structure-correct
    severity: P1
    question: 是否正确处理了持仓空态结构，而不是把整块信息区直接清空或保留错误操作入口？
    passCriteria: 持仓空态浅色版与深色版都保留二级 tab 和表头，内容区切换为空状态卡片，不保留持仓单列和批量买卖按钮。
  - id: contract-child-families-separated
    severity: P1
    question: 是否把合约里的融资/融券切换、表头、单列继续混写成一个不可维护的大块？
    passCriteria: 37:26387、37:26391、37:26392 已作为可继续维护的子 family 或子结构单独记录。
  - id: contract-not-confused-with-holdings
    severity: P1
    question: 是否把合约错误当成持仓换标题，而忽略了融资/融券切换和合约专用字段？
    passCriteria: 合约保留融资/融券切换与专用表头字段，不复用持仓表头语义。
  - id: entrust-not-collapsed-into-history
    severity: P0
    question: 是否把当前委托误写成历史委托或只读历史列表？
    passCriteria: 当前委托必须保留状态/操作列、撤单入口和分组标题工具区，不能按历史结果只读结构处理。
  - id: entrust-status-and-notice-kept
