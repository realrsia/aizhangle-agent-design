# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: scenario.trading
name: 交易场景
owner: product-design
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐移动端交易场景，承载从页面身份建立、账户或标的上下文确认、
  交易参数输入，到后续交易动作与辅助规则入口的完整结构约束。
  当前这一版 brief 按 Figma 中逐个选中的母组件 family 增量维护，
  本轮仅补交易场景顶部区域里当前选中的真实母组件 family，不把未选中的兄弟区域视作已确认事实。

# [HUMAN REQUIRED]
primaryUserGoal: >
  用户进入交易页后，应能先确认账户、标的、实盘或模拟身份，再安全地完成交易参数理解、条件或委托信息查看，
  并区分主交易提交动作与信息区后续处理入口。

# [HUMAN REQUIRED]
requiredContent:
  - 交易顶部上下文区域，用于明确账户、标的、模拟或实盘身份。
  - 交易设置主表单和基础参数行，用于承载代码、类型、价格、数量、金额和高级设置。
  - 买入、卖出或撤单等高风险交易行动入口，并与辅助入口清晰区分。
  - 信息区分类结构，包括持仓、合约、委托、条件单、历史委托和历史策略等可审查业务分区。
  - 条件单卡片结构，包括标题工具、策略信息、交易信息、操作区域和必要的 Figma 复核标记。

# [HUMAN REQUIRED]
forbiddenPatterns:
  - 不得把交易顶部右侧 tab、规则入口、信息区操作误写成买卖提交按钮。
  - 不得混淆模拟交易与实盘交易上下文，或删除模拟标识后继续沿用模拟 family。
  - 不得把未选中的交易输入区、买卖按钮区、底部结构猜写成已验证 Figma 事实。
  - 不得把交易设置区压平成普通表单卡片或 generic input 列表。
  - 不得把当前委托、历史委托、条件单、历史策略混成一个通用列表组件。

# [HUMAN REQUIRED]
usedIn:
  - trading-order-page
  - stock-trading-detail
  - paper-trading-page
  - figma-review-trading

# [HUMAN REQUIRED]
humanRules:
  do:
    - 当前轮次只登记 Figma 当前选中的顶部区域真实母组件 family，不把未选中的中部表单、底部操作区等兄弟区域视作已确认事实。
    - 交易场景必须先建立页面身份、账户或标的上下文，再承接输入区和交易动作区。
    - 顶部区域中的右侧 tab 只用于轻量模式切换或辅助入口，不承载高风险交易提交。
    - 模拟交易与实盘交易必须在顶部区域就清晰区分，不允许靠后续文案补救。
  dont:
    - 不要把页面示例 frame、prototype 截图或相似 header 当成真实母组件 family。
    - 不要因为当前只选中了 top 区域，就猜写交易输入区、买卖按钮区或底 bar 的母组件事实。
    - 不要把顶部右侧 tab、规则入口或摘要区误写成独立交易按钮组件。
    - 不要让顶部区域脱离交易上下文被复用成通用卡片头部。

# [HUMAN REQUIRED]
riskWarnings:
  - id: trading-scene-context-first
    severity: P0
    rule: >
      交易场景必须先建立当前账户、标的或模拟/实盘身份，再进入输入和下单。
      如果顶部 family 选错，会直接导致整页交易上下文判断错误。
  - id: paper-trading-vs-live-trading
    severity: P0
    rule: >
      模拟交易与实盘交易不得混用同一顶部 family。
      模拟标识缺失或错误会造成严重操作预期偏差。
  - id: partial-selection-boundary
    severity: P1
    rule: >
      当前只确认了交易场景 top 区域，不得把未选中的表单区、summary 区、底部行动区补成已验证事实。

# [HUMAN REQUIRED]
allowedZones:
  - page_shell
  - top_nav
  - trading_context_header

# [HUMAN REQUIRED]
forbiddenZones:
  - generic_card_header
  - bottom_dock
  - list_row_header

# [HUMAN REQUIRED]
requiredPairings:
  - trading-context
  - ios-status-area
  - verified-top-family

# [HUMAN REQUIRED]
forbiddenPairings:
  - screenshot-as-component-definition
  - top-nav-as-submit-area
  - guessed-unselected-zones

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "37:26291"
      reason: 账户切换 family，适用于账户上下文明确的交易页顶部。
    - figmaNodeId: "37:26322"
      reason: 页面滑动 family，适用于标的详情类交易页顶部。
    - figmaNodeId: "37:26305"
      reason: 模拟交易 family，适用于模拟交易顶部上下文。
    - figmaNodeId: "37:26556"
      reason: 设置母组件，适用于交易设置区主表单与参数配置场景。
  needsReview:
    - figmaNodeId: "37:26221"
      reason: 当前选中的是 top 区域容器，不是单一母组件 family。
  bad:
    - reason: 把顶部区域容器直接写成一个独立母组件。
    - reason: 把右侧 tab 或规则入口当成交易提交组件。
    - reason: 把设置母组件里的底部买卖按钮重新定义成新的设置类组件，而不是复用既有交易行动按钮语义。

# [HUMAN REQUIRED]
componentHumanRules:
  do:
    - 同一个顶部组件区域下的每个真实母组件都作为独立 component family 记录。
    - 当前轮次只补 top 区域，后续重新选中其他区域后再逐组补充交易输入、交易动作、底部结构等 family。
    - 页面级正例或 prototype 只进入 usageInstanceGroups。
    - 同一组交易设置语义行如果在 Figma 中实际来自同一个母组件 family 的不同变体，应建立 source family 映射，不强行伪造多个 Figma 母组件。
  dont:
    - 不要把 37:26221 这种区域容器写进 componentFamilies。
    - 不要在 componentKey、文本覆盖字段或真实 variant property 未确认时硬猜。

# [HUMAN REQUIRED]
extensionModel:
  mode: incremental-selected-families
  mainFamily: trading.top-nav.account-switch
  rationale: >
    当前选中的是交易场景 top 区域容器，不是整个交易场景的主母组件。
    默认以账户切换 family 作为交易场景 top 区域的主 family，
    其余 family 根据提示词语义切换使用。
    本轮先把该区域下可确认的 3 个 family 增量登记到场景 brief，
    其余区域待后续单独选中后继续补充。

# [HUMAN REQUIRED]
componentFamilies:
  - id: trading.top-nav.account-switch
    figmaNodeId: "37:26291"
    figmaName: 分类=账户切换
    familyRole: supporting
    usedIn:
      - trading_context_header
      - account-switch-header
    allowedZones:
      - top_nav
      - trading_context_header
    forbiddenZones:
      - generic_card_header
      - bottom_dock
      - trading_submit_area
    humanRules:
      do:
        - 用于带账户身份与右侧轻量切换的交易页顶部导航。
        - 保留左侧层级入口、主标题、账户摘要和右侧双 tab 的完整关系。
        - 账户摘要允许展示账户类型与脱敏数字，但必须保持双行结构。
      dont:
        - 不要删掉账户摘要后继续沿用这个 family。
        - 不要把这个 family 当成通用二级页纯标题栏。
        - 不要把右侧 tab 扩展成买卖、撤单等高风险动作组。
    riskWarnings:
      - 账户身份和摘要结构错误会误导用户当前交易账户与可操作模式。
  - id: trading.top-nav.page-slide
    figmaNodeId: "37:26322"
    figmaName: 分类=页面滑动
    familyRole: supporting
    usedIn:
      - stock_trading_detail_header
      - security-context-header
    allowedZones:
      - top_nav
      - trading_context_header
    forbiddenZones:
      - generic_card_header
      - bottom_dock
      - account-switch-header-with-tabs
    humanRules:
      do:
        - 用于标的详情类交易页顶部，展示股票名称、代码与第二行摘要。
        - 保持“名称 + 代码”同列结构，不拆成单标题。
        - 第二行摘要继续表达账户、权限或普通/信用等上下文，不替换成行情主价格区。
      dont:
        - 不要把这个 family 当成纯标题栏使用。
        - 不要把标的代码换成无关标签或 tab。
        - 不要把第二行摘要改造成价格主信息。
    riskWarnings:
      - 标的名称与代码组合错误会直接影响用户对当前交易标的的识别。
  - id: trading.top-nav.paper-trading
    figmaNodeId: "37:26305"
    figmaName: 分类=模拟交易
    familyRole: supporting
    usedIn:
      - paper-trading-header
      - rules-entry-header
    allowedZones:
      - top_nav
      - trading_context_header
    forbiddenZones:
      - live-trading-header
      - generic_card_header
      - trading_submit_area
    humanRules:
      do:
        - 仅用于模拟交易上下文，保留“模拟”主标题与红色模拟标识。
        - 右侧双 tab 与“规则”入口需要一起校验其模拟场景语义。
        - 模拟标签必须明显可见，避免与实盘交易混淆。
      dont:
        - 不要在实盘页面复用模拟交易 family。
        - 不要删除模拟标识后继续使用这个 family。
        - 不要把“规则”入口替换成高风险交易操作。
    riskWarnings:
      - 模拟与实盘上下文混淆会造成严重操作预期偏差。
  - id: trading.settings-panel.main
    figmaNodeId: "37:26556"
    figmaName: 设置母组件
    familyRole: supporting
    usedIn:
      - trading_setting_panel
      - condition_order_setting_panel
    allowedZones:
      - top_summary
      - trading_setting_panel
      - detail_footer
    forbiddenZones:
      - top_nav
      - generic_card_body
      - bottom_dock
    humanRules:
      do:
        - 用于交易页中的设置主表单，承载代码、类型、价格、数量、金额与高级设置组合。
        - 保持 98px 左标签区与 245px 右输入区的结构节奏，不随意压缩成普通列表项。
        - 底部买卖按钮继续复用交易行动按钮语义，不当作新的设置组件定义。
        - 深色版和浅色版通过规范色切换保持一致，不额外声明独立变体属性。
      dont:
        - 不要把整个设置母组件简化成普通表单卡片。
        - 不要删除高级设置区后继续沿用同一个主 family 作为完整交易设置表单。
        - 不要把输入、开关、时长选项、买卖按钮都揉成一个不可审查的大组件描述。
    riskWarnings:
      - 设置主表单承载交易前关键参数，结构错位会直接影响交易理解与后续操作正确性。
  - id: trading.settings.code-field
    figmaNodeId: "37:26558"
    figmaName: item/设置/基础设置
    familyRole: supporting
    usedIn:
      - trading_security_search_row
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于代码输入与证券名称/代码确认行，保留清空图标、行情图入口和行情摘要。
        - 名称与代码应保持混排结构，名称使用文本字体，代码使用数字字体。
      dont:
        - 不要把它缩减成普通搜索框。
        - 不要删除右侧行情摘要后仍声称与当前 family 一致。
    riskWarnings:
      - 标的识别与行情摘要错误会影响后续交易对象判断。
  - id: trading.settings.order-type-field
    figmaNodeId: "37:26559"
    figmaName: item/设置/基础设置
    familyRole: supporting
    usedIn:
      - trading_order_type_row
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于委托类型选择，保留右侧下拉箭头与居中文字。
        - 类型文案应作为单值选择，不改造成多标签并列。
      dont:
        - 不要把它替换成普通文本按钮或静态标签。
    riskWarnings:
      - 委托类型误读会直接影响交易方式理解。
  - id: trading.settings.price-stepper
    figmaNodeId: "37:26560"
    figmaName: item/设置/基础设置
    familyRole: supporting
    usedIn:
      - trading_price_row
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于价格步进输入，保留减号、数值、加号与买上限/卖下限提示。
        - 左右操作图标必须保持可见，不允许只剩文字说明。
      dont:
        - 不要把它降级成普通纯文本输入框。
        - 不要移除价格区间辅助信息后继续声称是同一 family。
    riskWarnings:
      - 价格步进和上下限提示错误会直接影响委托价格理解。
  - id: trading.settings.amount-summary
    figmaNodeId: "37:26562"
    figmaName: item/设置/基础设置
    familyRole: supporting
    usedIn:
      - trading_amount_row
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于金额展示行，保留金额值与“更多设置”入口。
        - 金额区优先作为结果/展示区域，不强行等同于可编辑输入框。
      dont:
        - 不要把金额展示误写成普通可编辑输入。
    riskWarnings:
      - 金额行是交易结果预览的重要锚点，展示与可编辑语义混淆风险高。
  - id: trading.settings.price-range
    figmaNodeId: "37:26566"
    figmaName: item/设置/高级设置
    familyRole: supporting
    usedIn:
      - condition_order_price_range
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于价格区间高级设置，保留最低价、最高价、步进按钮和休眠说明。
        - 这是条件单类高级参数，不默认扩展到所有普通交易页。
      dont:
        - 不要把它当成普通价格输入行复用。
    riskWarnings:
      - 条件单价格边界设置错误会改变触发范围。
  - id: trading.settings.multiplier-toggle
    figmaNodeId: "37:26567"
    figmaName: item/设置/高级设置
    familyRole: supporting
    usedIn:
      - trading_multiplier_setting
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于倍数委托开关与说明区，保留中尺寸开关和说明文案。
      dont:
        - 不要把它并入普通基础设置行。
    riskWarnings:
      - 倍数委托属于高风险增强逻辑，开关语义必须清楚。
  - id: trading.settings.auto-cancel
    figmaNodeId: "37:26568"
    figmaName: item/设置/高级设置
    familyRole: supporting
    usedIn:
      - trading_auto_cancel_setting
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于自动撤单开关与预设时长选择。
        - 当前选中态与未选中态都要保留独立按钮语义。
      dont:
        - 不要把时长预设改成自由输入而不另建 family。
    riskWarnings:
      - 自动撤单时长会直接影响委托生效时长，误用风险高。
  - id: trading.settings.monitor-window
    figmaNodeId: "37:26569"
    figmaName: item/设置/高级设置
    familyRole: supporting
    usedIn:
      - trading_monitor_window_setting
    allowedZones:
      - trading_setting_panel
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于监控时段开关与周期/每日时段选择。
        - 周期时段和每日时段都保持右侧下拉选择语义。
      dont:
        - 不要把它压成单行开关而省略时段配置。
    riskWarnings:
      - 监控时段错误会影响策略触发时间边界。
  - id: trading.info.holdings
    figmaNodeId: "37:26364"
    figmaName: 分类=持仓, 有内容=On, Dark=Off
    familyRole: supporting
    usedIn:
      - trading_info_panel
      - position_info_panel
    allowedZones:
      - trading_info_panel
      - mid_content
    forbiddenZones:
      - top_nav
      - trading_setting_panel
      - bottom_dock
    humanRules:
      do:
        - 用于持仓信息区，保留上方二级 tab、标题统计、表头和持仓列表结构。
        - 有内容与空态要分开使用，空态不能伪装成低密度列表。
        - 盈亏、持仓数量、可卖数量等结果信息优先保持列表信息卡语义。
      dont:
        - 不要把持仓信息区改造成普通卡片概览。
        - 不要删掉二级 tab 后继续沿用同一 family。
    riskWarnings:
      - 持仓数量、盈亏或可操作状态表达错误会直接影响交易判断。
  - id: trading.info.holdings.secondary-tabs
    figmaNodeId: "37:26366"
    figmaName: tab/二级tab
    familyRole: supporting
    usedIn:
      - trading_info_panel
      - position_info_panel
      - contract_info_panel
    allowedZones:
      - trading_info_panel
      - mid_content
    forbiddenZones:
      - top_nav
      - bottom_dock
      - trading_submit_area
    humanRules:
      do:
        - 用于信息区内部的二级切换导航，保留选中态下划线、计数和未选中态层级。
        - 持仓、合约、委托、条件单、历史这组标签需要保持同一导航体系。
        - 当前这组 tab 文案默认固定，不作为常规可编辑字段处理。
      dont:
        - 不要把它误写成顶部主导航。
        - 不要把其中某个 tab 单独抽成交易主按钮。
        - 不要根据提示词随意改写持仓、合约、委托、条件单、历史这些 tab 名称。
    riskWarnings:
      - 选中态或计数错误会导致当前信息区分类判断错误。
  - id: trading.info.holdings.table-header
    figmaNodeId: "37:26368"
    figmaName: item/信息/表头
    familyRole: supporting
    usedIn:
      - trading_info_panel
      - position_info_panel
    allowedZones:
      - trading_info_panel
      - mid_content
    forbiddenZones:
      - top_nav
      - bottom_dock
    humanRules:
      do:
        - 用于持仓信息表头，保留名称/代码、持仓盈亏、持仓/可用、现价/成本、今日盈亏等多列结构。
        - 各列标题与排序图标应保持成组出现。
        - 表头文案在不同交易信息场景中默认固定，不作为常规改写目标。
      dont:
        - 不要把持仓表头压成普通两列表头。
        - 不要删除排序图标后继续声称与当前表头一致。
        - 不要在未明确要求时改写列标题名称。
    riskWarnings:
      - 列标题或排序语义错误会直接影响持仓数据理解。
  - id: trading.info.holdings.position-row
    figmaNodeId: "37:26369"
