# [HUMAN REQUIRED]
familyVariantHumanRules:
  - familyId: trading.top-nav.account-switch
    variant: 分类=账户切换
    rule: 只用于账户交易上下文明确、且右侧需要模式切换 tab 的顶部区域。
  - familyId: trading.top-nav.page-slide
    variant: 分类=页面滑动
    rule: 只用于标的详情或内容切换后的交易头部，不替代带右侧 tab 的账户切换 family。
  - familyId: trading.top-nav.paper-trading
    variant: 分类=模拟交易
    rule: 必须保留模拟标识与规则入口，避免被误认为实盘交易页面。
  - familyId: trading.settings.multiplier-toggle
    variant: switch=On
    rule: 倍数委托默认只在高级设置显式开启后生效，不应默认扩散到普通交易设置。
  - familyId: trading.settings.auto-cancel
    variant: switch=On, durationPreset=10秒选中
    rule: 自动撤单开启后，当前选中预设必须清晰高亮，未选中预设保持次级权重。
  - familyId: trading.settings.auto-cancel
    variant: switch=On, durationPreset=20秒
    rule: 20秒是可切换候选值，不应与当前选中态混淆。
  - familyId: trading.settings.auto-cancel
    variant: switch=On, durationPreset=30秒
    rule: 30秒是可切换候选值，不应与当前选中态混淆。
  - familyId: trading.settings.auto-cancel
    variant: switch=On, durationPreset=40秒
    rule: 40秒是可切换候选值，不应与当前选中态混淆。
  - familyId: trading.settings.monitor-window
    variant: switch=On, cycleWindow=周一至周五, dailyWindow=09:30至15:00
    rule: 监控时段开启后，周期与每日时段必须同时可见，不应只保留开关不保留时间选择。
  - familyId: trading.info.holdings
    variant: 分类=持仓, 有内容=On, Dark=Off
    rule: 持仓有内容态需要保留 tab、标题统计、表头和多列列表，不应降级成摘要卡片。
  - familyId: trading.info.holdings
    variant: 分类=持仓, 有内容=Off, Dark=Off
    rule: 持仓空态要明确表达无数据，不要伪造成低密度列表。
  - familyId: trading.info.holdings
    variant: 分类=持仓, 有内容=On, Dark=On
    rule: 深色持仓有内容态需保持信息层级与浅色一致，不能只切背景不切文字与状态层级。
  - familyId: trading.info.holdings
    variant: 分类=持仓, 有内容=Off, Dark=On
    rule: 深色空态也应保留空结果语义，避免与加载中状态混淆。
  - familyId: trading.info.holdings.secondary-tabs
    variant: selectedTab=持仓
    rule: 当前选中持仓时，需要保留下划线、计数和其余 tab 的未选中层级。
  - familyId: trading.info.holdings.empty-state
    variant: state=empty, Dark=Off
    rule: 持仓空态浅色版保留 tab 和表头，内容区只显示空态插画与“暂无持仓”提示，不显示列表单列和批量操作。
  - familyId: trading.info.holdings.empty-state
    variant: state=empty, Dark=On
    rule: 持仓空态深色版同样保留 tab 和表头，内容区只显示深色空态卡片，不显示列表单列和批量操作。
  - familyId: trading.info.contract
    variant: 分类=合约, 有内容=On, Dark=Off
    rule: 合约信息区要保持合约上下文，不替代普通持仓列表。
  - familyId: trading.info.contract
    variant: 分类=合约, 有内容=On, Dark=On
    rule: 深色合约态只切主题，不改变合约信息结构和语义。
  - familyId: trading.info.contract.loan-switch
    variant: selectedLoanType=融资合约
    rule: 当前选中融资合约时，需要保留融资/融券双切换与明确选中态，不误改成主 tab 结构。
  - familyId: trading.info.contract.empty-state
    variant: state=empty, Dark=Off
    rule: 合约空态浅色版保留二级 tab 和合约表头，内容区只显示空态卡片，不显示融资/融券切换和合约单列。
  - familyId: trading.info.contract.empty-state
    variant: state=empty, Dark=On
    rule: 合约空态深色版同样保留二级 tab 和合约表头，内容区只显示深色空态卡片，不显示融资/融券切换和合约单列。
  - familyId: trading.info.entrust
    variant: 分类=委托, 有内容=On, Dark=Off
    rule: 委托信息区必须保留状态/操作列与批量撤单入口，不能简化成只读历史列表。
  - familyId: trading.info.entrust
    variant: 分类=委托, 有内容=On, Dark=On
    rule: 深色委托态应继续清晰区分已报、已撤、废单与橙色提示话术。
  - familyId: trading.info.entrust.section-header
    variant: section=未完成, tools=手工开关+批量撤单+折叠
    rule: 当前读到的未完成分组标题必须保留手工开关、批量撤单和折叠入口，不要压缩成只有标题数字的一行。
  - familyId: trading.info.entrust.section-header
    variant: section=已完成, tools=手工开关+折叠
    rule: 已完成分组标题固定保留仅手工下单和折叠，不展示批量撤单入口。
  - familyId: trading.info.entrust.table-header
    variant: listType=委托
    rule: 委托表头需固定保留四组字段和排序图标，避免与历史委托或持仓表头混淆。
  - familyId: trading.info.entrust.order-row
    variant: rowState=已报, operationStyle=撤单按钮
    rule: 已报委托应保留可见撤单按钮，状态与操作颜色保持高风险可识别。
  - familyId: trading.info.entrust.order-row
    variant: rowState=已撤, operationStyle=占位符
    rule: 已撤委托不应继续展示可点击撤单按钮，操作区保持不可操作占位语义。
  - familyId: trading.info.entrust.order-row
    variant: rowState=废单, operationStyle=错误原因
    rule: 废单委托必须同时展示错误状态和原因说明，不要只保留“废单”二字。
  - familyId: trading.info.entrust.notice
    variant: noticeType=TWAP, companionTag=两融
    rule: TWAP 提示要与橙色策略名和两融标记成组出现，不要拆成普通灰字说明。
  - familyId: trading.info.entrust.notice
    variant: noticeType=网格(到价触发), companionTag=方案名或详细说明
    rule: 网格或到价触发提示可以带方案名或详细条件说明，默认隐藏，仅在特定委托行需要时展示。
  - familyId: trading.info.entrust.action-area
    variant: section=未完成, middleAction=撤单重下
    rule: 未完成委托的快捷操作区保留行情、撤单重下和详情三项，不要误改成再来一单。
  - familyId: trading.info.entrust.action-area
    variant: section=已完结, middleAction=再来一单
    rule: 已完结委托的快捷操作区保留行情、再来一单和详情三项，不继续暴露撤单重下。
  - familyId: trading.info.condition-order
    variant: 分类=条件单, 有内容=On, Dark=Off
    rule: 条件单卡片必须包含策略说明、交易信息和底部操作区，不应只保留标题和状态。
  - familyId: trading.info.condition-order
    variant: 分类=条件单, 有内容=On, Dark=On
    rule: 深色条件单态要保留策略卡片层级和操作选项，不能压平为单列表项。
  - familyId: trading.info.condition-order.section-header
    variant: section=未完成, tools=仅今日触发+筛选+批量+折叠, collapsed=Off
    rule: 未完成条件单标题区保留仅今日触发、筛选、批量与折叠入口；仅今日触发不是委托区的仅手工下单。
  - familyId: trading.info.condition-order.section-header
    variant: section=已完结, tools=按有功能按钮变体, collapsed=按展开变体
    rule: 已完结条件单标题可使用 `37:28209` 标题组件组中的展开/功能按钮变体，不得直接套用未完成工具组合。
  - familyId: trading.info.condition-order.condition-card
    variant: 分类=未完成, 展开=On
    rule: 未完成条件单卡片需要保留运行状态、触发条件、策略说明、交易信息和可用操作。
  - familyId: trading.info.condition-order.condition-card
    variant: 分类=已完结, 展开=On/Off
    rule: 已完结条件单卡片对应 `37:28980` 组件组中的已完结展开与收起变体，需与运行中卡片区分。
  - familyId: trading.info.condition-order.security-info
    variant: 标的标签=On, 方案标签=Off
    rule: 标的信息默认展示市场/标的标签；方案标签默认不强制展示。
  - familyId: trading.info.condition-order.security-info
    variant: 标的标签=On, 方案标签=On
    rule: 当条件单类型需要展示方案标签时可展示，标签文字可编辑但不能替代交易状态。
  - familyId: trading.info.condition-order.strategy-info
    variant: strategyType=定价条件, aiAssistant=Off
    rule: 定价条件类策略说明保留触发条件文案，不默认出现 AI 助手或回测入口。
  - familyId: trading.info.condition-order.strategy-info
    variant: strategyType=网格成交驱动, aiAssistant=On
    rule: 网格成交驱动可出现图表、AI 助手或回测提示，但必须与具体策略类型绑定。
  - familyId: trading.info.condition-order.trade-info
    variant: infoType=交易明细, orderState=运行中
    rule: 运行中交易信息强调当前条件、触发预期和待处理状态。
  - familyId: trading.info.condition-order.trade-info
    variant: infoType=交易记录, orderState=已完结
    rule: 已完结交易信息强调结果和记录，不暴露运行中操作语义。
  - familyId: trading.info.condition-order.action-area
    variant: section=已完结, middleAction=再来一单
    rule: 已完结条件单底部操作可使用行情、再来一单、详情，不应显示撤单类主操作。
  - familyId: trading.info.condition-order.action-area
    variant: section=未完成, middleAction=撤单重下
    rule: 未完成条件单底部操作为行情、撤单重下、详情；撤单重下是中间操作项，不要误写成已完结状态的再来一单。
  - familyId: trading.info.history-entrust
    variant: 分类=历史/历史委托, 有内容=On, Dark=Off
    rule: 历史委托只表达历史结果与状态，不应暴露当前可撤等实时操作。
  - familyId: trading.info.history-entrust
    variant: 分类=历史/历史委托, 有内容=On, Dark=On
    rule: 深色历史委托态仍需保持历史结果语义，不与当前委托混淆。
  - familyId: trading.info.history-strategy
    variant: 分类=历史/历史策略, 有内容=On, Dark=Off
    rule: 历史策略要保持策略结果归档语义，不误导为运行中策略。
  - familyId: trading.info.history-strategy
    variant: 分类=历史/历史策略, 有内容=On, Dark=On
    rule: 深色历史策略态继续保持历史归档语义和信息层级。

