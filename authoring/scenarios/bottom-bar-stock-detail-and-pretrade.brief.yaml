    question: 个股详情是否用于明确的个股、ETF 等场内交易标的？
    passCriteria: 页面必须有明确标的上下文，不能用于普通首页或无标的页面。
  - id: pretrade-only-in-my-secondary-tabs
    question: 预交易是否只用于“我的”下自选、触发、模拟、持股四个二级页？
    passCriteria: 预交易不能用于全屏对话、首页普通入口、弹窗底部或下单确认区。
  - id: pretrade-index-fields-complete
