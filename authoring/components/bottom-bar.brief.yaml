familyVariantGroups:
  - familyId: bottom-bar.main
    displayName: Bottom Bar 主母组件变体组
    figmaComponentName: bottom bar/母组件
    variantCount: 20
    ruleLocation:
      groups: variantGroups
      perVariantRules: variantHumanRules
      extractedFacts: variants.confirmed
    note: >
      为了兼容当前文件中已经完整展开的 20 个 bottom bar 变体，本 family
      继续沿用 `variantGroups` 和 `variantHumanRules`。后续如果要统一命名，
      可由 Agent 批量迁移为 `familyVariantHumanRules`。

  - familyId: bottom-bar.voice-input
    displayName: 长按语音输入变体组
    figmaComponentName: bottom bar/item/长按语音输入
    figmaNodeId: "12:7621"
    componentKey: 4d772fd4a13f5179bfdf787d562be0940ab08358
    figmaExactName: bottom bar/item/长按语音输入
    bindingMode: must_use_library_instance
    bindingFailurePolicy: stop_and_recheck
    variantCount: 8
    variantProperties:
      - property: 发送状态
        values:
          "On":
            description: 语音采集中或松开发送状态。
            humanRule: 必须明确反馈正在录音、可松开发送或继续长按。
          "Off":
            description: 取消发送、非发送或危险反馈状态。
            humanRule: 必须和发送状态有明显视觉差异，避免误发。
      - property: 场景
        propertyNameStatus: confirmed-from-figma-plugin-api
        values:
          通用:
            description: APP 原生通用长按语音输入场景，覆盖黑版和白版。
            humanRule: 用于 APP 中长按输入胶囊后的语音输入覆盖态。
          H5:
            description: H5 长按语音输入视觉表达。
            humanRule: H5 没有真正深色主题，Dark=On / Off 只用于区分背景覆盖视觉。
      - property: Dark
        values:
          "On":
            description: APP 通用场景中表示深色主题；H5 场景中表示一种背景覆盖视觉。
            humanRule: 使用真实 Dark=On 变体，不要手动改色；H5 中不要理解为真正深色主题。
          "Off":
            description: APP 通用场景中表示浅色主题；H5 场景中表示另一种背景覆盖视觉。
            humanRule: 使用真实 Dark=Off 变体，不要手动改色；H5 中不要理解为真正浅色主题。
    usedIn:
      - primary-page
      - ai-chat-page
      - stock-quote-page
      - trading-page
      - h5-prototype
    allowedZones:
      - voice_input_interaction_overlay
      - bottom_bar_voice_feedback_layer
      - h5_voice_input_feedback
    forbiddenZones:
      - bottom_bar_visible_simultaneously
      - scroll_content_body
      - list_row_action_area
      - trading_action_button_area
      - ai_chat_message_body
    riskWarnings:
      - id: voice-input-recording-feedback
        severity: P1
        rule: 长按语音输入必须明确反馈当前是采集中、可松开发送，还是上滑取消，避免误发语音。
      - id: voice-input-h5-equivalence
        severity: P2
        rule: H5 场景使用真实 Figma 变体做视觉表达，但 H5 没有 APP 深色版，Dark 只表示背景覆盖视觉差异。
      - id: voice-input-replaces-bottom-bar
        severity: P1
        rule: 长按语音输入出现时 Bottom Bar 必须消失，不能同屏叠加。
    humanRules:
      do:
        - 作为 `bottom bar/item/长按语音输入` 母组件 family 维护。
        - 用户长按 Bottom Bar 的输入胶囊后进入该交互状态。
        - 1、2、5、6 四个通用场景变体用于 APP，覆盖黑版和白版。
        - 3、4、7、8 四个 H5 场景变体用于 H5，H5 没有真正深色版，只区分背景覆盖颜色。
        - 长按语音输入出现时，Bottom Bar 消失。
      dont:
        - 不要把这 8 个变体只当作 bottom bar 的使用示例。
        - 不要让长按语音输入和 Bottom Bar 同时出现。
        - 不要把语音采集中的覆盖层放进滚动内容正文。
        - 不要在交易按钮区域中复用长按语音反馈样式。

