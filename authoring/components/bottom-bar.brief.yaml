        - 作为 bottom bar 输入入口使用。
        - 在全屏对话场景中作为 `chat-dark` / `chat-light` 的内部输入胶囊子组件使用。
        - 保留麦克风图标、输入文案和右侧输入模式入口。
      dont:
        - 不要单独脱离 bottom bar 放进正文、卡片或列表行。

  - familyId: bottom-bar.agent-assistant
