        description: 个股详情陪伴提醒的可操作版本，可引导用户去分析或查看详情。
        hasReminder: true
        hasLink: true
        actionButtons: single-or-multiple-left-aligned
    humanRules:
      do:
        - 首页陪伴用于首页场景中的权益领取、功能上线、任务提醒等轻量引导。
        - 预交易陪伴用于“我的”体系或预交易场景中需要用户处理、点击或查看的功能引导。
        - 个股详情陪伴用于个股 / ETF 等标的详情页中，对当前标的状态进行提醒和分析引导。
        - 个股详情陪伴提醒默认展示详情链接。
        - 有两个操作选项时展示两个按钮；只有一个操作选项时，只保留左侧按钮。
        - 陪伴按钮必须左对齐，不要居中或右对齐。
        - 超链接只用于查看提醒或文案详情，不替代主操作按钮。
        - 示例话术可以按场景替换，但不得承诺收益或给出确定性投资结论。
      dont:
        - 不要把陪伴场景放进全屏对话底部输入区或 AI 对话正文。
        - 不要把陪伴按钮当成买 / 卖 / 撤下单按钮。
        - 不要在没有可处理事项时强行展示操作按钮。
        - 不要把首页权益领取、预交易处理事项和个股分析提示混用。
        - 不要让陪伴气泡遮挡指数模块、输入胶囊或交易风险信息。
