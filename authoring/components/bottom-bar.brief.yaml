  - familyId: bottom-bar.voice-input
    displayName: 长按语音输入变体组
    figmaComponentName: bottom bar/item/长按语音输入
    variantCount: 8
    variantProperties:
      - property: 发送状态
        values:
          "On":
            description: 语音采集中或松开发送状态。
            humanRule: 必须明确反馈正在录音、可松开发送或继续长按。
          "Off":
            description: 取消发送、非发送或危险反馈状态。
            humanRule: 必须和发送状态有明显视觉差异，避免误发。
      - property: 场景类型
        propertyNameStatus: "TODO_VERIFY_WITH_FIGMA: Figma 图层中显示为“通用 / H5”，需要确认真实 property 名称。"
        values:
          通用:
            description: App 原生或通用 bottom bar 场景。
            humanRule: 按真实 bottom bar 输入反馈处理。
          H5:
            description: H5 或 prototype 视觉等价表达。
            humanRule: 必须标记为 H5 表达，不能声称是原生 Figma 组件实例。
      - property: Dark
        values:
          "On":
            description: 深色模式。
            humanRule: 使用真实 Dark=On 变体，不要手动改色。
          "Off":
            description: 浅色模式。
            humanRule: 使用真实 Dark=Off 变体，不要手动改色。
    usedIn:
      - primary-page
      - ai-chat-page
      - stock-quote-page
      - trading-page
      - h5-prototype
      - "TODO_HUMAN_CONFIRM: 是否允许账户页和持仓页使用长按语音输入"
    allowedZones:
      - voice_input_interaction_overlay
      - bottom_bar_voice_feedback_layer
      - h5_voice_input_feedback
    forbiddenZones:
      - scroll_content_body
      - list_row_action_area
      - trading_action_button_area
      - ai_chat_message_body
    riskWarnings:
      - id: voice-input-recording-feedback
        severity: P1
        rule: 长按语音输入必须明确反馈当前是采集中、可松开发送，还是上滑取消，避免误发语音。
      - id: voice-input-h5-equivalence
        severity: P2
        rule: H5 场景可以做视觉等价表达，但不能声称是 Figma 原生组件实例。
    humanRules:
      do:
        - 作为 `bottom bar/item/长按语音输入` 母组件 family 维护。
        - 8 个发送状态 / 场景类型 / Dark 组合都要单独定义人工规则。
        - 通用场景和 H5 场景需要分别记录，不要混用原生组件和 H5 prototype 表达。
      dont:
        - 不要把这 8 个变体只当作 bottom bar 的使用示例。
        - 不要把语音采集中的覆盖层放进滚动内容正文。
        - 不要在交易按钮区域中复用长按语音反馈样式。

