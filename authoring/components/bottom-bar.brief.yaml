    displayName: Bottom Bar 主母组件变体组
    figmaComponentName: bottom bar/母组件
    variantCount: 20
    ruleLocation:
      groups: variantGroups
      perVariantRules: variantHumanRules
      extractedFacts: variants.confirmed
    note: >
      为了兼容当前文件中已经完整展开的 20 个 bottom bar 变体，本 family
      继续沿用 `variantGroups` 和 `variantHumanRules`。后续如果要统一命名，
