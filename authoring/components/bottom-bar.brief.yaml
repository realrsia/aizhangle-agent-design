  - familyId: bottom-bar.voice-input
    displayName: 长按语音输入
    figmaComponentName: bottom bar/item/长按语音输入
    familyType: voice-input-component-set
    sourceStatus: confirmed-from-figma-plugin-api
    figmaNodeId: "12:7621"
    componentKey: 4d772fd4a13f5179bfdf787d562be0940ab08358
    figmaExactName: bottom bar/item/长按语音输入
    bindingMode: must_use_library_instance
    bindingFailurePolicy: stop_and_recheck
    variantCount: 8
    componentPropertyDefinitions:
      发送状态:
        type: VARIANT
        defaultValue: "On"
        variantOptions:
          - "Off"
          - "On"
      场景:
        type: VARIANT
        defaultValue: 通用
        variantOptions:
          - 通用
          - H5
      Dark:
        type: VARIANT
        defaultValue: "On"
        variantOptions:
          - "On"
          - "Off"
    variantRuleSource:
      variantGroups: familyVariantGroups
      variantHumanRules: familyVariantHumanRules
      extractedVariants: familyVariantHumanRules
    usedIn:
      - primary-page
      - ai-chat-page
      - stock-quote-page
      - trading-page
      - account-page
      - position-page
      - app-my-position-page
      - h5-prototype
    allowedZones:
      - voice_input_interaction_overlay
      - bottom_bar_voice_feedback_layer
      - h5_voice_input_feedback
    forbiddenZones:
      - bottom_bar_visible_simultaneously
      - scroll_content_body
      - list_row_action_area
      - trading_action_button_area
      - ai_chat_message_body
    humanRules:
      do:
        - 用户在 Bottom Bar 的输入胶囊上长按时，切换到该长按语音输入组件。
        - 大部分一二级页面都可以通过 Bottom Bar 长按进入语音输入，并跳转到 AI Chat 状态。
        - 账户页、持仓页等二级页面允许使用长按语音输入。
        - 长按语音输入出现时，原 Bottom Bar 消失；两者不能同时出现。
        - APP 通用场景使用 1、2、5、6 四个变体，分别覆盖深色和浅色主题。
        - H5 场景使用 3、4、7、8 四个变体；H5 没有真正深色版，Dark 只用于区分背景覆盖视觉。
        - 每个发送状态、场景类型和 Dark 组合都要能单独定义规则。
      dont:
        - 不要把这 8 个变体只当作 bottom bar 的使用实例。
        - 不要让长按语音输入与 Bottom Bar 同屏叠加。
        - 不要把 H5 的 Dark=On / Off 理解为 APP 原生深浅主题切换。
        - 不要在交易行动按钮区域复用长按语音反馈样式。
        - 不要在设置页等没有 Bottom Bar 的三四级页面强行使用长按语音输入。

