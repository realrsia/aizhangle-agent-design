      - pretrade_bottom_composer
      - app_my_secondary_tab_bottom_composer
      - related_question_idle_toast_overlay
    forbiddenZones:
      - ai_chat_message_body
      - primary_page_bottom_composer
      - generic_card_footer
    riskWarnings:
      - id: stock-scene-not-order-submit
        severity: P1
        rule: 个股场景可承载行情和指数信息，但不应直接替代交易下单确认区。
    humanRules:
      do:
        - 用于有明确个股或行情上下文的底部输入、指数和陪伴组合。
        - 个股详情主要用于个股、ETF 等场内交易标的。
        - 预交易主要用于“我的”页面下自选、触发、模拟和持股二级页。
        - 预交易必须展示指数模块信息，以区别于普通 Bottom Bar。
        - 有指数模块时，必须保持指数名称、数值、涨跌额和涨跌幅的金融语义。
        - 个股场景关联问用于用户空闲后的提示引导；在个股详情中一般默认使用带指数模块的黑白版变体。
      dont:
        - 不要把个股场景底栏放到普通账户页或无标的页面。
        - 不要在缺少明确标的、账户状态或交易上下文时显示买 / 卖 / 撤行动底栏。
        - 不要把预交易直接当成下单确认区。
        - 不要在用户正在输入、语音采集或下单确认时弹出关联问 Toast。
  - scene: 个股场景
    subContext: 交易入口
    aliases:
