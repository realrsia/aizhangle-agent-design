slots:
  root:
    description: 底部栏根容器，宽度 390，固定在移动端 frame 底部。
  backgroundShadow:
    description: 底部渐变背景，按场景高度变化。
  controlRow:
    description: 承载输入胶囊、场景入口、助手入口或交易行动按钮的主操作行。
  inputPill:
    description: 语音输入胶囊，默认文案为“按住说话”。
    editable: true
  leftEntryIcon:
    description: 首页场景 / 全屏对话场景 / 个股场景左侧入口图标。
    editable: true
  rightAssistantIcon:
    description: 首页场景 / 全屏对话场景 / 个股场景右侧助手入口图标。
    editable: true
  collapseEntryButton:
    description: 首页场景入口展开后的收起按钮，图标为向下箭头；交易页展开态在左侧，自选页展开态在右侧。
    editable: false
    onlyWhen:
      - app-trade-entry-expanded-page
      - app-watchlist-entry-expanded-page
  tradingActions:
    description: 个股场景交易上下文中的买、卖、撤三个行动入口。
    editable: false
    allowedLabels:
      - 买
      - 卖
      - 撤
  agentSuggestionChips:
    description: 全屏对话场景的 AI 助手建议胶囊。
    editable: true
    defaultValues:
      - 深度思考
      - 收藏问题
      - 任务助手
  companionModule:
    description: 陪伴模块，包含人物形象、提醒文案、可选详情链接和一个或多个左对齐操作按钮。
    editable: true
  companionLink:
    description: 陪伴提醒中的详情链接，用于查看提醒或文案详情；不能替代主操作按钮。
    editable: true
  companionActionButtons:
    description: 陪伴提醒中的操作按钮，可单个或多个；按钮必须左对齐，只有一个按钮时保留左侧按钮。
    editable: true
  indexModule:
    description: 指数摘要模块，包含名称、数值、涨跌额、涨跌幅和展开箭头。
    editable: true
  relatedQuestionToast:
    description: 关联问空闲提示 Toast，用于覆盖输入胶囊或出现在个股详情左侧，引导用户进行系统预测、功能操作或个股分析。
    editable: true
    allowedWhen:
      - primary-page-idle-related-question
      - stock-detail-idle-related-question
    forbiddenWhen:
      - active-text-input
      - active-voice-recording
      - order-submit-confirmation
  aiGeneratedDisclosure:
    description: AI 内容披露文案“内容由AI生成”。
    editable: false
  homeIndicator:
    description: iOS home indicator 安全区，宽 134、高 5、底部 9。

