    forbiddenZones:
      - order_submit_action_area
      - trading_form_action_buttons
      - ai_chat_message_body
      - content_section_tab_area
      - list_row_action_area
    riskWarnings:
      - id: default-scene-no-trading-action
        severity: P1
        rule: 首页场景不应出现买、卖、撤等交易行动入口。
    humanRules:
      do:
        - 用于 APP 首页体系下的出招、大盘、早点听、提醒和任务页面底部输入与入口组合。
        - 首页场景不包含账户页、持仓页和搜索；账户与持仓属于二级页面，搜索职能在 AI Chat 中完成。
        - 交易页展开态中，点击左侧交易入口展开后，左侧按钮切换为向下箭头收起态。
        - 自选页展开态中，点击右侧自选入口展开后，右侧按钮从“自选”切换为向下箭头收起态。
        - 按真实 Figma 变体选择黑版 Dark=On 或白版 Dark=Off，不要手动改色。
        - 保持语音输入胶囊、左右入口和安全区完整。
      dont:
        - 不要把这里的交易页展开态理解为买 / 卖 / 撤下单行动区。
        - 不要把首页场景当成全屏对话页的建议胶囊底栏。
  - scene: 全屏对话场景
    description: APP 内全屏 AI 对话或助手对话页的底部输入区，支持 Agent 建议胶囊、追问入口和 AI 生成内容提示。
    usedIn:
      - ai-chat-page
      - fullscreen-ai-dialog-page
      - assistant-conversation-page
      - ai-answer-followup-page
    allowedZones:
      - ai_chat_page_composer
      - assistant_conversation_bottom
      - fullscreen_dialog_bottom_composer
    forbiddenZones:
      - primary_page_bottom_composer
      - trading_page_bottom_action
      - stock_quote_bottom_action
      - h5_page_bottom
      - account_page_bottom
      - search_page_bottom
      - modal_or_sheet_bottom
      - secondary_or_tertiary_page_bottom
      - ai_chat_message_bubble_inline_area
    riskWarnings:
      - id: chat-scene-ai-disclosure
        severity: P1
        rule: 全屏对话场景出现 AI 建议胶囊时，需要确认是否显示“内容由AI生成”。
    humanRules:
      do:
        - 用于 APP 内全屏 AI 对话页底部输入、追问和任务助手入口。
        - 按主题选择黑版 `chat-dark` 或白版 `chat-light`，不要手动改色。
        - 保留 Agent 建议胶囊的选中态、未选中态和展开箭头语义。
        - AI 对话正文属于全屏对话场景上下文，但 bottom bar 本体仍固定在底部输入区。
        - 下方页面示例只作为该场景的使用样例，不作为新的母组件或变体定义。
      dont:
        - 不要在对话正文中直接出现买、卖、撤交易行动。
        - 不要把全屏对话场景底栏用于普通一级落地页。
        - 不要用于个股行情底部行动区或交易入口。
        - 不要用于 H5 页面、账户页、搜索页、弹窗底部或二三级子页面。
  - scene: 个股场景
    description: 个股详情或行情页底部区域，支持指数模块和陪伴模块；本场景下继续区分“个股详情”和“预交易”两个使用语义。
    aliases:
      - 交易场景
      - 个股交易
    subContexts:
      - id: stock-detail
        name: 个股详情
        description: 用于个股、ETF 等场内交易标的的详情页底部区域。
      - id: pretrade
        name: 预交易
        description: 用于“我的”页面下自选、触发、模拟和持股四个二级页，较普通 Bottom Bar 多出指数展示信息。
      - id: related-question-idle-toast
        name: 个股场景关联问
        description: 用于一级页面或个股详情页的空闲提示，引导用户进行系统预测、功能操作或个股分析；个股详情下默认优先使用带指数模块的关联问变体。
    usedIn:
