    toastCopyExamples:
      - 当前个股创 200 日新高，去分析一下
      - 当前个股异动明显，看看可能原因
      - 要不要分析一下这只个股的趋势变化
      - 你盯这只股票好久啦！不如先模拟交易试试。
    exampleTypes:
      - id: related-question-primary-idle-dark
        name: 一级页面 / 空闲关联问提示黑版
        description: 首页等一级页面中，用户一段时间没有操作后，中间输入胶囊上方或内部覆盖 Toast，引导用户进行系统预测、功能操作或个股分析。
        relatedVariant: trading-related-dark
        preferredWhenIndexDataExists: false
        toastPlacement: input-pill-overlay
      - id: related-question-primary-idle-light
        name: 一级页面 / 空闲关联问提示白版
        description: 首页等一级页面中，用户一段时间没有操作后，中间输入胶囊上方或内部覆盖 Toast，引导用户进行系统预测、功能操作或个股分析。
        relatedVariant: trading-related-light
        preferredWhenIndexDataExists: false
        toastPlacement: input-pill-overlay
      - id: related-question-stock-detail-idle-dark
        name: 个股详情 / 空闲关联问提示黑版
        description: 个股详情页中，用户一段时间没有操作后，左侧出现 Toast 引导，交易、买、卖、撤按钮收成一个入口按钮。
        relatedVariant: trading-related-index-dark
        preferredWhenIndexDataExists: true
        toastPlacement: left-side-overlay
        actionButtonBehavior: collapse-trading-actions-into-one-button
      - id: related-question-stock-detail-idle-light
        name: 个股详情 / 空闲关联问提示白版
        description: 个股详情页中，用户一段时间没有操作后，左侧出现 Toast 引导，交易、买、卖、撤按钮收成一个入口按钮。
        relatedVariant: trading-related-index-light
        preferredWhenIndexDataExists: true
        toastPlacement: left-side-overlay
        actionButtonBehavior: collapse-trading-actions-into-one-button
    humanRules:
      do:
        - 个股场景关联问的母组件参考 `trading-related-*` 变体；在个股场景下通常有指数数据，默认优先参考 `trading-related-index-dark` 和 `trading-related-index-light`。
        - 一级页面空闲提示用于首页等一级页面，用户一段时间没有操作后，中间输入胶囊覆盖 Toast 式提示；该提示持续存在，直到用户点击关闭。
        - Toast 文案用于引导系统预测、可能想操作的功能、个股分析等，不应直接承诺收益或给出交易建议。
        - 个股详情空闲提示用于个股 / ETF 详情页，用户一段时间没有操作后触发，并持续存在直到用户点击关闭。
        - 个股详情空闲提示出现时，交易、买、卖、撤按钮需要收成一个入口按钮，左侧展示 Toast 引导。
        - 黑白主题必须使用真实 `Dark=On` / `Dark=Off` 变体，不要手动改色。
      dont:
        - 不要把关联问空闲提示用于正在输入、正在语音采集、下单确认或交易表单提交区域。
        - 不要把 Toast 文案写成确定性投资建议、收益承诺或替用户做交易决策。
