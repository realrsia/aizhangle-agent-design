# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.bottom-bar
name: 底部栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐 AI 底部固定交互区，包括一级页面输入底栏、AI 对话输入底栏、
  个股行情底部行动栏。底部栏是结构契约组件，必须按页面上下文和可见结构路由。

# [HUMAN REQUIRED]
usedIn:
  - primary-page
  - ai-chat-page
  - stock-quote-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 先按页面上下文和可见结构分类为 primaryPage、chatPage 或 stockQuotePage。
    - 底部栏固定在移动端 frame 底部并位于内容层之上。
    - 视觉修复前必须先确认结构契约。
  dont:
    - 不要把一级页面交易入口和个股行情买卖撤行动混用。
    - 不要移除官方入口、拉伸输入框或改变 scene entry 顺序来做视觉修复。

# [HUMAN REQUIRED]
riskWarnings:
  - 个股行情底部买卖撤入口涉及交易路径，必须保持场景和结构正确。

# [HUMAN REQUIRED]
allowedZones:
  - mobile_frame_bottom
  - stock_quote_bottom_action
  - chat_page_composer

# [HUMAN REQUIRED]
forbiddenZones:
  - scroll_content_body
  - ordinary_card_footer

# [HUMAN REQUIRED]
requiredPairings:
  - page-context
  - safe-area
  - variant

# [HUMAN REQUIRED]
forbiddenPairings:
  - generic-bottom-navigation
  - floating-card-substitute

# [HUMAN REQUIRED]
examples:
  good:
    - assetPath: assets/examples/stock-detail-page.png
      reason: 个股行情底部行动栏与页面上下文一致。
  needsReview: []
  bad:
    - name: 首页交易入口使用个股买入资产
      reason: 一级页面 scene entry 与个股 quote action 语义不同。

