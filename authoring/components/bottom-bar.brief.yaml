    humanRules:
      do:
        - 仅用于明确交易或委托上下文。
        - 买、卖、撤行动必须保持真实 Figma 变体和图标语义。
      dont:
        - 不要用于一级落地页、账户总览页或 AI 对话正文。
        - 不要删除交易动作之外的安全区、输入胶囊或必要上下文。

# [HUMAN REQUIRED]
variantModifiers:
  - property: 有关联问
    values:
      "On":
        description: 个股场景中存在关联问或相关追问入口；该含义已经确认。
        humanRule: 关联问开启时，用于在用户空闲或需要引导时展示相关追问、系统预测、功能操作或个股分析入口；该规则已确认，不需要再次讨论。
      "Off":
        description: 不展示关联问入口。
  - property: 有陪伴
    values:
      "On":
        description: 展示陪伴模块，底栏高度升高，内容区必须增加底部避让。
        humanRule: 陪伴模块出现时，应保留人物形象、文本气泡和建议按钮结构。
      "Off":
        description: 不展示陪伴模块，使用较低高度的底栏变体。
  - property: 有指数
    values:
      "On":
        description: 展示指数模块，包含名称、数值、涨跌额、涨跌幅和展开入口。
        humanRule: 指数数值必须使用金融语义 token，不得使用普通文字色。
      "Off":
        description: 不展示指数模块。
  - property: Dark
    values:
