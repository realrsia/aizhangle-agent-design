    componentKey: 8cbb729a37926f3ff74f84f60bee46a009e4de04
    bindingMode: must_use_library_instance
    variantCount: 20
    variantRuleSource:
      variantGroups: variantGroups
      variantHumanRules: variantHumanRules
      extractedVariants: variants.confirmed
    usedIn:
      - primary-page
      - app-home-出招-page
      - app-home-大盘-page
      - app-home-早点听-page
      - app-home-提醒-page
      - app-home-任务-page
      - ai-chat-page
      - stock-quote-page
      - trading-page
      - market-or-index-aware-page
      - account-page
      - position-page
      - app-my-position-page
    allowedZones:
      - mobile_frame_bottom
      - primary_page_bottom_composer
      - ai_chat_page_composer
      - stock_quote_bottom_action
      - trading_page_bottom_action
    forbiddenZones:
      - scroll_content_body
      - ordinary_card_footer
      - content_section_tab_area
      - list_row_action_area
      - ai_chat_message_body
    humanRules:
      do:
        - 作为页面底部固定交互区使用。
        - 按页面上下文选择首页场景、全屏对话场景、个股场景、个股场景关联问或陪伴场景变体。
        - 首页场景优先覆盖出招、大盘、早点听、提醒和任务这 5 个 APP 首页入口页。
        - 保留安全区、home indicator、输入入口和必要的 AI / 交易语义。
      dont:
        - 不要用普通按钮组、tabs 或卡片 footer 替代。
