      selectedCount: 22
      selectedNodeIds:
        - "NEEDS_FIGMA_SELECTION: 交易页展开态和自选页展开态是页面 frame / 使用案例，需要下次单独选中对应 frame 后记录 nodeId"
      selectedNodeNames:
        - "默认, 有关联问=Off, 有陪伴=Off, 有指数=Off, Dark=On"
        - "默认, 有关联问=Off, 有陪伴=Off, 有指数=Off, Dark=Off"
        - 个股交易
        - "NEEDS_FIGMA_SELECTION: 自选页展开态 frame 名称需单独选中后记录"
    usedIn:
      - app-trade-entry-expanded-page
      - app-watchlist-entry-expanded-page
    allowedZones:
      - app_trade_entry_expanded_bottom_composer
      - app_watchlist_entry_expanded_bottom_composer
    forbiddenZones:
      - order_submit_action_area
      - trading_form_action_buttons
      - ai_chat_page_composer
      - ai_chat_message_bubble_inline_area
      - modal_or_sheet_bottom
      - generic_card_footer
    exampleTypes:
      - id: home-trade-entry-expanded-dark
        name: 交易页左侧入口展开态 / 黑版
        description: 交易页面中点击左侧交易入口展开后，左侧圆形按钮切换为向下箭头收起态。
        relatedVariant: default-dark
        expandedEntrySide: left
        expandedEntryName: 交易
        collapseButtonSide: left
        collapseButtonIcon: down-arrow
      - id: home-trade-entry-expanded-light
        name: 交易页左侧入口展开态 / 白版
        description: 交易页面中点击左侧交易入口展开后，左侧圆形按钮切换为向下箭头收起态。
        relatedVariant: default-light
        expandedEntrySide: left
        expandedEntryName: 交易
        collapseButtonSide: left
        collapseButtonIcon: down-arrow
      - id: home-watchlist-entry-expanded-dark
        name: 我的/自选二级页右侧入口展开态 / 黑版
        description: 进入“我的”页面下的自选二级页后，右侧圆形按钮从“自选”切换为向下箭头收起态。
        relatedVariant: default-dark
        expandedEntrySide: right
        expandedEntryName: 我的/自选
        collapseButtonSide: right
        collapseButtonIcon: down-arrow
      - id: home-watchlist-entry-expanded-light
        name: 我的/自选二级页右侧入口展开态 / 白版
        description: 进入“我的”页面下的自选二级页后，右侧圆形按钮从“自选”切换为向下箭头收起态。
        relatedVariant: default-light
        expandedEntrySide: right
        expandedEntryName: 我的/自选
        collapseButtonSide: right
        collapseButtonIcon: down-arrow
      - id: home-my-simulation-entry
        name: 我的/模拟二级页入口状态
        description: 用户进入“我的”页面并点击“模拟”二级页后，可显示模拟入口状态；默认仍优先使用文字状态。
        relatedComponentFamily: bottom-bar.trading-entry
        defaultDisplayMode: text
        iconDisplayMode: only-when-user-requests
    humanRules:
      do:
        - 把交易页展开态和自选页展开态作为首页场景的特殊使用实例维护。
        - 交易页展开态由左侧入口触发，左侧按钮必须显示向下箭头收起。
        - 自选、触发、模拟和持股都是“我的”页面下的二级页面；自选展开态应按“我的 / 自选二级页”处理。
        - 我的/自选二级页展开态由右侧入口触发，右侧按钮必须从“自选”切换为向下箭头收起。
        - 我的/模拟二级页出现模拟入口状态；默认展示文字按钮，只有用户明确要求时才使用图标状态。
        - 展开态仍保留输入胶囊和 iOS home indicator。
      dont:
        - 不要把交易页展开态误写成买 / 卖 / 撤下单行动底栏。
        - 不要把自选、触发、模拟、持股当成独立于“我的”的一级场景。
        - 不要在我的/自选二级页展开态中继续显示右侧“自选”按钮而不是收起按钮。
        - 不要在自选、触发或持股二级页使用模拟按钮。
        - 不要把左右入口的展开方向互换。
    reviewChecklistRefs:
      - scene-family-mapping-correct
      - home-entry-collapse-side-correct
      - input-pill-structure-valid

