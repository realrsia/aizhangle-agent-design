# [HUMAN REQUIRED]
usageInstanceGroups:
  - groupId: bottom-bar-visual-generation-reference-examples
    displayName: Bottom Bar 视觉生成参考案例
    instanceType: visual-generation-reference
    relatedComponentFamily: bottom-bar.main
    sourceStatus: selected-in-figma-but-selection-api-not-synced
    figmaSelection:
      sourceName: bottom bar/item/陪伴母组件 search results / selected usage frames
      selectedCount: 14
      selectedNodeIds:
        - "NEEDS_FIGMA_SELECTION: Figma 插件 API 当前读取 selectionCount=0；需要下次重新选中 14 个 frame 后补齐 nodeId。"
      selectedOrderRule: 左侧 1-7 为深色主题，右侧 8-14 为浅色主题；1 与 8、2 与 9、3 与 10、4 与 11、5 与 12、6 与 13、7 与 14 一一对应。
      duplicateHandling: 第 2 个与第 3 个均为 AI 对话参考页面，后续视觉参考只保留一个，另一个标记为 duplicate。
    globalLayoutRules:
      zIndex: foremost-page-ui-layer
      yAxis: screen-bottom
      rule: Bottom Bar 在视觉生成时必须位于屏幕最下方，并处于页面常驻交互层最前方。
    themePairs:
      - pairId: morning-audio-standard
        darkOrder: 1
        lightOrder: 8
        scene: 首页场景
        pageName: 早点听
        description: 早点听页面的标准 Bottom Bar，用作首页体系音频/早报类页面参考。
        referenceStatus: active
      - pairId: fullscreen-ai-dialog
        darkOrder: 2
        lightOrder: 9
        scene: 全屏对话场景
        pageName: AI 对话
        description: AI 对话页的标准底部输入区参考。
        referenceStatus: active
      - pairId: fullscreen-ai-dialog-duplicate
        darkOrder: 3
        lightOrder: 10
        scene: 全屏对话场景
        pageName: AI 对话
        description: 与第 2 / 9 组语义重复，保留记录但后续视觉生成不优先引用。
        referenceStatus: duplicate-do-not-prioritize
        duplicateOf: fullscreen-ai-dialog
      - pairId: morning-audio-with-companion
        darkOrder: 4
        lightOrder: 11
        scene: 陪伴场景
        pageName: 早点听 + 陪伴
        description: 早点听页面叠加陪伴提醒模块，用作首页陪伴场景视觉参考。
        referenceStatus: active
      - pairId: stock-detail-trading-standard
        darkOrder: 5
        lightOrder: 12
        scene: 个股场景
        pageName: 个股详情交易页
        description: 常规个股详情交易页面，包含行情/标的上下文和底部交易入口参考。
        referenceStatus: active
      - pairId: stock-detail-related-question
        darkOrder: 6
        lightOrder: 13
        scene: 个股场景关联问
        pageName: 个股详情关联问
        description: 个股详情中出现关联问/提示引导时的 Bottom Bar 参考。
        referenceStatus: active
      - pairId: stock-detail-companion
        darkOrder: 7
        lightOrder: 14
        scene: 陪伴场景
        pageName: 个股详情 + 陪伴
        description: 个股详情页面叠加陪伴提醒模块，用作个股陪伴场景视觉参考。
        referenceStatus: active
    usedIn:
      - visual-generation-reference
      - figma-page-generation
      - design-review-reference
    allowedZones:
      - mobile_frame_bottom
      - primary_page_bottom_composer
      - ai_chat_page_composer
      - stock_detail_bottom_composer
    forbiddenZones:
      - scroll_content_body
      - chart_layer_above_bottom_bar
      - list_content_above_bottom_bar
      - ordinary_card_footer
    humanRules:
      do:
        - 后续做视觉生成时优先参考 active 的 6 组黑白配对案例。
        - 深色和浅色主题必须按一一对应关系成对选择，不要只引用单边主题。
        - 第 2 / 9 组和第 3 / 10 组是 AI 对话重复案例，只保留一组作为优先参考。
        - 生成页面时 Bottom Bar 必须贴底，并处于页面常驻交互层最前方。
      dont:
        - 不要把这 14 个 frame 当成新的组件母体。
        - 不要把 duplicate 的 AI 对话参考作为额外场景扩展。
        - 不要让页面正文、图表或列表遮挡 Bottom Bar。
    reviewChecklistRefs:
      - bottom-bar-layer-foremost
      - bottom-bar-y-axis-screen-bottom
      - visual-reference-theme-pairing-valid
      - visual-reference-duplicate-not-prioritized

