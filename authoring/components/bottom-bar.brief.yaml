# 人工必填区
# ============================================================

id: component.bottom-bar
name: 底部栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐 / AI 涨乐移动端页面底部固定交互区，承载语音输入、
  AI 助手入口、页面场景入口、个股指数模块预览、个股买卖撤行动入口、
  AI 生成内容提示和 iOS home indicator。该组件不是普通按钮组；
  它是页面底部区域的结构契约组件，必须根据页面上下文、
  交易风险、AI 内容披露和 light / dark 主题选择真实 Figma 组件变体。

# [HUMAN REQUIRED]
usedIn:
  - primary-page
  - app-home-zhaochu-page
  - app-home-market-page
  - app-home-morning-audio-page
  - app-home-reminder-page
  - app-home-task-page
  - ai-chat-page
  - stock-quote-page
  - trading-page
  - market-or-index-aware-page
  - "TODO_HUMAN_CONFIRM: 是否还用于账户、持仓、搜索等非个股页面"

# [HUMAN REQUIRED]
humanRules:
  do:
    - 先按截图分类选择场景变体：首页场景、全屏对话场景、个股场景、个股场景关联问或陪伴场景。
    - 再按页面状态选择是否显示关联问、陪伴、指数模块和 Dark 主题。
    - 首页场景目前适用于 APP 首页体系下的出招、大盘、早点听、提醒和任务页面。
    - 底部栏必须固定在移动端 frame 底部，并为滚动内容预留遮挡安全距离。
    - 全屏对话场景若展示 AI 建议胶囊或 AI 生成内容，应保留“内容由AI生成”提示。
    - 个股场景必须区分指数信息、陪伴模块和买 / 卖 / 撤行动入口；交易入口属于个股场景下的交易上下文。
    - light / dark 模式必须使用真实变体，不要只替换背景色。
  dont:
    - 不要把普通按钮、tabs、列表行操作区或内容区胶囊当作 bottom bar 使用。
    - 不要在 AI 对话正文中放置买、卖、撤等交易行动按钮。
    - 不要在个股场景的交易上下文中使用首页场景的右侧助手图标替代买 / 卖 / 撤行动。
    - 不要删除 home indicator、安全区或 AI 内容披露文案来压缩高度。
    - 不要用手绘 frame 近似强维护底栏组件。

# [HUMAN REQUIRED]
riskWarnings:
  - id: bottom-bar-structure-contract
    severity: P0
    rule: 底部栏定义页面底部固定交互结构，误用会导致页面导航、输入或交易入口语义错误。
  - id: trading-actions-in-bottom-bar
    severity: P0
    rule: 个股场景中的买、卖、撤入口涉及资金和交易路径，必须有明确标的和交易上下文。
  - id: ai-generated-disclosure
    severity: P1
    rule: 全屏对话或 AI 建议内容出现时，需要确认是否保留“内容由AI生成”披露文案。

# [HUMAN REQUIRED]
allowedZones:
  - mobile_frame_bottom
  - primary_page_bottom_composer
  - ai_chat_page_composer
  - stock_quote_bottom_action
  - trading_page_bottom_action
  - market_index_bottom_summary

# [HUMAN REQUIRED]
forbiddenZones:
  - scroll_content_body
  - ordinary_card_footer
  - content_section_tab_area
  - list_row_action_area
  - ai_chat_message_body
  - generic_form_footer
  - marketing_or_banner_area

# [HUMAN REQUIRED]
requiredPairings:
  - page-context
  - safe-area
  - figma-variant
  - light-or-dark-theme
  - voice-input-or-action-context
  - ai-disclosure-when-ai-content-visible
  - trading-context-when-buy-sell-cancel-visible

# [HUMAN REQUIRED]
forbiddenPairings:
  - generic-bottom-navigation
  - tabs-component-as-bottom-bar
  - ordinary-button-group-as-bottom-bar
  - trading-action-without-selected-security
  - ai-message-body-with-direct-trade-action
  - floating-card-substitute

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "12:10173"
      name: bottom bar/母组件 / 首页场景 / Dark
      reason: 首页场景底部固定输入栏，包含左侧场景图标、语音输入胶囊、右侧助手入口和 home indicator。
    - figmaNodeId: "12:10180"
      name: bottom bar/母组件 / 全屏对话场景 / Dark
      reason: 全屏对话场景在输入栏上方显示 Agent 助手胶囊，并保留 AI 生成内容提示。
    - figmaNodeId: "12:10325"
      name: bottom bar/母组件 / 个股场景 / 有陪伴 / 有指数 / Dark
      reason: 个股场景的交易上下文包含陪伴模块、指数模块、语音输入和买 / 卖 / 撤行动入口。
  needsReview:
    - name: "TODO_HUMAN_CONFIRM: 是否需要为传统五项底部导航另建 brief"
      reason: 本文件本轮只记录当前选中的 bottom bar/母组件及 20 个变体，不纳入其他未选中的底部导航组件。
  bad:
    - name: 用 tabs 组件模拟底部栏
      reason: tabs 只负责同级内容切换，不承载页面底部固定输入、AI 披露和安全区。
    - name: AI 对话正文内直接出现买入按钮
      reason: 买卖撤行动必须在交易上下文底栏或交易表单内出现，不能作为普通 AI 回复内容。
    - name: 个股场景交易上下文使用首页场景三按钮底栏
      reason: 首页场景右侧助手入口不能替代买 / 卖 / 撤行动。

# [HUMAN REQUIRED]
componentHumanRules:
  ruleScope: component-family-board
  appliesTo:
    figmaPage: bottom bar
    componentId: component.bottom-bar
    confirmedFamilyCount: "TODO_VERIFY_WITH_FIGMA"
  definition: >
    这里记录 bottom bar 画板级规则：这个画板下的所有母组件都先作为
    独立 `componentFamilies` 登记，每个母组件 family 再拥有自己的变体组
    和变体人工规则。`bottom bar/母组件` 的 20 个变体继续写入
    `variantGroups` 和 `variantHumanRules`；其他母组件，例如
    `bottom bar/item/长按语音输入` 的 8 个变体，写入
    `familyVariantGroups` 和 `familyVariantHumanRules`。页面截图、H5 demo
    或临时组合只写入 `usageInstanceGroups`。
  humanEditableFields:
    - purpose
    - usedIn
    - humanRules
    - allowedZones
    - forbiddenZones
    - requiredPairings
    - forbiddenPairings
    - riskWarnings
    - examples
  do:
    - 先判断新增对象是不是 Figma 里的母组件 / component set；如果是，就先登记为 component family。
    - 每个 component family 都要有自己的大致使用场景、允许区域、禁用区域和风险边界。
    - 每个 family 下面的子变体都要能单独补充人工规则。
  dont:
    - 不要把真实母组件降级成普通使用实例或交互状态。
    - 不要把所有母组件的规则合并进一个笼统的 bottom bar 总规则里。
    - 不要把页面示例、H5 demo、交互过程截图直接当成新的母组件 family。
    - 不要让 `authoring/scenarios` 反向覆盖组件本身的允许 / 禁止使用边界。

# [HUMAN REQUIRED]
extensionModel:
  principle: >
    本 brief 先按 Figma 画板里的母组件分类，再按每个母组件的变体展开。
    `componentFamilies` 是所有母组件的目录；每个 family 都可以拥有自己的
    variant groups 和 variant human rules。`bottom bar/母组件` 作为主要 bottom bar
    family，沿用 `variantGroups` / `variantHumanRules`；其他 family 使用
    `familyVariantGroups` / `familyVariantHumanRules`。页面截图、H5 表现、
    prototype 状态或使用示例只写入 `usageInstanceGroups`。场景编排规则只在
    `authoring/scenarios` 中做跨组件组合说明。
  addNewComponentFamilyWhen:
    - Figma bottom bar 画板中新增了一个母组件、component set 或可复用组件族。
    - 新增对象下面还有多个可切换子变体，或后续需要为每个子变体写人工规则。
    - 示例：`bottom bar/母组件`、`bottom bar/item/长按语音输入`、`bottom bar/item/Agent助手/母组件`。
  requiredForNewComponentFamily:
    - familyId
    - displayName
    - figmaComponentName
    - familyType
    - sourceStatus
    - usedIn
    - allowedZones
    - forbiddenZones
    - humanRules
    - variantRuleSource
  addNewMotherVariantWhen:
    - Figma 中某个 component family 下新增了真实 variant。
    - 新增项拥有明确的 property 组合，例如 场景 / 有关联问 / 有陪伴 / 有指数 / Dark。
    - 新增项应同步进入该 family 对应的 variant group 和 variant human rules。
  requiredForNewFamilyVariant:
    - familyId
    - variantId
    - figmaNodeId
    - figmaNodeName
    - variantProperties
    - usedIn
    - allowedZones
    - forbiddenZones
    - humanRules
    - reviewChecklistRefs
  addNewUsageInstanceWhen:
    - 新增项是某个 bottom bar 变体的使用示例。
    - 新增项来自页面截图、局部 frame、prototype 状态、H5 demo 或非母组件 variant。
    - 新增项只用于说明“这个 component family 或某个变体在页面里怎么出现”，不承载完整组件规则。
  requiredForNewUsageInstance:
    - groupId
    - displayName
    - instanceType
    - relatedComponentFamily
    - relatedSlots
    - usedIn
    - allowedZones
    - forbiddenZones
    - humanRules
    - figmaSelection
    - reviewChecklistRefs

# [HUMAN REQUIRED]
componentFamilies:
  - familyId: bottom-bar.main
    displayName: Bottom Bar 主母组件
    figmaComponentName: bottom bar/母组件
    familyType: bottom-bar-container-component-set
    sourceStatus: confirmed-from-selected-figma-component
    variantCount: 20
    variantRuleSource:
      variantGroups: variantGroups
      variantHumanRules: variantHumanRules
      extractedVariants: variants.confirmed
    usedIn:
      - primary-page
      - app-home-zhaochu-page
      - app-home-market-page
      - app-home-morning-audio-page
      - app-home-reminder-page
      - app-home-task-page
      - ai-chat-page
      - stock-quote-page
      - trading-page
      - market-or-index-aware-page
      - "TODO_HUMAN_CONFIRM: 是否还用于账户、持仓、搜索等非个股页面"
    allowedZones:
      - mobile_frame_bottom
      - primary_page_bottom_composer
      - ai_chat_page_composer
      - stock_quote_bottom_action
      - trading_page_bottom_action
    forbiddenZones:
      - scroll_content_body
      - ordinary_card_footer
      - content_section_tab_area
      - list_row_action_area
      - ai_chat_message_body
    humanRules:
      do:
        - 作为页面底部固定交互区使用。
        - 按页面上下文选择首页场景、全屏对话场景、个股场景、个股场景关联问或陪伴场景变体。
        - 首页场景优先覆盖出招、大盘、早点听、提醒和任务这 5 个 APP 首页入口页。
        - 保留安全区、home indicator、输入入口和必要的 AI / 交易语义。
      dont:
        - 不要用普通按钮组、tabs 或卡片 footer 替代。
        - 不要把页面示例 frame 当作该 family 的新增变体。

  - familyId: bottom-bar.voice-input
    displayName: 长按语音输入
    figmaComponentName: bottom bar/item/长按语音输入
    familyType: voice-input-component-set
    sourceStatus: observed-from-current-figma-board-selection
    variantCount: 8
    variantRuleSource:
      variantGroups: familyVariantGroups
      variantHumanRules: familyVariantHumanRules
      extractedVariants: "TODO_VERIFY_WITH_FIGMA: 需要补充真实 nodeId / componentKey"
    usedIn:
      - primary-page
      - ai-chat-page
      - stock-quote-page
      - trading-page
      - h5-prototype
      - "TODO_HUMAN_CONFIRM: 是否允许账户页和持仓页使用长按语音输入"
    allowedZones:
      - voice_input_interaction_overlay
      - bottom_bar_voice_feedback_layer
      - h5_voice_input_feedback
    forbiddenZones:
      - scroll_content_body
      - list_row_action_area
      - trading_action_button_area
      - ai_chat_message_body
    humanRules:
      do:
        - 作为长按语音输入期间的独立组件 family 维护。
        - 每个发送状态、场景类型和 Dark 组合都要能单独定义规则。
        - 通用场景和 H5 场景需要区分，不要混用真实组件和 prototype 表达。
      dont:
        - 不要把这 8 个变体只当作 bottom bar 的使用实例。
        - 不要把 H5 视觉等价状态当成原生底栏容器变体。
        - 不要在交易行动按钮区域复用长按语音反馈样式。

