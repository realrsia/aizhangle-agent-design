# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.tag
name: 标签
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于在金融列表、个股信息、信号分组、风险提示等场景中表达分类、
  市场归属、标的属性、情绪或风险状态。标签应帮助扫描，不应抢占主要价格、
  盈亏和交易信息的视觉权重。

# [HUMAN REQUIRED]
usedIn:
  - watchlist-row
  - holdings-row
  - stock-quote-detail
  - grouped-signal
  - market-overview

# [HUMAN REQUIRED]
humanRules:
  do:
    - 先按语义分类，再选择颜色和样式。
    - 标的标签、信号标签、风险标签和情绪标签应使用各自规则。
    - 密集列表里的标签必须保持紧凑并低于主要数据权重。
  dont:
    - 不要用标签色表达涨跌主语义。
    - 不要在列表行内堆叠过多标签导致行高失控。
    - 不要用 raw color 临时创建标签样式。

# [HUMAN REQUIRED]
riskWarnings:
  - 风险、信用、市场归属等标签会影响用户理解，应避免错误分类或过强视觉权重。

# [HUMAN REQUIRED]
allowedZones:
  - stock_metadata_inline
  - watchlist_row_metadata
  - holdings_row_metadata
  - signal_group_header
  - detail_secondary_info

# [HUMAN REQUIRED]
forbiddenZones:
  - primary_price_value
  - trading_order_submit_area
  - bottom_navigation_item

# [HUMAN REQUIRED]
requiredPairings:
  - semantic-category

# [HUMAN REQUIRED]
forbiddenPairings:
  - raw-market-movement-color
  - oversized-primary-emphasis

# [HUMAN REQUIRED]
examples:
  good:
    - assetPath: assets/examples/tag-system.png
      reason: 覆盖标的、信号和状态标签的语义分组。
  needsReview: []
  bad:
    - name: 用红绿标签代替涨跌数字颜色
      reason: 标签不应替代金融红涨绿跌语义。

