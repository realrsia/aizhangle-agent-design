slots:
  mask:
    description: Action Sheet 背景遮罩，按弹窗类型和主题选择 `action-sheet.mask` 的真实 variant。
    required: true
    componentFamily: action-sheet.mask
    selectionRule: GUI阅读型使用 reading mask；GUI任务型、LUI对话型和 Dialog 弹窗使用 regular full modal mask。
  surface:
    description: 弹窗主体容器。
    required: true
  title:
    description: Action Sheet 标题区，使用 `action-sheet.title-area` 的真实 library instance。
    editable: true
    componentFamily: action-sheet.title-area
    textProperty: "Text#13085:0"
    variantSelectionRule: >
      先按主组件类型选择标题区类型，再按用户描述选择样式。
      主组件 LUI对话型 对应标题区 LUI阅读型；主组件 Dialog弹窗 对应标题区 Dialog弹层。
    mainVariantMapping:
      action-sheet-main-dialog-decorated: action-sheet-title-dialog-title
      action-sheet-main-dialog-plain: action-sheet-title-dialog-title-close
      action-sheet-main-lui-source: action-sheet-title-lui-title-close
      action-sheet-main-gui-task-decorated: action-sheet-title-gui-task-title-close
      action-sheet-main-gui-task-plain: action-sheet-title-gui-task-title-close
      action-sheet-main-gui-reading: action-sheet-title-gui-reading-title-close
    styleOptions:
      - 标题
      - 标题+关闭
      - 编辑+标题+关闭
      - 关闭
      - 左标题+关闭
    legacyInstanceNote: GUI任务型+装饰 当前主组件里仍有一个旧 `标题` component set 实例，语义等价于 `Action sheet/标题 Area` 的 GUI任务型/标题+关闭。
  body:
    description: 正文、说明、协议、来源、选择控件、确认信息或输入控件，使用 `action-sheet.content-area` 的真实 library instance。
    editable: true
    componentFamily: action-sheet.content-area
    variantSelectionRule: >
      先按主组件类型选择内容区类型，再按用户描述选择具体样式。
      Dialog弹窗 对应内容区 Dialog弹层；LUI对话型 对应内容区 LUI对话型。
    mainVariantMapping:
      action-sheet-main-dialog-decorated: action-sheet-content-dialog-upgrade-text
      action-sheet-main-dialog-plain: action-sheet-content-dialog-upgrade-text
      action-sheet-main-lui-source: action-sheet-content-lui-source
      action-sheet-main-gui-task-decorated: action-sheet-content-gui-task-body-sections
      action-sheet-main-gui-task-plain: action-sheet-content-gui-task-confirm-list
      action-sheet-main-gui-reading: action-sheet-content-gui-reading-product-list
    highRiskStyles:
      - 条件单确认
      - 协议签署
      - 输入数值
      - 输入范围
    legacyInstanceNote: GUI任务型+装饰 当前主组件里仍有一个旧 `内容区` component set 实例，语义等价于 `Action sheet/内容 Area` 的 GUI任务型/正文分段。
  decoration:
    description: IP 装饰或品牌视觉元素。
    editable: true
    controlledByVariantProperty: 装饰区
    componentFamily: action-sheet.decoration
    requiredWhen:
      - action-sheet-main-gui-task-decorated
      - action-sheet-main-dialog-decorated
    variantMapping:
      action-sheet-main-gui-task-decorated: action-sheet-decoration-gui-task
      action-sheet-main-dialog-decorated: action-sheet-decoration-dialog
    removalFallbacks:
      action-sheet-main-gui-task-decorated: action-sheet-main-gui-task-plain
      action-sheet-main-dialog-decorated: action-sheet-main-dialog-plain
    imageRequiredForDecoratedVariant: true
    removalRule: 删除装饰性 IP 图像后，必须回退到对应的非装饰主组件 variant。
  actions:
    description: 主操作、取消操作、同意、稍后处理或确认按钮。
    required: true
    componentFamily: action-sheet.button-area
    variantSelectionRule: >
      先按主组件类型选择按钮区类型，再按用户描述选择按钮样式。
      GUI任务型 对应按钮区 任务型；GUI阅读型 对应按钮区 阅读型；Dialog弹窗 对应按钮区 Dialog弹层。
      LUI对话型默认不带按钮区，除非设计明确指定。
    mainVariantMapping:
      action-sheet-main-dialog-decorated: action-sheet-button-dialog-primary
      action-sheet-main-dialog-plain: action-sheet-button-dialog-primary
      action-sheet-main-gui-task-decorated: action-sheet-button-task-outline-primary
      action-sheet-main-gui-task-plain: action-sheet-button-task-primary
      action-sheet-main-lui-source: no_button_by_default
      action-sheet-main-gui-reading: no_button_by_default
    highRiskPreferredStyles:
      - 描边按钮+基础按钮
      - 基础按钮
    lowRiskOnlyStyles:
      - 文字按钮+文字按钮
      - 基础按钮+文字按钮
    legacyInstanceNote: GUI任务型+装饰 当前主组件里仍有一个旧 `按钮` component set 实例，语义等价于 `Action sheet/按钮 Area` 的 任务型/描边按钮+基础按钮。
  close:
    description: 关闭入口。
    required: conditional_by_variant_and_risk
    rule: >
      关闭入口按 Action Sheet 类型和业务风险决定，不是全局必选。GUI阅读型、GUI任务型、
      GUI任务型+装饰、LUI对话型、Dialog弹窗这 5 类默认可带关闭入口；Dialog弹窗+装饰
      在强制升级 APP 场景中不提供关闭入口，用户必须通过主操作继续。
    requiredWhen:
      - ordinary_reading_or_task_sheet_allows_dismiss
      - ai_source_or_explanation_can_return_to_context
      - non_forced_version_notice
    forbiddenWhen:
      - forced_app_upgrade_dialog_decorated
      - agreement_or_permission_flow_where_close_would_skip_required_consent
      - high_risk_trading_flow_where_close_would_hide_required_decision
    variantDefaults:
      action-sheet-main-gui-reading: close_allowed
      action-sheet-main-gui-task-plain: close_allowed
      action-sheet-main-gui-task-decorated: close_allowed
      action-sheet-main-lui-source: close_allowed
      action-sheet-main-dialog-plain: close_allowed
      action-sheet-main-dialog-decorated: close_forbidden_when_forced_upgrade
    figmaFacts:
      titleAreaSupportsCloseStyles:
        - 关闭
        - 标题+关闭
        - 编辑+标题+关闭
        - 左标题+关闭

