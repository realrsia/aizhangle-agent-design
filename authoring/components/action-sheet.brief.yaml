        - Dialog弹层用于版本升级说明、协议正文、单/多段文字，以及条件单区间百分比或额度输入。
      dont:
        - 不要把内容区 variant 当作独立弹窗主体。
        - 不要把高风险订单确认、协议签署或输入范围降级为普通提示话术。
