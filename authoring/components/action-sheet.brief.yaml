        - GUI任务型、GUI任务型+装饰、LUI对话型、Dialog弹窗、Dialog弹窗+装饰使用完整遮罩弹窗上下文。
      dont:
        - 不要把交易确认、协议同意或 AI 免责声明降级为普通提示。
        - 不要因为需要白版而复制一套新的 Action Sheet 母组件或手动改色。
    riskWarnings:
