# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: action-sheet-real-component-not-demo
    severity: P0
    question: 是否把页面截图、demo frame、prototype frame 或使用案例误当成真实组件？
    passCriteria: 真实 component set / variant 进入 componentFamilies 和 variant rules；示例 frame 只能进入 usageInstanceGroups。
  - id: action-sheet-usage-example-not-component-definition
    severity: P0
    question: 使用案例 frame 是否只作为生成参考，而没有被误登记成母组件或真实变体？
    passCriteria: 行情速览浮层、持仓列表操作弹层、AI 结果说明、输入任务和撤买确认等页面样例只能进入 usageInstanceGroups；只有真实 Figma component set / variant 才能进入组件定义区。
  - id: action-sheet-figma-binding-verified
    severity: P0
    question: 是否已记录真实 nodeId、componentKey、figmaExactName 和 variant property？
    passCriteria: Figma-backed 组件必须使用 library instance；缺失绑定时停止并重新选择 Figma 对象。
  - id: action-sheet-mask-present
    severity: P1
    question: 弹窗是否在正文上方，并在下一层使用黑色半透明蒙层？
    passCriteria: Action Sheet 出现时正文被蒙层压暗，弹窗正文和操作按钮位于蒙层上方。
  - id: action-sheet-mask-type-matches-action-sheet-variant
    severity: P1
    question: Action Sheet 遮罩类型是否与弹窗类型匹配？
    passCriteria: GUI阅读型必须使用 reading mask；GUI任务型、LUI对话型和 Dialog 弹窗必须使用 regular full modal mask，并按页面主题选择黑版或浅色版。
  - id: action-sheet-title-area-matches-main-variant
    severity: P1
    question: Action Sheet 标题区类型和样式是否匹配主组件 variant？
    passCriteria: 主组件 GUI任务型/GUI阅读型 直接匹配同名标题区类型；LUI对话型匹配标题区 LUI阅读型；Dialog弹窗匹配标题区 Dialog弹层，并按描述选择标题、关闭或编辑入口样式。
  - id: action-sheet-content-area-matches-main-variant
    severity: P1
    question: Action Sheet 内容区类型和样式是否匹配主组件 variant 与业务描述？
    passCriteria: 主组件 GUI任务型、GUI阅读型、LUI对话型、Dialog弹窗必须选择对应内容区类型；协议签署、条件单确认、输入数值和输入范围不得被普通提示话术替代。
  - id: action-sheet-button-area-matches-main-variant
    severity: P1
    question: Action Sheet 按钮区类型和样式是否匹配主组件 variant 与业务风险？
    passCriteria: GUI任务型使用任务型按钮区，GUI阅读型使用阅读型按钮区，Dialog弹窗使用 Dialog弹层按钮区；高风险确认不得使用纯文字按钮组合替代明确主按钮。
  - id: action-sheet-decoration-slot-matches-variant
    severity: P1
    question: 带装饰 Action Sheet 的装饰槽位是否匹配对应装饰区 variant？
    passCriteria: GUI任务型+装饰必须使用 GUI任务型装饰区；Dialog弹窗+装饰必须使用 Dialog弹层装饰区；删除 IP 图像后必须回退到对应非装饰 variant。
  - id: action-sheet-risk-level-matches-family
    severity: P0
    question: 弹窗 family 是否匹配业务风险？
    passCriteria: 交易、资金、权限、协议、AI 免责声明和重大更新不得使用普通提示 family。
  - id: action-sheet-explicit-confirmation-for-high-risk
    severity: P0
    question: 高风险弹窗是否要求用户明确确认？
    passCriteria: 高风险场景必须有明确主操作和必要的取消 / 返回路径，不允许自动关闭替代确认。
  - id: action-sheet-ai-source-disclosure-clear
    severity: P1
    question: AI 来源、数据索引或免责声明弹窗是否说明来源和限制？
    passCriteria: AI 相关弹窗必须保留来源、限制或免责声明，不得制造确定性错觉。
  - id: action-sheet-h5-usage-confirmed
    severity: P2
    question: H5 弹窗是否来自已确认的 H5 变体或视觉等价规则？
    passCriteria: H5 不能默认复用 APP 原生弹窗；需要真实变体或明确标记为视觉参考。

