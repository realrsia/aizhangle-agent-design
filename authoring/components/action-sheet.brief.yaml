    forbiddenZones:
      - action_sheet_body_text
      - action_sheet_button_area
      - action_sheet_mask_layer
      - non_decorated_action_sheet_variant
    humanRules:
      do:
        - 作为 Action Sheet 带装饰区变体内部的装饰槽位使用。
        - "类型=GUI任务型 填充到 GUI任务型+装饰 的装饰区位置。"
        - "类型=Dialog弹层 填充到 Dialog弹窗+装饰 的装饰区位置。"
        - 有装饰区时，IP 图像必须按 Figma 组件尺寸填充在装饰槽位中。
        - 如果用户删除装饰性 IP 图像，语义上应从带装饰 variant 回退到对应非装饰 variant。
      dont:
        - 不要把装饰区当成独立弹窗母组件。
        - 不要把装饰图像放进正文、按钮区或遮罩层。
        - "不要在装饰图像被删除后继续使用 装饰区=true 的主组件变体。"
    riskWarnings:
      - id: action-sheet-decoration-slot-semantic-toggle
        severity: P1
        rule: 装饰图像存在与否决定是否使用带装饰 Action Sheet 变体；删除装饰图像后必须回退到非装饰变体。


