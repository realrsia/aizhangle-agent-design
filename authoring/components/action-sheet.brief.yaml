# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.action-sheet
name: Action Sheet 弹窗
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐 / AI 涨乐中的模态弹窗与需要用户停下来阅读、确认或操作的
  浮层内容。Action Sheet 覆盖普通提示、风险提示、交易确认、AI 免责声明、
  权限确认、操作确认、阅读型弹窗、Action Sheet、协议确认、AI Chat 来源展开、
  版本发现和重大更新说明等场景。当前这类弹窗统一使用黑色半透明蒙层，
  通过模态层级突出正文和弹窗内容。

# [HUMAN REQUIRED]
usedIn:
  - ordinary-notice
  - risk-warning
  - trading-confirmation
  - ai-disclosure
  - permission-confirmation
  - operation-confirmation
  - stock-list-reading-dialog
  - action-sheet
  - gui-task-dialog
  - agreement-ip-dialog
  - ai-chat-source-dialog
  - app-version-dialog
  - major-update-ip-dialog

# [HUMAN REQUIRED]
humanRules:
  do:
    - 所有本 brief 覆盖的 Action Sheet 都按模态弹窗处理，出现时必须有黑色半透明蒙层。
    - 先按业务风险选择 family，再选择真实 Figma component set 或 variant。
    - 普通提示和强风险提示必须分开；交易、资金、账户、权限、协议、AI 内容免责声明必须按高风险或合规敏感场景审查。
    - 需要用户明确同意、确认交易、确认权限、确认协议或理解 AI 内容来源时，必须保留明确操作按钮。
    - 允许关闭、自动消失或只读展示之前，必须确认该 family 的风险边界。
    - H5 只能使用已确认支持 H5 的真实变体或视觉等价规则，不要默认复用 APP 原生弹窗。
  dont:
    - 不要把页面截图、demo frame、prototype frame 或使用案例当成真实组件定义。
    - 不要把真实 component set / component variant 写进 usageInstanceGroups。
    - 不要用普通提示弹窗承载交易确认、资金风险、权限授权、协议同意或 AI 免责声明。
    - 不要在高风险确认里隐藏取消路径、弱化风险文案或允许无确认自动关闭。
    - 不要手工拼装 lookalike frame 代替 Figma library instance。

# [HUMAN REQUIRED]
riskWarnings:
  - id: modal-interrupts-flow
    severity: P1
    rule: Action Sheet 会打断用户当前流程，必须确认打断是必要的。
  - id: trading-and-fund-confirmation
    severity: P0
    rule: 涉及交易、资金、账户权限或撤销类操作时，必须明确风险文案、主次按钮和确认路径。
  - id: agreement-and-permission-consent
    severity: P0
    rule: 涉及协议同意、授权或权限确认时，不得用普通关闭代替用户明确同意。
  - id: ai-content-disclosure
    severity: P1
    rule: AI 内容免责声明、结论来源展开和数据索引说明必须清楚表达来源、限制和可追溯性。
  - id: mask-and-layering
    severity: P1
    rule: 本类弹窗必须在正文上方、蒙层上方展示，蒙层不得盖住弹窗正文或操作按钮。

# [HUMAN REQUIRED]
layoutContract:
  modality:
    type: modal
    rule: 当前 Action Sheet 类弹窗均为模态弹窗。
  mask:
    required: true
    colorIntent: black-translucent
    rule: 弹窗 z-index 下方一层必须加入黑色半透明蒙层，以突出正文与弹窗内容对比。
  zIndex:
    semanticLayer: modal-overlay-layer
    allowedAbove:
      - system_permission_dialog_when_native
      - system_keyboard_when_dialog_contains_input
    forbiddenAbove:
      - scroll_content_body
      - chart_layer
      - list_content
      - ordinary_card
      - page_demo_frame
  dismissal:
    rule: 是否允许关闭、点蒙层关闭或自动消失必须由 family / variant 的人工规则决定。
    defaultForHighRisk: explicit_user_action_required

# [HUMAN REQUIRED]
allowedZones:
  - mobile_modal_layer
  - app_dialog_layer
  - action_sheet_layer
  - ai_chat_modal_layer
  - h5_modal_layer_when_confirmed

# [HUMAN REQUIRED]
forbiddenZones:
  - scroll_content_body
  - ordinary_card_footer
  - list_row_action_area
  - tab_navigation_area
  - bottom_bar_control_row
  - ai_chat_message_body_inline

# [HUMAN REQUIRED]
requiredPairings:
  - modal-mask
  - trigger-context
  - dismiss-or-confirm-action
  - risk-copy-when-needed
  - figma-library-instance

# [HUMAN REQUIRED]
forbiddenPairings:
  - lookalike-manual-frame
  - high-risk-without-explicit-confirmation
  - agreement-without-consent-action
  - ai-disclosure-without-source-context
  - trading-confirmation-without-selected-security

# [HUMAN REQUIRED]
examples:
  good: []
  needsReview:
    - name: AI Chat 结论数据索引展开来源
      reason: 需要确认它是真实 component set、instance，还是页面中的使用案例。
    - name: Action Sheet 弹窗
      reason: 需要确认 Figma 中是否为独立 component set；若只是页面 frame，则只能作为 usage instance。
  bad:
    - name: 用普通提示弹窗承载交易确认
      reason: 交易确认属于高风险操作，必须使用对应 family 和明确确认规则。
    - name: 把页面 demo frame 写成 Action Sheet 母组件
      reason: demo frame 只能作为使用案例，不能作为组件定义或绑定来源。

