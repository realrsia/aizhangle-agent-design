      do:
        - 作为通用居中模态弹窗或主 Action Sheet family 使用。
        - 普通提示、风险提示、确认类弹窗必须按真实 variant property 选择。
        - 这组 Action Sheet 只维护黑版组件；白版通过主题切换 Toggle 调整，不新增独立白版 variant。
        - 六个组件与画布上方标签一一对应：GUI阅读型、GUI任务型、GUI任务型+装饰、LUI对话型、Dialog弹窗、Dialog弹窗+装饰。
