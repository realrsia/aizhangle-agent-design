# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.chat-background
name: 对话页背景
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 AI 对话页的一屏和长页面背景。生成页面时应优先使用设计仓库/2.2 页面背景
  中的背景/背景组件实例或变量，尤其是带蓝白渐变与斜向光线的平铺背景，
  不要用首页卡片背景、近似纯色块或普通卡片 surface 重画。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 根据页面主题选择已确认的对话页背景变体；当前新设计仓库已确认 light 对话背景。
    - 根据页面高度选择一屏或长页面背景策略；长回答页背景必须覆盖滚动内容露出的页面底层。
    - 背景应位于页面底层，不遮挡 topbar、message_feed、bottom_input。
    - 必须优先使用 设计仓库/2.2 页面背景/对话-白版/背景/背景。
  dont:
    - 不要用手写色值或普通矩形替代设计仓库背景组件。
    - 不要把背景放入 message_feed 滚动内容。
    - 不要把页面截图背景当成可复用组件。
    - 不要用首页卡片背景、普通卡片 surface、手写纯色矩形替代。

# [HUMAN REQUIRED]
riskWarnings:
  - 背景不使用正式组件或变量时，黑版/白版还原会出现明显色差。
  - 长页面如果误用 1屏背景，滚动内容下半段可能露出错误底色。
  - 如果误绑定首页卡片背景，AI chat 会失去顶部光线照下来的对话页空间感。

# [HUMAN REQUIRED]
componentFamilies:
  - id: chat-background.ai-chat-light
    figmaNodeId: "400:25043"
    figmaExactName: 背景/背景
    sourceFrameNodeId: "400:25042"
    sourceFrameName: 对话-白版
    sourceSectionNodeId: "400:24983"
    sourceSectionName: 2.2 页面背景
    mainComponentNodeId: "99:41960"
    componentKey: TODO_VERIFY_WITH_FIGMA
    variantProperties:
      Dark: "Off"
      背景类型: 新版工作区/一级
    familyType: component_instance
    humanUse: ai_chat_light_page_background_with_light_beams
    visualSignature: 蓝白渐变、顶部斜向光线、浅色长页面底色。
  - id: chat-background.ai-chat-dark
    figmaNodeId: TODO_VERIFY_WITH_FIGMA
    figmaExactName: TODO_VERIFY_WITH_FIGMA
    componentKey: TODO_VERIFY_WITH_FIGMA
    variantProperties:
      Dark: "On"
    familyType: pending_component_instance
    humanUse: ai_chat_dark_page_background_pending

# [HUMAN REQUIRED]
allowedZones:
  - page_background
  - app_shell_background
  - ai_chat_page_root

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - chat_topbar
  - bottom_input
  - content_card
  - home_card

# [HUMAN REQUIRED]
requiredPairings:
  - chat-topbar
  - message-feed
  - chat-input

# [HUMAN REQUIRED]
forbiddenPairings:
  - ordinary_card_background
  - home_card_background
  - screenshot_background
  - hand_drawn_solid_rect

# [HUMAN REQUIRED]
examples:
  good:
    - name: AI 对话页黑版长页面背景
      reason: 使用设计仓库背景组件或变量，不用手写色块。
  bad:
    - name: 用普通矩形重画背景
      reason: 无法保证 dark/light 和长页面背景一致。
    - name: 用首页卡片背景作为 AI chat 页面背景
      reason: 对话流需要光线平铺背景，首页卡片背景会导致页面空间层级错误。

