# [HUMAN REQUIRED]
allowedZones:
  - page_background
  - app_shell_background
  - ai_chat_page_root

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - chat_topbar
  - bottom_input
  - content_card
  - home_card

# [HUMAN REQUIRED]
requiredPairings:
  - chat-topbar
  - message-feed
  - chat-input

# [HUMAN REQUIRED]
forbiddenPairings:
  - ordinary_card_background
  - home_card_background
  - screenshot_background
  - hand_drawn_solid_rect

# [HUMAN REQUIRED]
examples:
  good:
    - name: AI 对话页黑版长页面背景
      reason: 使用设计仓库背景组件或变量，不用手写色块。
  bad:
    - name: 用普通矩形重画背景
      reason: 无法保证 dark/light 和长页面背景一致。
    - name: 用首页卡片背景作为 AI chat 页面背景
      reason: 对话流需要光线平铺背景，首页卡片背景会导致页面空间层级错误。

