# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: chat-background-uses-library
    severity: P0
    question: 页面背景是否使用设计仓库背景组件或变量，而不是手写色块？
    passCriteria: 背景来源可追溯到 设计仓库/元素组件/背景。
  - id: chat-background-theme-match
    severity: P0
    question: 黑版/白版是否使用正确 dark 变体？
    passCriteria: 黑版使用 dark=on，白版使用 dark=off。
  - id: chat-background-height-match
    severity: P1
    question: 长页面是否使用全屏背景变体？
    passCriteria: 长回答页、表格页等内容高度超过一屏时不使用 1屏 背景。

agentExpansion:
