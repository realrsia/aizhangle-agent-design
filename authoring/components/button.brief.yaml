# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.button
name: 普通按钮
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐移动端中的普通操作入口，例如确认、提交、跳转、查看详情、
  辅助操作等。普通按钮不承载买入、卖出、撤单、删除等高风险动作。

# [HUMAN REQUIRED]
usedIn:
  - generic-form-action
  - secondary-page-action
  - filter-confirmation
  - navigation-action

# [HUMAN REQUIRED]
humanRules:
  do:
    - 按钮必须先按业务语义选择动作类型，再选择视觉类型、尺寸、结构和状态。
    - 普通按钮可使用 primary、assist、outline、text、link、ghost-outline、ghost-text 等视觉类型。
    - 禁用状态必须表达不可操作，不应只依赖文案解释。
  dont:
    - 不要用普通按钮规则决定买入、卖出、撤单等交易行动点。
    - 不要把 destructive 操作当成普通 primary 按钮处理。
    - 不要在一个页面区域内堆叠多个同等强度主按钮。

# [HUMAN REQUIRED]
riskWarnings:
  - 普通按钮可用于低/中风险动作；涉及资金、交易、撤销、删除时必须改用高风险组件或另建 brief。

# [HUMAN REQUIRED]
allowedZones:
  - generic_card_action_area
  - form_footer
  - filter_sheet_footer
  - list_secondary_action

# [HUMAN REQUIRED]
forbiddenZones:
  - trading_order_submit_area
  - order_cancel_confirmation
  - ai_chat_direct_trading_action

# [HUMAN REQUIRED]
requiredPairings:
  - action-context

# [HUMAN REQUIRED]
forbiddenPairings:
  - buy-sell-trading-action
  - destructive-without-confirmation

# [HUMAN REQUIRED]
examples:
  good:
    - name: button-system-matrix
      reason: 按钮类型、尺寸、结构和状态矩阵完整；以 canon 和 Figma component binding 为准，不依赖本地截图。
  needsReview: []
  bad:
    - name: 用普通主按钮承载买入
      reason: 买入属于交易行动点，不能用普通按钮规则决定颜色和风险边界。

