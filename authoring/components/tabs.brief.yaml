# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.tabs
name: 标签页
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于同级内容或视图之间切换，以明确当前选中项和可切换范围。

# [HUMAN REQUIRED]
usedIn:
  - detail-view-switch
  - market-module-switch
  - account-section-switch

# [HUMAN REQUIRED]
humanRules:
  do:
    - 选中态文字、下划线、胶囊或指示器使用主红。
    - 未选中态文字使用已批准文本 token。
  dont:
    - 不要把主红用于未选中装饰元素。

# [HUMAN REQUIRED]
riskWarnings:
  - 错误选中态会误导用户当前内容范围。

# [HUMAN REQUIRED]
allowedZones:
  - content_section_header
  - page_subnav_area

# [HUMAN REQUIRED]
forbiddenZones:
  - bottom_navigation_item
  - trading_submit_area

# [HUMAN REQUIRED]
requiredPairings:
  - sibling-content-panels

# [HUMAN REQUIRED]
forbiddenPairings:
  - unrelated-action-group

# [HUMAN REQUIRED]
examples:
  good: []
  needsReview: []
  bad:
    - name: 未选中项使用红色装饰
      reason: 红色应表达选中态，不应用作非激活装饰。

# ============================================================
# 02_AGENT_EXTRACTED
# Agent 自动读取区
# ============================================================

figma:
  fileName: TODO_VERIFY_WITH_FIGMA
  fileKey: TODO_VERIFY_WITH_FIGMA
  exampleNodeId: TODO_VERIFY_WITH_FIGMA
  figmaExactName: TODO_VERIFY_WITH_FIGMA
