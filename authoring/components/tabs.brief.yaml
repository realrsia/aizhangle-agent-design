    required: true
  - id: inactive
    required: true
  - id: disabled
    required: false

slots:
  tab:
    description: 单个切换项。
  indicator:
    description: 选中态指示器。

tokens:
  source:
    - assets/tokens/token-mapping.json

textOverrideFields:
  - TODO_VERIFY_WITH_FIGMA

resourceRefs:
  - references/foundation/components-tabs.md

# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: active-tab-red
    severity: P1
    question: 选中态是否使用主红？
    passCriteria: active text、underline、pill 或 indicator 使用 xzl/color/primary/red。
  - id: inactive-token-valid
    severity: P2
    question: 未选中态文字是否使用已批准文本 token？
    passCriteria: inactive 文本不使用任意灰或红色装饰。

agentExpansion:
  canonComponent:
    path: canon/components/tabs.meta.yaml
  checklist:
    path: canon/checklists/tabs-review.yaml
  figmaBinding:
    path: bindings/figma/components.yaml
  docs:
    path: docs/generated/components/index.md
  assetManifest:
    path: bindings/assets/manifest.yaml
