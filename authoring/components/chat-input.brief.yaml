# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.chat-input
name: 对话输入栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 AI 对话页底部输入与语音/键盘模式切换，是 full-screen conversation
  的固定底部交互入口。正式组件来源优先使用设计仓库/对话流中的
  1月版/母组件，对话页需要完整 composer 时使用包含 Agent 助手胶囊的版本。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 保持输入栏固定在 full-screen conversation frame 底部。
    - 优先复用设计仓库/对话流/对话-白版中的 1月版/母组件，不用普通输入框替代。
    - 完整对话页优先使用包含输入胶囊、Agent 助手胶囊、AI 生成提示和 home indicator 的底部 composer。
    - 简化语音输入状态可参考单独的 1月版/母组件 简化节点。
  dont:
    - 不要把对话输入栏放进滚动消息内容。
    - 不要用普通表单输入框替代底部 composer。
    - 不要移除安全区或底部 AI 生成提示。

# [HUMAN REQUIRED]
riskWarnings:
  - 输入栏承载继续对话动作，结构错位会直接影响页面还原可信度。

# [HUMAN REQUIRED]
allowedZones:
  - bottom_input
  - chat_page_composer
  - assistant_footer

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - ordinary_card_footer
  - reasoning_panel

# [HUMAN REQUIRED]
requiredPairings:
  - component.bottom-bar
  - safe-area
  - component.chat-topbar

# [HUMAN REQUIRED]
forbiddenPairings:
  - generic-form-input
  - generic-bottom-navigation

# [HUMAN REQUIRED]
componentFamilies:
  - id: chat-input.dialog-bottom-bar
    figmaNodeId: "400:25177"
    canonicalName: bottom bar/母组件
    sourceFigmaExactName: 1月版/母组件
    sourceNameStatus: repository_component_confirmed
    sourceInstanceRole: dialog_page_bottom_bar_instance
    familyType: component_set_instance
    humanUse: ai_chat_full_composer_with_agent_chips
    humanRules:
      - 用作对话页底部输入栏，不作为普通底部导航。
      - 保留输入胶囊、Agent 助手胶囊、AI 生成提示和 home indicator。
  - id: chat-input.repository-bottom-bar
    figmaNodeId: "400:29333"
    figmaExactName: 1月版/母组件
    familyType: component_instance
    humanUse: ai_chat_simple_voice_composer_reference
    humanRules:
      - 仅作为简化语音输入栏状态参考，不覆盖完整对话页底部 composer。

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "400:25177"
      reason: 对话白版中的完整底部 composer，包含输入胶囊、Agent 助手胶囊、AI 生成提示和 home indicator。
    - figmaNodeId: "400:29333"
      reason: 简化语音输入状态，可作为仅包含输入胶囊和左右动作按钮的参考。
  needsReview:
    - name: 黑版完整 composer
      reason: 当前新设计仓库已确认白版完整 composer；黑版需要继续按 Figma 节点确认。
    - name: 输入栏状态枚举
      reason: 语音、键盘、打断、上划、关联问等状态还需继续按 Figma 节点验证。
  bad: []

