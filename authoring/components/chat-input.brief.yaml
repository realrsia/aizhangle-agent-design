# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.chat-input
name: 对话输入栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 AI 对话页底部输入与语音/键盘模式切换，是 full-screen conversation
  的固定底部交互入口。正式组件来源优先使用设计仓库 bottom bar 的对话变体。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 保持输入栏固定在 full-screen conversation frame 底部。
    - 优先复用底bar对话态，不用普通输入框替代。
    - 今天先覆盖默认对话态的 Dark=On 和 Dark=Off；语音、键盘、打断、上划、关联问等状态继续按 Figma 节点验证。
  dont:
    - 不要把对话输入栏放进滚动消息内容。
    - 不要用普通表单输入框替代底部 composer。
    - 不要移除安全区或底部 AI 生成提示。

# [HUMAN REQUIRED]
riskWarnings:
  - 输入栏承载继续对话动作，结构错位会直接影响页面还原可信度。

# [HUMAN REQUIRED]
allowedZones:
  - bottom_input
  - chat_page_composer
  - assistant_footer

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - ordinary_card_footer
  - reasoning_panel

# [HUMAN REQUIRED]
requiredPairings:
  - component.bottom-bar
  - safe-area
  - component.chat-topbar

# [HUMAN REQUIRED]
forbiddenPairings:
  - generic-form-input
  - generic-bottom-navigation

# [HUMAN REQUIRED]
componentFamilies:
  - id: chat-input.dialog-bottom-bar
    figmaNodeId: "5509:131783"
    canonicalName: bottom bar/母组件
    sourceFigmaExactName: 1月版/母组件
    sourceNameStatus: legacy_name_in_figma_needs_rename
    sourceInstanceRole: dialog_page_bottom_bar_instance
    familyType: component_set_instance
    humanUse: draft_page_instance_of_dialog_bottom_bar
    humanRules:
      - 用作对话页底部输入栏，不作为普通底部导航。
  - id: chat-input.repository-bottom-bar
    figmaNodeId: "12:10172"
    figmaExactName: bottom bar/母组件
    familyType: component_set
    humanUse: draft_formal_component_source
    humanRules:
      - 使用设计仓库中的 bottom bar 组件集作为对话输入栏正式绑定来源。
      - 对话黑版优先绑定 场景=对话, Dark=On 变体；白版优先绑定 场景=对话, Dark=Off 变体。

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "5509:131783"
      reason: 对话黑版中的底部输入栏实例，应对应设计仓库 bottom bar/母组件的对话 Dark=On 变体。
    - figmaNodeId: "5829:15841"
      reason: 对话白版中的底部输入栏实例，应对应设计仓库 bottom bar/母组件的对话 Dark=Off 变体。
    - figmaNodeId: "5509:132713"
      reason: 开启新对话白版中的底部输入栏实例，用于状态页参考。
    - figmaNodeId: "12:10180"
      reason: 设计仓库 bottom bar/母组件中的对话 Dark=On 变体。
    - figmaNodeId: "12:10189"
      reason: 设计仓库 bottom bar/母组件中的对话 Dark=Off 变体。
  needsReview:
    - name: 输入栏状态枚举
      reason: 今天先覆盖默认对话态深浅色；其他状态继续按 Figma 节点验证。
  bad: []

