# ============================================================
# 03_AGENT_EXPANSION_AND_CHECKLIST
# Agent 扩展与自查区
# ============================================================

reviewChecklist:
  - id: chat-input-fixed-bottom
    severity: P0
    question: 对话输入栏是否固定在 frame 底部，并位于滚动内容之上？
    passCriteria: 输入栏不随 message_feed 滚动，内容区预留底部空间。
  - id: chat-input-uses-dialog-bottom-bar
    severity: P0
    question: 是否复用了对话态底bar结构，而不是普通输入框或通用底部导航？
    passCriteria: 场景为对话，结构包含输入行、agent row 和安全区。
  - id: chat-input-state-declared
    severity: P1
    question: 是否声明语音/键盘/默认/打断等状态？
    passCriteria: 状态来自 Figma；未确认状态必须进入 pendingFigmaVerification。

