# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.trading-action-button
name: 交易行动点按钮
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于交易相关页面中的高权重行动入口，承载买入、卖出、撤单等强操作。
  该组件不是普通按钮，而是金融交易行为的行动点，需要严格控制使用场景、
  视觉权重、文案和风险提示，避免误触或误导用户。

# [HUMAN REQUIRED]
usedIn:
  - trading-order
  - stock-quote-detail
  - holdings
  - order-cancel-flow

# [HUMAN REQUIRED]
humanRules:
  do:
    - 交易行动点只用于明确的交易行为入口。
    - 买入和卖出并列时，两者视觉权重应保持一致。
    - 高风险操作必须配合二次确认或风险提示。
    - 禁用状态必须清楚表达不可操作原因。
  dont:
    - 不要把买入、卖出、撤单当成普通按钮处理。
    - 不要在 AI 对话中直接给出强交易行动按钮。
    - 不要在行情总览页中把交易按钮作为主要内容。
    - 不要在金融列表行内使用大尺寸交易行动点。

# [HUMAN REQUIRED]
riskWarnings:
  - id: trading-action-high-risk
    severity: P0
    rule: 交易行动点涉及资金和交易决策，必须避免误触、误导和错误状态。
  - id: destructive-or-cancel-action
    severity: P0
    rule: 撤单、删除、取消委托等操作必须配套二次确认。

# [HUMAN REQUIRED]
allowedZones:
  - stock_quote_bottom_action
  - trading_order_footer
  - order_entry_action_area

# [HUMAN REQUIRED]
forbiddenZones:
  - market_overview_primary_body
  - watchlist_row_inline
  - ai_chat_message_body
  - generic_card_action_area

# [HUMAN REQUIRED]
requiredPairings:
  - trading-context
  - selected-security
  - account-state-check
  - risk-check-when-needed

# [HUMAN REQUIRED]
forbiddenPairings:
  - decorative-ai-card
  - generic-dashboard-card
  - marketing-hero-section
  - tag-wall

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "24876:176203"
      name: 交易行动点按钮 / 双按钮买卖
      reason: 个股或交易相关上下文中的买卖操作入口。
  needsReview:
    - name: 行情总览页中的买卖按钮
      reason: 可能抢占市场扫描内容，不建议作为主内容。
  bad:
    - name: AI 对话气泡内直接出现买入按钮
      reason: 缺少交易上下文和合规确认流程。

