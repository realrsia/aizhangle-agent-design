# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.overlay
name: 浮层
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于移动端上下文内的底部弹层、半浮层、居中确认框、popover 和下拉面板。
  浮层应保留页面上下文并支持快速金融操作。

# [HUMAN REQUIRED]
usedIn:
  - bottom-sheet
  - confirmation-dialog
  - dropdown-panel
  - semi-floating-panel

# [HUMAN REQUIRED]
humanRules:
  do:
    - 按交互目的选择 bottom sheet、centered alert、popover 或 dropdown。
    - modal focus 需要使用 mask/default。
    - 输入浮层必须保持键盘、安全区和操作按钮可用。
  dont:
    - 不要使用 web-style dialog 替代移动端浮层模式。
    - 不要用重描边制造浮层层级。

# [HUMAN REQUIRED]
riskWarnings:
  - 确认、取消、交易相关浮层必须保持操作层级清晰。

# [HUMAN REQUIRED]
allowedZones:
  - mobile_overlay_layer
  - sheet_layer
  - popover_layer

# [HUMAN REQUIRED]
forbiddenZones:
  - scroll_content_as_card

# [HUMAN REQUIRED]
requiredPairings:
  - trigger-context
  - dismiss-or-confirm-action

# [HUMAN REQUIRED]
forbiddenPairings:
  - heavy-border-surface

# [HUMAN REQUIRED]
examples:
  good:
    - assetPath: assets/examples/overlays-popovers-sheets.png
      reason: 覆盖移动端浮层、popover 和 sheet 模式。
  needsReview: []
  bad:
    - name: 使用桌面网页弹窗样式
      reason: 新涨乐移动端应使用 native-like overlay pattern。

