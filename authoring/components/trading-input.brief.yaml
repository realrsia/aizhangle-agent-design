# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.trading-input
name: 交易输入框组件族
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于新涨乐交易表单中的代码输入、数字步进输入、下拉选择、
  数字步进输入加下拉选择和条件输入。它承载交易前置参数，不能简化为普通输入框。

# [HUMAN REQUIRED]
usedIn:
  - trading-order-form
  - order-condition-form
  - security-code-entry

# [HUMAN REQUIRED]
humanRules:
  do:
    - 先按结构分类，再套普通输入背景和圆角规则。
    - 所有交互图标必须是可见节点。
    - 交易表单内使用时同步加载交易表单布局规则。
  dont:
    - 不要把数字步进、下拉、条件输入简化成 generic input。
    - 不要用说明文字代替 minus、plus、dropdown、edit、delete 等图标节点。

# [HUMAN REQUIRED]
riskWarnings:
  - 交易参数输入错误会影响委托结果，必须保持结构、状态和图标清晰。

# [HUMAN REQUIRED]
allowedZones:
  - trading_order_form
  - condition_order_form

# [HUMAN REQUIRED]
forbiddenZones:
  - generic_search_bar
  - decorative_card_body

# [HUMAN REQUIRED]
requiredPairings:
  - trading-field-label
  - value-or-placeholder

# [HUMAN REQUIRED]
forbiddenPairings:
  - hidden-interactive-icon
  - generic-input-only

# [HUMAN REQUIRED]
examples:
  good:
    - name: trading-order-page-context
      reason: 交易输入结构与交易表单上下文完整；以 canon 和 Figma component binding 为准，不依赖本地截图。
  needsReview: []
  bad:
    - name: 用普通输入框替代数字步进输入
      reason: 缺少 minus、plus 等必需交互节点。

