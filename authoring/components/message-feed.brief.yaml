fallbackLayoutRules:
  appliesTo:
    - fallback / non-canonical / stock-recommendation-card
    - fallback / non-canonical / stock-trend-chart
    - answer-detail / recommendation-rationale
    - financial-risk-disclaimer
    - fallback / non-canonical / answer-body-light
  requiredStructure:
    - outerContainer.layoutMode must be VERTICAL when children stack vertically.
    - parent padding and itemSpacing must express visual spacing; do not rely on manual y coordinates for primary text flow.
    - multiline text uses fill-width on the horizontal axis and Hug Contents / auto-height on the vertical axis.
    - parent height must be at least text rendered height plus vertical padding and sibling gaps.
  forbiddenStructure:
    - textAutoResize=NONE for multiline explanatory copy.
    - fixed-height parent containers that remove bottom padding or make copy visually crowded.
    - tag or pill wrappers with near-zero width that depend on overflow visibility.
  longPageSpacingMinimums:
    chartToRecommendationRationale: 18
    recommendationRationaleToRiskDisclaimer: 14
    riskDisclaimerToRelatedQuestions: 16

wrapperTransparencyRules:
  appliesTo:
    - message-row / user-question
    - message-row / assistant-answer
    - layout wrappers around verified design-repository instances
  required:
    - wrapper nodes created only for Auto Layout must set fills: []
    - wrapper nodes created only for Auto Layout must set strokes: []
    - wrapper nodes created only for Auto Layout must set effects: []
    - verified component instances keep their own visual fills, strokes, effects, and variants; do not move the visual style to the wrapper.
  allowedVisibleWrappers:
    - fallback / non-canonical / stock-recommendation-card
    - fallback / non-canonical / stock-trend-chart
    - answer-detail / recommendation-rationale
    - financial-risk-disclaimer
    - fallback / non-canonical / answer-body-light
  validation:
