# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.message-feed
name: 对话消息流
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 AI 对话页中用户问题、智能体回答、思考链、正文、免责声明、
  辅助功能、关联问等内容的垂直消息流。消息流是页面唯一主要滚动区。
  当前结构来源切换到设计仓库/对话流/对话-白版中的消息内容堆栈。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 保持消息流作为唯一主要滚动区。
    - 按 shell、layout、block、item、content、action 层级组织。
    - 长回答先保证结构层级，再修视觉细节。
    - AI 头像、回答状态、正文、关联问优先使用设计仓库/对话流中已出现的实例或组件。
  dont:
    - 不要把 numbered Frame 或 Group 当作语义组件来源。
    - 不要把关联问、免责声明、辅助功能散落到页面根层。
    - 不要用通用卡片堆叠替代对话消息结构。
    - 不要原创 AI 头像、回答状态、关联问或思考链样式来替代未绑定组件。

# [HUMAN REQUIRED]
riskWarnings:
  - 消息流是对话页主体，层级错会导致页面看起来像普通内容页。
  - 思考过程已绑定设计仓库组件，生成时必须导入组件，不能当普通卡片随意重画。
  - 股票信息卡和 K 线图无正式组件时允许 fallback，但必须标清不是正式组件。
  - 指数、A股异动、资讯等行情内容若在回答中出现，应优先使用设计仓库业务内容组件，不要重画成普通卡片。
  - 设计仓库 3.3 底bar组件 section 未确认包含 AI 头像/回答状态正式组件；不能因此自行重画。

# [HUMAN REQUIRED]
allowedZones:
  - message_feed
  - conversation_stack
  - assistant_content_stack

# [HUMAN REQUIRED]
forbiddenZones:
  - topbar
  - bottom_input
  - bottom_dock

# [HUMAN REQUIRED]
requiredPairings:
  - component.chat-topbar
  - component.chat-input
  - scroll-container

# [HUMAN REQUIRED]
forbiddenPairings:
  - generic-card-grid
  - market-dashboard-module

