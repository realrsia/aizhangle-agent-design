reviewChecklist:
  - id: message-feed-is-scroll-zone
    severity: P0
    question: 消息流是否是页面唯一主要滚动区？
    passCriteria: topbar 和 bottom_input 固定，message_feed 承载滚动。
  - id: message-feed-preserves-chat-hierarchy
    severity: P0
    question: 是否保留 shell、layout、block、item、content、action 层级？
    passCriteria: 主要 block 命名清晰，不以 numbered Frame 作为语义源。
  - id: message-feed-fallback-declared
    severity: P0
    question: 股票卡、K线图等非已验证组件是否被声明为 fallback 或待确认？
    passCriteria: fallback 不被写成已验证组件实例。
  - id: message-feed-answer-body-light-fallback
    severity: P0
    question: 白版回答正文是否避免使用 Dark=On 正式组件？
    passCriteria: 设计仓库缺少 Dark=Off 正文组件时，白版正文使用 `fallback / non-canonical / answer-body-light`，并保持高保真排版；黑版仍使用 Dark=On 正式组件。
  - id: message-feed-reasoning-light-variant
    severity: P0
    question: 白版思考链是否使用设计仓库 Dark=Off 正式组件？
    passCriteria: 白版长页使用 `智能体输出/思考链` 的 `状态=完成态, 1月版=On, Dark=Off`，不得使用 Dark=On 或 `item/思考链/1月版` 替代。
  - id: message-feed-layout-wrapper-transparent
    severity: P0
    question: 为排版新增的 message-row/wrapper 是否保持透明？
    passCriteria: 承载正式组件实例的外层 Auto Layout wrapper 的 fills/strokes/effects 均为空；只有明确声明的 fallback 内容卡允许有可见背景。
  - id: message-feed-business-light-theme-adapted
    severity: P0
    question: 白版中的指数/A股异动业务组件是否完成浅色主题适配？
    passCriteria: 指数、A股异动若只有单个暗色组件 key，白版必须把标题、指数名、tab、坐标轴、时间轴和热问开关切到浅色主题文字/底色；不得保留白色文字落在白色 wrapper 上。
  - id: message-feed-no-system-controls-import
    severity: P0
    question: 智能体输出组件是否避免导入旧系统控件母组件？
    passCriteria: assistant-avatar、answer-status、answer-body、reasoning-panel 不得使用旧系统控件 key；必须使用已记录的设计仓库 component set key。
  - id: related-questions-after-answer
    severity: P1
    question: 关联问是否位于回答内容之后，且不进入底部输入栏？
    passCriteria: related_questions 属于 message_feed 内容尾部。

