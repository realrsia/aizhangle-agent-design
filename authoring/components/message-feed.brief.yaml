# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.message-feed
name: 对话消息流
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 AI 对话页中用户问题、智能体回答、思考链、正文、免责声明、
  辅助功能、关联问等内容的垂直消息流。消息流是页面唯一主要滚动区。
  当前结构来源切换到设计仓库/对话流/对话-白版中的消息内容堆栈。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 保持消息流作为唯一主要滚动区。
    - 按 shell、layout、block、item、content、action 层级组织。
    - 长回答先保证结构层级，再修视觉细节。
    - AI 头像、回答状态、正文、关联问优先使用设计仓库/对话流中已出现的实例或组件。
    - 白版回答正文若设计仓库缺少 Dark=Off 正式变体，暂时允许使用高保真 fallback 文本容器；必须标注为 fallback / non-canonical / answer-body-light。
    - 白版思考链必须使用设计仓库 `智能体输出/思考链` 的 Dark=Off 正式变体，不得改用 item/思考链/1月版 或手绘 fallback。
    - message-feed 内的 fallback 股票卡、走势图、推荐结论、风险说明、白版正文容器必须使用 Auto Layout 表达父子关系、padding、gap 和文本流。
    - fallback 中的文字节点纵向优先使用 Hug Contents / auto-height；父级容器高度必须由文本内容、padding 和 gap 自然撑开。
    - 为了排版新增的 message-row、wrapper、container 只能承载布局；若其子级是正式设计组件实例，父级必须保持透明，fills/strokes/effects 均为空。
    - 白版嵌入 `指数`、`A股异动` 等大盘业务组件时，必须确认组件是否存在 light 主题；若只有暗色组件，必须做高保真浅色主题适配并标注，不得出现白色标题/坐标轴文字落在白色卡片上。
  dont:
    - 不要把 numbered Frame 或 Group 当作语义组件来源。
    - 不要把关联问、免责声明、辅助功能散落到页面根层。
    - 不要用通用卡片堆叠替代对话消息结构。
    - 不要原创 AI 头像、回答状态、关联问或思考链样式来替代未绑定组件。
    - 不要在白版页面使用 Dark=On 的智能体输出/正文组件，也不要通过覆盖白字变量伪装成白版正式组件。
    - 不要在白版页面使用 Dark=On 的智能体输出/思考链组件，也不要通过覆盖白字变量伪装成白版正式组件。
    - 不要用固定高度文本框或手写 y 坐标把长文本、风险说明、结论说明压进最小高度。
    - 不要让承载用户输入、AI 头像、回答状态、思考链、正文、关联问等正式组件实例的外层 wrapper 产生可见背景、描边或阴影。
    - 不要把只有暗色文本 token 的 `指数`、`A股异动` 组件直接放进白版卡片容器。

# [HUMAN REQUIRED]
riskWarnings:
  - 消息流是对话页主体，层级错会导致页面看起来像普通内容页。
  - 思考过程已绑定设计仓库组件，生成时必须导入组件，不能当普通卡片随意重画。
  - 智能体输出/正文当前只确认了 Dark=On 组件；白版正文 Dark=Off 暂缺时可临时 fallback，但必须清楚标注，不得当作正式组件实例。
  - 智能体输出/思考链已确认 Dark=Off 正式变体；白版若误用 Dark=On 或 item/思考链/1月版，会出现白色文字和结构漂移。
  - 股票信息卡和 K 线图无正式组件时允许 fallback，但必须标清不是正式组件。
  - fallback 模块通过几何不重叠不代表合格；必须验证文本未被固定高度压缩，父级 padding 没有被吃掉，长页下半部分保留可读间距。
  - Auto Layout 包裹层若保留 Figma 默认白色 fill，会在黑白页面中制造多余底色；生成后必须检查正式组件实例的父级 wrapper 没有可见 fills/strokes/effects。
  - 指数、A股异动、资讯等行情内容若在回答中出现，应优先使用设计仓库业务内容组件，不要重画成普通卡片。
  - 指数、A股异动当前在 message-feed 中只记录到单个业务组件 key；若未确认 light variant，白版必须校验并适配文字颜色、坐标轴颜色和热问开关主题。
  - 设计仓库 3.3 底bar组件 section 未确认包含 AI 头像/回答状态正式组件；不能因此自行重画。

