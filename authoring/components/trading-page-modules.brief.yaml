# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.trading-page-modules
name: 交易页面模块组件族
owner: design-system
status: draft
purpose: 维护交易页面中的顶部上下文、设置区和信息区等页面级 Figma 组件 family。交易输入控件和交易行动按钮仍作为独立共享组件维护，本文件只负责页面模块组件族。
usedIn:
- trading_context_header
- account-switch-header
- stock_trading_detail_header
- paper-trading-header
- trading_setting_panel
- condition_order_setting_panel
- trading_order_form
- trading_info_panel
- position_info_panel
- contract_info_panel
- entrust_info_panel
- condition_order_info_panel
humanRules:
  do:
  - 把交易顶部、设置区和信息区作为同一交易页面模块 brief 下的多个独立 component family 维护。
  - 每个真实母组件或 component set 保留自己的使用场景、允许区域、禁用区域、风险边界和变体规则。
  - 交易输入控件继续引用 `component.trading-input`，交易买卖撤等高风险行动继续引用 `component.trading-action-button`。
  - 页面级正例、prototype 或 source selection 证据只进入 `usageInstanceGroups`。
  dont:
  - 不要把交易顶部、设置区和信息区拆成多个相互孤立的页面模块 brief。
  - 不要把交易输入控件或交易行动按钮重新定义为页面模块内部私有组件。
  - 不要把当前委托、历史委托、条件单、历史策略混成一个通用列表组件。
  - 不要在 componentKey、文本覆盖字段或真实 variant property 未确认时硬猜。
riskWarnings:
- id: trading-page-context-and-parameter-risk
  severity: P0
  rule: 交易页面模块同时承载账户/标的上下文、交易参数和信息区状态；任一模块错位都会误导交易理解。
- id: trading-page-action-boundary
  severity: P0
  rule: 页面模块内出现的买入、卖出、撤单、批量、再来一单等入口必须保持正确交易语义，不得降级成普通按钮或错误提升为主提交区。
allowedZones:
- trading_page
- trading_context_header
- trading_setting_panel
- trading_info_panel
- condition_order_info_panel
- position_info_panel
- contract_info_panel
- entrust_info_panel
forbiddenZones:
- generic_dashboard_card
- generic_form_card
- generic_data_table
- ordinary_button_group
- ai_chat_message_body
- marketing_or_content_card
requiredPairings:
- trading-context
- selected-security
- component.trading-input
- component.trading-action-button
forbiddenPairings:
- screenshot-as-component-definition
- generic-input-only
- generic-data-table
- trading-submit-area-without-context
examples:
  good:
  - figmaNodeId: 37:26221
    reason: TOP 母组件源区域，承载交易顶部上下文 family。
  - figmaNodeId: 37:26556
    reason: 设置母组件，承载交易参数设置区主表单。
  - figmaNodeId: 37:26343
    reason: 信息母组件，承载持仓、合约、委托、条件单和历史类信息区。
  needsReview: []
  bad:
  - reason: 把交易顶部右侧 tab 或规则入口当成买卖提交按钮。
  - reason: 把交易设置区压平成普通表单卡片。
  - reason: 把持仓、合约、委托和条件单渲染成同一种普通列表。
componentHumanRules:
  ruleScope: trading-page-component-family-board
  definition: 交易页面模块 brief 维护交易顶部、设置区和信息区下的真实 component family；共享输入和行动按钮仅作为依赖引用。
  do:
  - 真实 component set / component variant 进入 componentFamilies 和 variant rules。
  - 页面 frame、source selection、prototype 和 demo 进入 usageInstanceGroups。
  - 跨组件业务编排留在 authoring/scenarios/trading.brief.yaml。
  dont:
  - 不要让 scenario 反向覆盖组件自己的允许 / 禁止使用边界。
  - 不要把共享控件复制成交易页面模块私有 family。
extensionModel:
  mode: component-family-board
  mergedFrom:
  - temporary split brief for trading top navigation families
  - temporary split brief for trading settings-panel families
  - temporary split brief for trading info-panel families
  dependencyComponents:
  - component.trading-input
  - component.trading-action-button
  - component.bottom-bar
  - component.switch
  rationale: 这些 family 都属于交易页面模块级组件区域，合并后更符合飞书文档中的多 component family brief 模型；具体 family 的精确可用区和禁用区保留在各自 family 内。
componentFamilies:
- id: trading.top-nav.account-switch
  figmaNodeId: 37:26291
  figmaName: 分类=账户切换
  familyRole: supporting
  usedIn:
  - trading_context_header
  - account-switch-header
  allowedZones:
  - top_nav
  - trading_context_header
  forbiddenZones:
  - generic_card_header
  - bottom_dock
  - trading_submit_area
  humanRules:
    do:
    - 用于带账户身份与右侧轻量切换的交易页顶部导航。
    - 保留左侧层级入口、主标题、账户摘要和右侧双 tab 的完整关系。
    - 账户摘要允许展示账户类型与脱敏数字，但必须保持双行结构。
    dont:
    - 不要删掉账户摘要后继续沿用这个 family。
    - 不要把这个 family 当成通用二级页纯标题栏。
    - 不要把右侧 tab 扩展成买卖、撤单等高风险动作组。
  riskWarnings:
  - 账户身份和摘要结构错误会误导用户当前交易账户与可操作模式。
- id: trading.top-nav.page-slide
  figmaNodeId: 37:26322
  figmaName: 分类=页面滑动
  familyRole: supporting
  usedIn:
  - stock_trading_detail_header
  - security-context-header
  allowedZones:
  - top_nav
  - trading_context_header
  forbiddenZones:
  - generic_card_header
  - bottom_dock
  - account-switch-header-with-tabs
  humanRules:
    do:
    - 用于标的详情类交易页顶部，展示股票名称、代码与第二行摘要。
    - 保持“名称 + 代码”同列结构，不拆成单标题。
    - 第二行摘要继续表达账户、权限或普通/信用等上下文，不替换成行情主价格区。
    dont:
    - 不要把这个 family 当成纯标题栏使用。
    - 不要把标的代码换成无关标签或 tab。
    - 不要把第二行摘要改造成价格主信息。
  riskWarnings:
  - 标的名称与代码组合错误会直接影响用户对当前交易标的的识别。
- id: trading.top-nav.paper-trading
  figmaNodeId: 37:26305
  figmaName: 分类=模拟交易
  familyRole: supporting
  usedIn:
  - paper-trading-header
  - rules-entry-header
  allowedZones:
  - top_nav
  - trading_context_header
  forbiddenZones:
  - live-trading-header
  - generic_card_header
  - trading_submit_area
  humanRules:
    do:
    - 仅用于模拟交易上下文，保留“模拟”主标题与红色模拟标识。
    - 右侧双 tab 与“规则”入口需要一起校验其模拟场景语义。
    - 模拟标签必须明显可见，避免与实盘交易混淆。
    dont:
    - 不要在实盘页面复用模拟交易 family。
    - 不要删除模拟标识后继续使用这个 family。
    - 不要把“规则”入口替换成高风险交易操作。
  riskWarnings:
  - 模拟与实盘上下文混淆会造成严重操作预期偏差。
- id: trading.settings-panel.main
  figmaNodeId: 37:26556
  figmaName: 设置母组件
  familyRole: supporting
  usedIn:
  - trading_setting_panel
  - condition_order_setting_panel
  allowedZones:
  - top_summary
  - trading_setting_panel
  - detail_footer
  forbiddenZones:
  - top_nav
  - generic_card_body
  - bottom_dock
  humanRules:
    do:
    - 用于交易页中的设置主表单，承载代码、类型、价格、数量、金额与高级设置组合。
    - 保持 98px 左标签区与 245px 右输入区的结构节奏，不随意压缩成普通列表项。
    - 底部买卖按钮继续复用交易行动按钮语义，不当作新的设置组件定义。
    - 深色版和浅色版通过规范色切换保持一致，不额外声明独立变体属性。
    dont:
    - 不要把整个设置母组件简化成普通表单卡片。
    - 不要删除高级设置区后继续沿用同一个主 family 作为完整交易设置表单。
    - 不要把输入、开关、时长选项、买卖按钮都揉成一个不可审查的大组件描述。
  riskWarnings:
  - 设置主表单承载交易前关键参数，结构错位会直接影响交易理解与后续操作正确性。
- id: trading.settings.code-field
  figmaNodeId: 37:26558
  figmaName: item/设置/基础设置
  familyRole: supporting
  usedIn:
  - trading_security_search_row
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于代码输入与证券名称/代码确认行，保留清空图标、行情图入口和行情摘要。
    - 名称与代码应保持混排结构，名称使用文本字体，代码使用数字字体。
    dont:
    - 不要把它缩减成普通搜索框。
    - 不要删除右侧行情摘要后仍声称与当前 family 一致。
  riskWarnings:
  - 标的识别与行情摘要错误会影响后续交易对象判断。
- id: trading.settings.order-type-field
  figmaNodeId: 37:26559
  figmaName: item/设置/基础设置
  familyRole: supporting
  usedIn:
  - trading_order_type_row
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于委托类型选择，保留右侧下拉箭头与居中文字。
    - 类型文案应作为单值选择，不改造成多标签并列。
    dont:
    - 不要把它替换成普通文本按钮或静态标签。
  riskWarnings:
  - 委托类型误读会直接影响交易方式理解。
- id: trading.settings.price-stepper
  figmaNodeId: 37:26560
  figmaName: item/设置/基础设置
  familyRole: supporting
  usedIn:
  - trading_price_row
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于价格步进输入，保留减号、数值、加号与买上限/卖下限提示。
    - 左右操作图标必须保持可见，不允许只剩文字说明。
    dont:
    - 不要把它降级成普通纯文本输入框。
    - 不要移除价格区间辅助信息后继续声称是同一 family。
  riskWarnings:
  - 价格步进和上下限提示错误会直接影响委托价格理解。
- id: trading.settings.amount-summary
  figmaNodeId: 37:26562
  figmaName: item/设置/基础设置
  familyRole: supporting
  usedIn:
  - trading_amount_row
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于金额展示行，保留金额值与“更多设置”入口。
    - 金额区优先作为结果/展示区域，不强行等同于可编辑输入框。
    dont:
    - 不要把金额展示误写成普通可编辑输入。
  riskWarnings:
  - 金额行是交易结果预览的重要锚点，展示与可编辑语义混淆风险高。
- id: trading.settings.price-range
  figmaNodeId: 37:26566
  figmaName: item/设置/高级设置
  familyRole: supporting
  usedIn:
  - condition_order_price_range
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于价格区间高级设置，保留最低价、最高价、步进按钮和休眠说明。
    - 这是条件单类高级参数，不默认扩展到所有普通交易页。
    dont:
    - 不要把它当成普通价格输入行复用。
  riskWarnings:
  - 条件单价格边界设置错误会改变触发范围。
- id: trading.settings.multiplier-toggle
  figmaNodeId: 37:26567
  figmaName: item/设置/高级设置
  familyRole: supporting
  usedIn:
  - trading_multiplier_setting
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于倍数委托开关与说明区，保留中尺寸开关和说明文案。
    dont:
    - 不要把它并入普通基础设置行。
  riskWarnings:
  - 倍数委托属于高风险增强逻辑，开关语义必须清楚。
- id: trading.settings.auto-cancel
  figmaNodeId: 37:26568
  figmaName: item/设置/高级设置
  familyRole: supporting
  usedIn:
  - trading_auto_cancel_setting
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于自动撤单开关与预设时长选择。
    - 当前选中态与未选中态都要保留独立按钮语义。
    dont:
    - 不要把时长预设改成自由输入而不另建 family。
  riskWarnings:
  - 自动撤单时长会直接影响委托生效时长，误用风险高。
- id: trading.settings.monitor-window
  figmaNodeId: 37:26569
  figmaName: item/设置/高级设置
  familyRole: supporting
  usedIn:
  - trading_monitor_window_setting
  allowedZones:
  - trading_setting_panel
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于监控时段开关与周期/每日时段选择。
    - 周期时段和每日时段都保持右侧下拉选择语义。
    dont:
    - 不要把它压成单行开关而省略时段配置。
  riskWarnings:
  - 监控时段错误会影响策略触发时间边界。
- id: trading.info.holdings
  figmaNodeId: 37:26364
  figmaName: 分类=持仓, 有内容=On, Dark=Off
  familyRole: supporting
  usedIn:
  - trading_info_panel
  - position_info_panel
  allowedZones:
  - trading_info_panel
  - mid_content
  forbiddenZones:
  - top_nav
  - trading_setting_panel
  - bottom_dock
  humanRules:
    do:
    - 用于持仓信息区，保留上方二级 tab、标题统计、表头和持仓列表结构。
    - 有内容与空态要分开使用，空态不能伪装成低密度列表。
    - 盈亏、持仓数量、可卖数量等结果信息优先保持列表信息卡语义。
    dont:
    - 不要把持仓信息区改造成普通卡片概览。
    - 不要删掉二级 tab 后继续沿用同一 family。
  riskWarnings:
  - 持仓数量、盈亏或可操作状态表达错误会直接影响交易判断。
- id: trading.info.holdings.secondary-tabs
  figmaNodeId: 37:26366
  figmaName: tab/二级tab
  familyRole: supporting
  usedIn:
  - trading_info_panel
  - position_info_panel
  - contract_info_panel
  allowedZones:
  - trading_info_panel
  - mid_content
  forbiddenZones:
  - top_nav
  - bottom_dock
  - trading_submit_area
  humanRules:
    do:
    - 用于信息区内部的二级切换导航，保留选中态下划线、计数和未选中态层级。
    - 持仓、合约、委托、条件单、历史这组标签需要保持同一导航体系。
    - 当前这组 tab 文案默认固定，不作为常规可编辑字段处理。
    dont:
    - 不要把它误写成顶部主导航。
    - 不要把其中某个 tab 单独抽成交易主按钮。
    - 不要根据提示词随意改写持仓、合约、委托、条件单、历史这些 tab 名称。
  riskWarnings:
  - 选中态或计数错误会导致当前信息区分类判断错误。
- id: trading.info.holdings.table-header
  figmaNodeId: 37:26368
  figmaName: item/信息/表头
  familyRole: supporting
  usedIn:
  - trading_info_panel
  - position_info_panel
  allowedZones:
  - trading_info_panel
  - mid_content
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于持仓信息表头，保留名称/代码、持仓盈亏、持仓/可用、现价/成本、今日盈亏等多列结构。
    - 各列标题与排序图标应保持成组出现。
    - 表头文案在不同交易信息场景中默认固定，不作为常规改写目标。
    dont:
    - 不要把持仓表头压成普通两列表头。
    - 不要删除排序图标后继续声称与当前表头一致。
    - 不要在未明确要求时改写列标题名称。
  riskWarnings:
  - 列标题或排序语义错误会直接影响持仓数据理解。
- id: trading.info.holdings.position-row
  figmaNodeId: 37:26369
  figmaName: item/信息/持仓&合约/集合
  familyRole: supporting
  usedIn:
  - trading_info_panel
  - position_info_panel
  allowedZones:
  - trading_info_panel
  - mid_content
  forbiddenZones:
  - top_nav
  - bottom_dock
  humanRules:
    do:
    - 用于持仓列表单列，保留名称、代码、标签、盈亏、持仓/可用、现价/成本等多列信息。
    - 同一行里的红绿数值语义必须遵守交易涨跌规则。
    dont:
    - 不要把单列压缩成只有名称和一个数值的简化卡片。
    - 不要删除标签区后继续沿用同一 row family。
  riskWarnings:
  - 行级盈亏、仓位、市值或标签信息错误会直接影响交易判断。
- id: trading.info.holdings.batch-actions
  figmaNodeId: 37:26377
  figmaName: item/信息/批量买入卖出按钮
  familyRole: supporting
  usedIn:
  - trading_info_panel
  - position_info_panel
  allowedZones:
  - trading_info_panel
  - mid_content
  forbiddenZones:
  - top_nav
  - trading_setting_panel
  humanRules:
    do:
    - 用于持仓区底部批量买入/批量卖出入口，保留双按钮和对应方向图标。
    - 这是持仓信息区的后续处理入口，不替代主交易提交按钮。
    - 批量买入、批量卖出按钮文案默认固定。
    dont:
    - 不要把它误写成底部固定买卖主操作区。
    - 不要删掉方向图标后继续声称与当前 family 一致。
    - 不要在未明确要求时改写批量买入、批量卖出文案。
  riskWarnings:
  - 批量买入卖出方向混淆会带来高风险误操作。
- id: trading.info.holdings.empty-state
  figmaNodeId: 37:26383
  figmaName: 空状态/卡片空态
  familyRole: supporting
  usedIn:
  - trading_info_panel
  - position_info_panel
  allowedZones:
  - trading_info_panel
  - mid_content
  forbiddenZones:
  - top_nav
  - bottom_dock
  - trading_submit_area
  humanRules:
    do:
    - 用于持仓空态内容区，保留空态插画和“暂无持仓”提示文案。
    - 空态出现时，二级 tab 和表头仍然保留，只有内容区切换为空态卡片。
    dont:
    - 不要把空态做成整块内容直接消失。
    - 不要在默认空态下展示批量买入、批量卖出入口。
  riskWarnings:
  - 如果空态误保留批量操作或数据列表，会误导用户当前仍有可操作持仓。
- id: trading.info.contract
