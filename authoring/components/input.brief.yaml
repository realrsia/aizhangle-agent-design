# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.input
name: 普通输入框
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于非交易表单中的文本输入、搜索或普通表单录入。它提供轻量 filled input
  视觉，不承载交易步进、下拉组合或条件输入结构。

# [HUMAN REQUIRED]
usedIn:
  - generic-form
  - search-entry
  - filter-input

# [HUMAN REQUIRED]
humanRules:
  do:
    - filled input 使用输入背景 token，不添加边框。
    - placeholder 使用 text/quaternary。
    - 圆角使用 radius/input。
  dont:
    - 不要给已有背景色的输入框再加描边。
    - 不要把交易输入控件降级成普通输入框。

# [HUMAN REQUIRED]
riskWarnings:
  - 交易相关字段必须改用 component.trading-input。

# [HUMAN REQUIRED]
allowedZones:
  - generic_form_field
  - search_area
  - filter_panel

# [HUMAN REQUIRED]
forbiddenZones:
  - trading_order_form

# [HUMAN REQUIRED]
requiredPairings:
  - label-or-placeholder

# [HUMAN REQUIRED]
forbiddenPairings:
  - trading-stepper-structure

# [HUMAN REQUIRED]
examples:
  good: []
  needsReview: []
  bad:
    - name: filled input 额外加边框
      reason: 输入框已有背景 token，不应增加视觉噪音。

# ============================================================
# 02_AGENT_EXTRACTED
# Agent 自动读取区
# ============================================================

