id: component.chat-topbar
name: 对话顶部导航栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 full-screen conversation 页面顶部固定导航，包含左侧关闭和右侧消息、
  播放等紧凑图标操作。当前绑定到设计仓库/对话流中的 1月版全屏对话导航栏，
  不再使用普通二级页导航栏或交易页 header 作为替代。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 使用全屏对话导航结构，完整高度为 91px。
    - 顶部 47px iOS 状态区和 44px 对话 header 保持固定。
    - 右侧图标顺序为消息、播放。
    - 优先使用设计仓库/对话流/1月版全屏对话导航栏的组件变体。
  dont:
    - 不要使用普通二级页标题栏替代。
    - 不要添加标题、搜索、tab 或底部分割线。
    - 不要把顶部导航放进滚动消息流。
    - 不要根据交易页 Stock Header 或普通 header 自行原创对话顶部导航。

# [HUMAN REQUIRED]
riskWarnings:
  - 顶部导航类型错误会导致对话页变成普通二级页。
  - 不能用二级页导航栏、首页导航栏或交易页 Stock Header 替代全屏对话导航栏。

# [HUMAN REQUIRED]
allowedZones:
  - topbar
  - full-screen-conversation-header

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - bottom_input
  - ordinary-card-header

# [HUMAN REQUIRED]
requiredPairings:
  - iOS-status-region
  - component.message-feed
  - component.chat-input

# [HUMAN REQUIRED]
forbiddenPairings:
  - level-2-title-header
  - tabbed-navigation

# [HUMAN REQUIRED]
componentFamilies:
  - id: chat-topbar.fullscreen-conversation
    figmaNodeId: "400:25178"
    canonicalName: 全屏对话导航栏
    sourceFigmaExactName: 1月版全屏对话导航栏
    sourceNameStatus: repository_component_set_confirmed
    sourceInstanceRole: dialog_page_topbar_instance
    componentSetNodeId: "12:5696"
    componentSetKey: d6c27504e793aea744afe4c816200fbcce914c5a
    mainComponentNodeId: "12:5697"
    componentKey: eac35c8abbd87e668ac8857cffaae0e5b0d9b4db
    variantProperties:
      展开: "Off"
      胶囊数量: "0"
      Dark: "On"
    familyType: component_instance
    humanUse: confirmed_dialog_topbar_instance
    humanRules:
      - 作为对话页固定顶部组件，不作为普通页面 header。
      - 默认对话态优先使用 展开=Off, 胶囊数量=0；需要胶囊时再选择展开变体。

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "400:25178"
      reason: 设计仓库/2.2 页面背景/对话-白版中的全屏对话导航栏实例，展开=Off, 胶囊数量=0, Dark=On。
  needsReview:
    - name: 对话-白版 frame 中 topbar 的 Dark 属性命名
      reason: Figma 实例 400:25178 位于“对话-白版”frame，但组件属性读取为 Dark=On；生成前应以节点属性为准，不按 frame 名称猜测。
  bad: []

