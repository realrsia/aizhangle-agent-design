# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.chat-topbar
name: 对话顶部导航栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 full-screen conversation 页面顶部固定导航，包含左侧关闭和右侧消息、
  播放等紧凑图标操作。当前先以对话流GUI与规范实测中的实例作为页面来源，
  后续继续确认是否存在设计仓库正式组件。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 使用全屏对话导航结构，完整高度为 91px。
    - 顶部 47px iOS 状态区和 44px 对话 header 保持固定。
    - 右侧图标顺序为消息、播放。
    - 如果设计仓库未找到对话顶部导航正式组件，先使用对话流GUI与规范实测中的实例并标记待确认。
  dont:
    - 不要使用普通二级页标题栏替代。
    - 不要添加标题、搜索、tab 或底部分割线。
    - 不要把顶部导航放进滚动消息流。
    - 不要根据交易页 Stock Header 或普通 header 自行原创对话顶部导航。

# [HUMAN REQUIRED]
riskWarnings:
  - 顶部导航类型错误会导致对话页变成普通二级页。
  - 设计仓库 3.3 底bar组件 section 中可见 Stock Header/Status Bar 等交易页头部示例，但未确认是对话顶部导航正式来源。

# [HUMAN REQUIRED]
allowedZones:
  - topbar
  - full-screen-conversation-header

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - bottom_input
  - ordinary-card-header

# [HUMAN REQUIRED]
requiredPairings:
  - iOS-status-region
  - component.message-feed
  - component.chat-input

# [HUMAN REQUIRED]
forbiddenPairings:
  - level-2-title-header
  - tabbed-navigation

# [HUMAN REQUIRED]
componentFamilies:
  - id: chat-topbar.fullscreen-conversation
    figmaNodeId: "5524:134998"
    canonicalName: 全屏对话导航栏
    sourceFigmaExactName: 1月版全屏对话导航栏
    sourceNameStatus: legacy_name_in_figma_needs_rename
    sourceInstanceRole: dialog_page_topbar_instance
    familyType: component_set_instance
    humanUse: draft_use_dialog_gui_instance_pending_formal_repository_component
    humanRules:
      - 作为对话页固定顶部组件，不作为普通页面 header。
      - 后续需要继续确认设计仓库中是否存在同源正式组件。

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "5524:134998"
      reason: 对话黑版中的全屏对话导航栏实例。
    - figmaNodeId: "5829:15311"
      reason: 对话白版中的全屏对话导航栏实例，用于验证浅色主题。
    - figmaNodeId: "5524:137503"
      reason: 投顾问答中的全屏对话导航栏实例。
    - figmaNodeId: "5524:136837"
      reason: 开启新对话白版中的全屏对话导航栏实例，用于状态页参考。
  needsReview:
    - name: 对话顶部导航标准来源
      reason: 当前先以对话流GUI与规范实测实例为准，后续确认是否有设计仓库正式组件。
    - name: 设计仓库 3.3 底bar组件 section
      reason: 已检查到 bottom bar 与交易页 Stock Header 示例；未发现可直接替代对话顶部导航的正式组件。
  bad: []

