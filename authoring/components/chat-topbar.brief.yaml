id: component.chat-topbar
name: 对话顶部导航栏
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于 full-screen conversation 页面顶部固定导航，包含左侧关闭和右侧消息、
  播放等紧凑图标操作。当前绑定到设计仓库/对话流中的 1月版全屏对话导航栏，
  不再使用普通二级页导航栏或交易页 header 作为替代。

# [HUMAN REQUIRED]
usedIn:
  - ai-chat-page
  - message-page

# [HUMAN REQUIRED]
humanRules:
  do:
    - 使用全屏对话导航结构，完整高度为 91px。
    - 顶部 47px iOS 状态区和 44px 对话 header 保持固定。
    - 右侧图标顺序为消息、播放。
    - 优先使用设计仓库/对话流/1月版全屏对话导航栏的组件变体。
  dont:
    - 不要使用普通二级页标题栏替代。
    - 不要添加标题、搜索、tab 或底部分割线。
    - 不要把顶部导航放进滚动消息流。
    - 不要根据交易页 Stock Header 或普通 header 自行原创对话顶部导航。

# [HUMAN REQUIRED]
riskWarnings:
  - 顶部导航类型错误会导致对话页变成普通二级页。
  - 不能用二级页导航栏、首页导航栏或交易页 Stock Header 替代全屏对话导航栏。

# [HUMAN REQUIRED]
allowedZones:
  - topbar
  - full-screen-conversation-header

# [HUMAN REQUIRED]
forbiddenZones:
  - message_feed
  - bottom_input
  - ordinary-card-header

# [HUMAN REQUIRED]
requiredPairings:
  - iOS-status-region
  - component.message-feed
  - component.chat-input

# [HUMAN REQUIRED]
forbiddenPairings:
  - level-2-title-header
  - tabbed-navigation

# [HUMAN REQUIRED]
componentFamilies:
  - id: chat-topbar.fullscreen-conversation
    figmaNodeId: "400:25178"
    canonicalName: 全屏对话导航栏
    sourceFigmaExactName: 1月版全屏对话导航栏
    sourceNameStatus: repository_instance_confirmed_component_set_pending
    sourceInstanceRole: dialog_page_topbar_light_instance
    familyType: component_instance
    humanUse: confirmed_dialog_topbar_light_instance
    humanRules:
      - 作为对话页固定顶部组件，不作为普通页面 header。
      - 默认对话态优先使用 展开=Off, 胶囊数量=0；需要胶囊时再选择展开变体。

# [HUMAN REQUIRED]
examples:
  good:
    - figmaNodeId: "400:25178"
      reason: 设计仓库/2.2 页面背景/对话-白版中的全屏对话导航栏实例，展开=Off, 胶囊数量=0, Dark=Off。
  needsReview:
    - name: 全屏对话导航栏母组件或组件集来源
      reason: 旧对话流重复节点已删除；当前只确认到 400:25178 白版实例，组件集和 componentKey 需继续从 Figma 组件面板确认。
    - name: 黑版、展开态、胶囊数量变体节点
      reason: 新 section 中尚未确认等价节点，不能继续引用已删除的旧对话流节点。
    - name: 胶囊数量枚举是否只允许 0/1/2/4
      reason: 当前从设计仓库节点读取到 0、1、2、4；是否还有其他状态需继续确认。
  bad: []

