slots:
  shell:
    description: 大盘页面和工作卡的背景外壳。
  title:
    description: 大盘标题与市场状态组合区。
  indexCarousel:
    description: 支持左右滑动的指数展示模块。
  indexPager:
    description: 跟随滑动位置变化的底部导航栏。
  abnormalAShare:
    description: A股异动 主模块，包含顶部栏、走势底图、标签和时间轴。
  hotQuestionToggle:
    description: A股异动 右上角的热问开关。
  barrage:
    description: 自动滚动的弹幕区域，包含双行消息流和遮罩范围。
  barrageMessage:
    description: 弹幕区域中的单条消息，区分普通与热点。
  auction:
    description: 竞价金额、涨跌停统计、进度条和底部对比信息组成的竞价阅读区。
  tab:
    description: 资讯流前的内容切换区，由多个 tab 胶囊组成。
  tabPill:
    description: tab 区域中的单个胶囊子组件，当前按系统层组件占位引用记录。
  newsFeed:
    description: 由不同分类资讯卡组成的资讯流区域。
  newsTitle:
    description: 资讯卡内部标题 family，区分单行/双行和深浅色。
  newsTip:
    description: 资讯卡内部提示 family，区分单条/多条状态。
  scrollGuide:
    description: 只在 1屏 初始状态固定出现、滑动后消失的首屏滑动引导。
  themeLayer:
    description: 根据 dark on/off 切换的主题视觉层。
  pageMode:
    description: 根据 1屏 / 全屏 切换的高度与裁切模式。
