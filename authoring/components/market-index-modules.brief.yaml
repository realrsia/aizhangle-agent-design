    do:
    - 只用于 1屏 初始状态下的固定滑动引导。
    - 固定出现在卡片底部上方 1 个间距高度的位置。
    - 用户开始滑动浏览信息后应立即消失，不参与后续滚动内容。
    - 需要同时支持 dark=On 和 dark=Off 两套主题变体。
    dont:
    - 不要在全量滚动状态下持续显示。
    - 不要把它变成常驻悬浮控件或底部导航的一部分。
    - 不要改变其与卡片底部的固定间距关系。
  riskWarnings:
  - 滑动引导是首屏教育性提示，若常驻不消失会直接干扰后续信息浏览。
  - 当前不复用到首页其他首屏引导场景，应保持为大盘首屏私有 family。
