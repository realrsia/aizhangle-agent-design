# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.market-index-modules
name: 大盘模块组件族
owner: design-system
status: draft
purpose: 维护大盘页面中已确认的背景壳、标题、指数、异动、弹幕、竞价、tab、资讯和滑动引导等 Figma 组件 family。场景文件只负责页面组合与首屏/全量使用关系。
usedIn:
- market-index-full-page
- market-index-first-screen
- html-prototype-market-index
- figma-review-market-index
humanRules:
  do:
  - 同一个 Figma component set 下的真实子变体应进入 variantGroups 与 variantHumanRules。
  - 兄弟母组件等到后续被单独选中后，再逐组补入各自 family。
  - 页面级正例只进入 usageInstanceGroups。
  - 系统层组件可以先在当前场景 brief 中登记引用规则，待系统层 brief/canon 完整后再回填正式绑定。
  dont:
  - 不要把当前已选中的 family 与未选中的兄弟 family 混写在同一轮事实区。
  - 不要在 componentKey、文本覆盖字段或 token 绑定未确认时硬猜。
riskWarnings:
- id: market-index-background-source-of-truth
  severity: P0
  rule: '背景 family 是大盘页面壳层的真实 Figma 母组件，必须优先使用其真实变体， 不得用相似 frame 或截图替代。

'
- id: market-index-background-theme-consistency
  severity: P0
  rule: 'light 与 dark 必须严格对应真实主题，不得混用或只维护单套主题。 不允许局部特殊色脱离标准 token 体系单独存在。

'
- id: market-index-background-first-screen-scope
  severity: P1
  rule: '1屏 变体只用于首屏裁切与原型视口，不得替代全屏变体作为主页面背景。

'
allowedZones:
- page_shell
- market_index_card_background
- first_screen_crop_shell
- market_index_card_header
- page_section_title
- market_index_top_summary
- market_index_horizontal_scan
- abnormal_sector_scan
- market_index_signal_map
- market_index_signal_barrage
- rolling_message_zone
- market_index_auction_read
- market_index_opening_signal
- market_index_content_switch
- market_index_news_filter
- market_index_news_feed
- market_index_opportunity_extension
- first_screen_guide
- market_index_card_bottom_hint
forbiddenZones:
- news_list_item
- inline_content_module
- generic_dashboard_card
- bottom_dock
- top_nav
- full_scroll_body
requiredPairings:
- full-light-and-dark-reference
- first-screen-crop-reference
- semantic-top-nav
- semantic-bottom-structures
forbiddenPairings:
- usage-frame-as-family
- screenshot-as-component-definition
- first-screen-as-primary-truth
examples:
  good:
  - figmaNodeId: 7:6308
    reason: dark 首屏背景母组件真实变体。
  - figmaNodeId: 31:18747
    reason: dark 全屏背景母组件真实变体。
  - figmaNodeId: 7:6910
    reason: light 首屏背景母组件真实变体。
  - figmaNodeId: 31:18755
    reason: light 全屏背景母组件真实变体。
  needsReview:
  - figmaNodeId: 3:2360
    reason: 1屏 dark 页面正例，只能当 usage instance，不是背景 family 定义。
  - figmaNodeId: 3:4021
    reason: 1屏 light 页面正例，只能当 usage instance，不是背景 family 定义。
  bad:
  - reason: 把大盘_全量_light 或 大盘_全量_dark 直接写成 component family。
  - reason: 用通用白底卡片或通用深色面板替代真实背景 family。
componentHumanRules:
  ruleScope: market-index-component-family-board
  definition: 大盘模块 brief 维护大盘页面下的真实 component family；页面全量 / 首屏 frame 由 scenario 维护为
    usage 真源。
  do:
  - 真实 component set / component variant 进入 componentFamilies 和 variant rules。
  - 页面 frame、prototype 和视觉生成参考只进入 usageInstanceGroups 或 scenario。
  - 跨组件页面编排留在 authoring/scenarios/market-index.brief.yaml。
  dont:
  - 不要把全量 light/dark 页面 frame 写成 component family。
  - 不要把大盘模块降级成普通 dashboard 卡片。
extensionModel:
  mode: component-family-board
  rationale: 大盘页面下存在多个真实 component family，按一个模块组件族 brief 统一维护。
componentFamilies:
- id: market-index.background-shell
  figmaNodeId: 7:6911
  componentKey: 57900b6e064fd94b5c32a1efe9feff70bea8e4d9
  figmaName: 背景
  familyRole: main
  usedIn:
  - page_shell
  - market_index_card_background
  - first_screen_crop_shell
  allowedZones:
  - page_shell
  - market_index_card_background
  - first_screen_crop_shell
  forbiddenZones:
  - news_list_item
  - inline_content_module
  - generic_dashboard_card
  humanRules:
    do:
    - 作为大盘页面和大盘工作卡的外层背景壳使用。
    - 按 1屏 / 全屏 与 light / dark 组合选择真实变体。
    - 主题颜色必须绑定标准 light / dark token 体系。
    - 页面 1屏 还原时，优先参考 1屏 实例真源中的定位与层级事实。
    - 保留顶部光层、卡片主体壳、描边、内发光或内阴影的分层关系。
    dont:
    - 不要把背景壳层当成可自由替换的普通容器。
    - 不要在深浅色之间交叉复用。
    - 不要加入脱离标准 token 的局部特殊色。
    - 不要把 light / dark 仅当成换色处理。
    - 不要把背景卡压平成 generic dashboard card。
  riskWarnings:
  - 背景 family 是页面还原准确度的基础壳层，错误变体会直接破坏整页 fidelity。
  - 允许在首页其他场景复用，但必须保持真实背景 family 的主题与尺寸变体边界。
- id: market-index.title-block
  figmaNodeId: 7:6941
  componentKey: 4d75187a01c3ad765b44a17f8da1505bde802916
  figmaName: 标题
  sourceVariants:
    dark: 7:6301
    light: 7:6940
  stableScenarioFacts:
    structure:
    - main_title_text
    - status_dot
    - status_text
    visualVariants:
      dark: 深色版标题包含渐变字表现和独立圆点处理，应按节点保留。
      light: 浅色版标题为实色文字，圆点与文字保持一致颜色，应按节点保留。
    flowOwnership:
      appliesTo:
      - market-index-first-screen
      - market-index-full-page
      rule: 标题属于大盘工作卡内容流，不应被视为屏幕独立绝对锚定元素；位置判断需要结合卡片内容流起点。
  implementationPatchExclusions:
  - 某次圆点颜色没同步。
  - 某次渐变字 fallback 看起来偏差。
  - 某次 padding、gap 或对齐值的临时补丁。
  - 某次浏览器里偏 1px 或 2px 的调试结果。
  - 某次当前位置算错的实现事故。
  familyRole: supporting
  usedIn:
  - market_index_card_header
  - page_section_title
  allowedZones:
  - market_index_card_header
  - page_section_title
  forbiddenZones:
  - news_list_item
  - bottom_dock
  - generic_dashboard_card
  humanRules:
    do:
    - 用于大盘场景顶部标题区，表达页面标题与当前市场状态。
    - 深浅色必须绑定对应标准主题，不允许脱离标准 token。
    - 审稿与高保真原型场景优先保持与 Figma 一致的字形效果。
    - 保留主标题文本、圆点、状态文字三段结构，不要把 `• 交易中` 当成单串普通文本。
    - 标题位置必须按卡片内容流起点判断，1屏 与 全量都适用。
    dont:
    - 不要把标题 family 当成通用标签、按钮或导航项。
    - 不要拆散标题和状态文本的组合关系。
    - 不要加入脱离标准 token 的局部特殊色。
    - 在目标环境无法稳定拿到同款字体时，不要用近似字体硬替造成明显字形偏差。
    - 不要把标题当成屏幕独立绝对锚定元素。
    - 不要把 light / dark 标题只当成同一文本的换色版本。
  riskWarnings:
  - 标题 family 直接承载场景语义，误用会让大盘页失去明确标题与状态提示。
  - 当前不复用到首页其他带“标题+状态”的卡片头部，应保持为大盘场景私有 family。
- id: market-index.index-summary
  figmaNodeId: 7:6302
  componentKey: 2c8497856e210074e83c2183bcf545ce863041d1
  figmaName: 指数
  familyRole: supporting
  usedIn:
  - market_index_top_summary
  - market_index_horizontal_scan
  allowedZones:
  - market_index_top_summary
  - market_index_horizontal_scan
  forbiddenZones:
  - bottom_dock
  - news_list_item
  - generic_dashboard_card
  humanRules:
    do:
    - 用于大盘顶部的指数扫描区，承载多指数横向浏览。
    - 指数展示模块允许左右滑动，底部导航栏需要跟随当前滑动位置。
    - 深色版和浅色版都必须使用规范色，涨跌语义保持红涨绿跌，不允许局部特殊色脱离标准 token。
    dont:
    - 不要把指数模块改造成静态单指标卡片。
    - 不要让底部导航栏与横向滑动状态脱节。
    - 不要把涨跌颜色替换成非规范金融语义色。
  riskWarnings:
  - 指数模块是大盘首层扫描入口，横向浏览与导航反馈错误会直接影响行情阅读效率。
  - 当前不复用到首页其他场景，应保持为大盘场景私有 family。
- id: market-index.abnormal-a-share
  figmaNodeId: 7:6303
  componentKey: 3255456fccafa816bf6c55f489fd6838b8233773
  figmaName: A股异动
  familyRole: supporting
  usedIn:
  - abnormal_sector_scan
  - market_index_signal_map
  allowedZones:
  - abnormal_sector_scan
  - market_index_signal_map
  forbiddenZones:
  - bottom_dock
  - news_list_item
  - generic_dashboard_card
  humanRules:
    do:
    - 用于大盘场景中的板块异动扫描区，承载板块标签、走势底图、时间轴和涨跌阈值阅读。
    - 右上角的热问开关作为独立 family 使用，需按深浅色变量切换。
    - 除热问开关外，其余结构必须使用规范色对应深色版和浅色版，不允许局部特殊色脱离标准 token。
    dont:
    - 不要把 A股异动 拆成普通标签流或通用图表卡。
    - 不要把热问开关混写成主模块内部的普通文本状态。
    - 不要改变红涨绿跌和蓝色走势线的金融语义。
  riskWarnings:
  - A股异动 模块同时承担信号扫描与行情结构表达，若颜色、轴线或标签语义错误会直接误导阅读。
  - 当前不复用到首页其他场景，应继续保持大盘私有 family。
- id: market-index.hot-question-toggle
  figmaNodeId: 23:17460
  componentKey: f07956989f78bf36f7db0980ceea901bbcef7f56
  figmaName: A股异动/热问开关
  familyRole: supporting
  usedIn:
  - abnormal_sector_secondary_toggle
  allowedZones:
  - abnormal_sector_scan
  forbiddenZones:
  - top_nav
  - bottom_dock
  - news_list_item
  humanRules:
    do:
    - 只作为 A股异动 右上角的局部开关使用。
    - 必须根据 dark=on/off 使用对应的开关变量和文字颜色。
    dont:
    - 不要扩展成页面级通用开关。
    - 不要脱离 A股异动 family 单独漂浮使用。
  riskWarnings:
  - 热问开关的深浅色变量已明确存在，不允许用近似样式替代真实变体。
  - 当前不复用到其他板块异动类模块，应保持为 A股异动 场景私有 family。
- id: market-index.barrage-panel
  figmaNodeId: 7:6304
  componentKey: cf254d3f385a8f67c0d72cca09a8804371a42f32
  figmaName: 弹幕
  familyRole: supporting
  usedIn:
  - market_index_signal_barrage
  - rolling_message_zone
  allowedZones:
  - market_index_signal_barrage
  - rolling_message_zone
  forbiddenZones:
  - bottom_dock
  - news_list_item
  - generic_dashboard_card
  humanRules:
    do:
    - 用于大盘场景中的辅助消息扫描区，承载弹幕区域内的自动滚动消息。
    - 区域内消息应在遮罩范围内自动滚动播放，保持双行错位的连续扫描感。
    - 单条消息必须引用独立的 `弹幕/消息` family，并区分 `普通` 与 `热点` 两种变量。
    - 使用规范色；热点消息中的热点标识使用标准红色语义。
    dont:
    - 不要把弹幕区域改成静态列表或普通标签墙。
    - 不要把单条消息直接写死在主模块里，跳过独立消息 family。
    - 不要让滚动内容超出遮罩区裸露显示。
  riskWarnings:
  - 弹幕区域承担快速辅助扫描角色，若滚动逻辑、遮罩或消息变体错误，会直接破坏可读性。
  - 当前不复用到首页其他场景，应继续保持大盘私有 family。
- id: market-index.barrage-chip
  figmaNodeId: 18:671
  componentKey: dce56f741cdde76c8ff3c27e5ffaca7a69c8b60f
  figmaName: 弹幕/消息
  familyRole: supporting
  usedIn:
  - barrage_message_chip
  allowedZones:
  - market_index_signal_barrage
  - rolling_message_zone
  forbiddenZones:
  - top_nav
  - bottom_dock
  - news_list_item
  humanRules:
    do:
    - 只作为弹幕区域中的单条消息使用。
    - 必须区分 `普通` 和 `热点` 两种消息变量。
    - "`热点` 变体需带热点图标和更强提示语义。"
    dont:
    - 不要把 `热点` 与 `普通` 混写成同一种普通文本样式。
    - 不要脱离弹幕区域单独当成通用 tag 使用。
  riskWarnings:
  - 单条消息虽然轻量，但热点与普通的语义差异明确，不能互换。
  - 当前不复用到其他滚动消息区，应保持为大盘弹幕场景私有 family。
- id: market-index.auction-panel
  figmaNodeId: 7:6305
  componentKey: eb51e27c77855c0da3c2d75c57084f868f333f9e
  figmaName: 竞价
  familyRole: supporting
  usedIn:
  - market_index_auction_read
  - market_index_opening_signal
  allowedZones:
  - market_index_auction_read
  - market_index_opening_signal
  forbiddenZones:
  - bottom_dock
  - news_list_item
  - generic_dashboard_card
  humanRules:
    do:
    - 用于大盘场景中的竞价金额与开盘信号阅读区。
    - 保持总金额、较上日变化、涨停跌停统计、进度条和底部对比信息的完整结构。
    - 必须使用规范色和标准 token，保持红涨绿跌金融语义。
    dont:
    - 不要简化成普通统计卡片或通用信息卡。
    - 不要改变涨停/跌停与红绿语义的对应关系。
    - 不要删除底部对比信息后只保留顶部汇总。
  riskWarnings:
  - 竞价模块涉及金额、涨跌停统计和强金融语义，任何红绿反转或数据层级混乱都会直接误导阅读。
  - 当前不复用到首页其他场景，应继续保持大盘私有 family。
- id: market-index.tab-strip
  figmaNodeId: 7:6306
  componentKey: fbf10f16cd65f78f3761bdc669b76bea7ef966cb
  figmaName: tab
  familyRole: supporting
  usedIn:
  - market_index_content_switch
  - market_index_news_filter
  allowedZones:
  - market_index_content_switch
  - market_index_news_filter
  forbiddenZones:
  - top_nav
  - bottom_dock
  - generic_dashboard_card
  humanRules:
    do:
    - 当前先按系统层组件占位引用写入，用于记录大盘场景中的 tab 结构和状态规则。
    - 系统层 tab 组件补齐后，应回填正式系统层绑定并替换当前占位写法。
    - 用于资讯流前的局部内容切换区，承载横向排列的多个 tab 胶囊。
    - 选中项与未选中项必须清晰区分，并跟随后续内容切换。
    - 深色版和浅色版都必须使用规范色和标准 token。
    dont:
    - 不要把 tab 区域改成顶部导航或普通按钮组。
    - 不要让选中态和未选中态的视觉差异消失。
    - 不要将 tab 顺序和内容映射自由改写。
  riskWarnings:
  - tab 模块直接决定资讯流的分类入口，状态映射或样式错误会造成内容理解偏差。
  - tab-strip 当前属于系统层级组件引用，后续需要回填正式系统层组件 id / 绑定路径。
