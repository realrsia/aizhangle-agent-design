- id: market-index.news-card
  figmaNodeId: 3:5704
  componentKey: e2a6f4fcf59d06d2b7b3ed4e4b9e5a30e38ec130
  figmaName: 资讯
  familyRole: supporting
  usedIn:
  - market_index_news_feed
  - market_index_opportunity_extension
  allowedZones:
  - market_index_news_feed
  - market_index_opportunity_extension
  forbiddenZones:
  - top_nav
  - bottom_dock
  - generic_dashboard_card
  humanRules:
    do:
    - 用于 tab 后的资讯流 family，按真实分类变体渲染不同样式。
    - 不同资讯类型必须保留各自的结构差异、信息密度和视觉样式。
    - 应引用独立的 `资讯/标题` 和 `资讯/提示` family，不要把标题变量写死在主组件里。
    dont:
    - 不要把不同类型压扁成统一卡片样式。
    - 不要混淆主资讯卡、标题变量和提示变量的归属。
    - 不要删除类型差异后只保留普通文本流。
  riskWarnings:
  - 资讯 family 类型很多，若误把不同分类渲染成同一种样式，会直接丢失信息层级和业务语义。
  - 目前保证不复用，应继续保持大盘私有 family。
- id: market-index.news-title
  figmaNodeId: 22:16610
  componentKey: 2d924e405d279a2a4318d4d59d966ed7d76a732c
  figmaName: 资讯/标题
  familyRole: supporting
  usedIn:
  - market_index_news_feed
  - market_index_opportunity_extension
  allowedZones:
  - market_index_news_feed
  forbiddenZones:
  - top_nav
  - bottom_dock
  - generic_dashboard_card
  humanRules:
    do:
    - 作为资讯条目标题 family 使用，必须区分单行/双行与深色版/浅色版。
    - 标题变量需要跟随资讯类型和主题变化，不得只维护单套样式。
    dont:
    - 不要把单行和双行标题混成一个固定高度样式。
    - 不要忽略 dark/light 造成标题颜色层级错误。
  riskWarnings:
  - 标题是资讯识别入口，若单行/双行或 dark/light 变量使用错误，会直接破坏阅读节奏。
  - 当前不复用到其他资讯流场景，应保持为大盘资讯场景私有 family。
- id: market-index.news-tip
  figmaNodeId: 22:16697
  componentKey: 0ae9ee8ac6e221c9f3bd0c790e2a28d5840dc346
  figmaName: 资讯/提示
  familyRole: supporting
  usedIn:
  - market_index_news_feed
  allowedZones:
  - market_index_news_feed
  forbiddenZones:
  - top_nav
  - bottom_dock
  - generic_dashboard_card
  humanRules:
    do:
    - 作为资讯条目旁的提示 family 使用，区分单条和多条状态。
    - 多条状态需要数量提示，单条状态只保留箭头提示。
    dont:
    - 不要把单条和多条提示做成同一种表现。
    - 不要把提示 family 扩展成主标签或正文内容。
  riskWarnings:
  - 提示 family 决定用户是否感知到聚合内容入口，单条/多条状态不可互换。
  - 当前不复用到其他资讯流场景，应保持为大盘资讯场景私有 family。
- id: market-index.scroll-guide
  figmaNodeId: 64:42977
  componentKey: ebb78f7166ea597992916cafa56e249e96397ab0
