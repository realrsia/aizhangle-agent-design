familyThemeRules:
- familyId: market-index.index-summary
  rule: 指数模块是单一 component；dark/light 属于场景主题映射规则，不是 Figma variant property。
  themeModes:
  - dark-theme
  - light-theme
- familyId: market-index.abnormal-a-share
  rule: A股异动主模块是单一 component；dark/light 属于场景主题映射规则，不是 Figma variant property。右上角热问开关另有真实
    dark 变体。
  themeModes:
  - dark-theme
  - light-theme
- familyId: market-index.auction-panel
  rule: 竞价模块是单一 component；dark/light 属于场景主题映射规则，不是 Figma variant property。
  themeModes:
  - dark-theme
  - light-theme
- familyId: market-index.tab-strip
  rule: tab 区域是单一 component；dark/light 属于场景主题映射规则，真实选中态与主题变体由 tab-pill 承担。
  themeModes:
  - dark-theme
  - light-theme
familyStructureRules:
- familyId: market-index.barrage-panel
  rule: 弹幕主区域是单一 component；双行是内部滚动结构，不是 Figma variant property。
  structuralRows:
  - auto-scroll-row-1
  - auto-scroll-row-2
familyThemeHumanRules:
- familyId: market-index.index-summary
  mode: dark-theme
  rule: dark 页面中指数名称、数值、涨跌幅和底部导航反馈都必须使用 dark 主题下的规范色与层级。
- familyId: market-index.index-summary
  mode: light-theme
  rule: light 页面中指数名称、数值、涨跌幅和底部导航反馈都必须切换到 light 主题下的规范色与层级。
- familyId: market-index.abnormal-a-share
  mode: dark-theme
  rule: dark 页面中 A股异动 的走势线、板块标签、坐标值和时间轴都必须使用 dark 主题下的规范金融颜色。
- familyId: market-index.abnormal-a-share
  mode: light-theme
  rule: light 页面中 A股异动 的走势线、板块标签、坐标值和时间轴都必须切换到 light 主题下的规范金融颜色。
- familyId: market-index.auction-panel
  mode: dark-theme
  rule: dark 页面中竞价模块的金额、涨停跌停、进度条和底部对比信息都必须使用 dark 主题下的规范金融颜色。
- familyId: market-index.auction-panel
  mode: light-theme
  rule: light 页面中竞价模块的金额、涨停跌停、进度条和底部对比信息都必须切换到 light 主题下的规范金融颜色。
- familyId: market-index.tab-strip
  mode: dark-theme
  rule: dark 页面中的 tab 区域必须使用 dark 主题下的规范色，并保持选中项与未选中项的明确区分。
- familyId: market-index.tab-strip
  mode: light-theme
  rule: light 页面中的 tab 区域必须切换到 light 主题下的规范色，并保持选中项与未选中项的明确区分。
familyVariantHumanRules:
- familyId: market-index.title-block
  variant: dark=on
  rule: 用于 dark 页面标题区，标题“大盘”和状态“交易中”应保持深色主题下的渐变文字表达。
- familyId: market-index.title-block
  variant: dark=off
  rule: 用于 light 页面标题区，标题与状态应使用浅色主题对应的标准文字色，不替换成自定义颜色。
- familyId: market-index.hot-question-toggle
  variant: dark=on
  rule: dark 页面里热问开关必须使用 dark 变量对应的背景、文字和红点提示。
- familyId: market-index.hot-question-toggle
  variant: dark=off
  rule: light 页面里热问开关必须切换到 light 变量对应的背景、文字和红点提示。
- familyId: market-index.barrage-chip
  variant: Property 1=普通
  rule: 普通消息用于常规问句或辅助提示，不带热点图标，语义权重低于热点消息。
- familyId: market-index.barrage-chip
  variant: Property 1=热点
  rule: 热点消息用于高关注提示，必须带热点图标和红色热点语义，不得退化成普通消息样式。
- familyId: market-index.tab-pill
  variant: 选中态=On, 场景=变体/历史记录标签, Dark=On
  rule: dark 页面中的选中胶囊需使用主红色系边框/底色和更高字重。
- familyId: market-index.tab-pill
  variant: 选中态=Off, 场景=变体/历史记录标签, Dark=On
  rule: dark 页面中的未选中胶囊需使用次级底色和次级文字色。
- familyId: market-index.tab-pill
  variant: 选中态=On, 场景=变体/历史记录标签, Dark=Off
  rule: light 页面中的选中胶囊需保持与 dark 对应的选中语义，但切换到 light 主题规范色。
- familyId: market-index.tab-pill
  variant: 选中态=Off, 场景=变体/历史记录标签, Dark=Off
  rule: light 页面中的未选中胶囊需切换到 light 主题下的次级底色和文字色。
- familyId: market-index.news-card
  variant: 分类=板块
  rule: 板块类资讯需保留主力净流入、榜单和板块结构，不得退化成普通摘要。
- familyId: market-index.news-card
  variant: 分类=华泰观市
  rule: 华泰观市需保留技术论市/作者信息/正文摘要结构。
- familyId: market-index.news-card
  variant: 分类=行情异动
  rule: 行情异动需保留时间线、多条异动条目和异动解读结构。
- familyId: market-index.news-card
  variant: 分类=专属内容
  rule: 专属内容需保留个性化摘要表达，不应混成普通资讯卡。
- familyId: market-index.news-card
  variant: 分类=行情速览
  rule: 行情速览需保留速览总结和信号打点，不应改成长文样式。
- familyId: market-index.news-card
  variant: 分类=事件捕手
  rule: 事件捕手需保留事件标签、传导链路和标的滚动结构。
- familyId: market-index.news-card
  variant: 分类=市场要闻
  rule: 市场要闻需保留时间、标题和摘要结构，不应混入速览打点。
- familyId: market-index.news-title
  variant: 单行=on, dark=on
  rule: dark 单行标题用于简洁标题，使用深色主题下标题色。
- familyId: market-index.news-title
  variant: 单行=on, dark=off
  rule: light 单行标题用于简洁标题，切换到浅色主题下标题色。
- familyId: market-index.news-title
  variant: 单行=off, dark=on
  rule: dark 双行标题用于更复杂的标题+副信息组合，保持深色主题层级。
- familyId: market-index.news-title
  variant: 单行=off, dark=off
  rule: light 双行标题用于更复杂的标题+副信息组合，切换到浅色主题层级。
- familyId: market-index.news-tip
  variant: 状态=单条
  rule: 单条提示仅保留箭头提示，不显示数量。
- familyId: market-index.news-tip
  variant: 状态=多条
  rule: 多条提示需显示数量和箭头，明确表示聚合入口。
- familyId: market-index.scroll-guide
  variant: dark=On
  rule: dark 首屏中滑动引导固定出现在卡片底部上方 1 个间距高度，用户滑动后消失。
- familyId: market-index.scroll-guide
  variant: dark=Off
  rule: light 首屏中滑动引导固定出现在卡片底部上方 1 个间距高度，用户滑动后消失。

