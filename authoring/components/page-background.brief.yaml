variantSelectionRules:
  routeDepthFallback:
    level1: page-background.level-1-pair
    level2: page-background.level-2-pair
    level3Plus: page-background.level-3-plus-pair
  themeFallback:
    dark: Dark=On
    light: Dark=Off
  stopConditions:
    - 页面明确属于 KYC、Agent、临时对话浮层、通栏卡片、非通栏卡片、旧版页面或大片时，停止使用本 brief 的三类新版背景规则。
    - Figma usage instance 与人工页面层级规则冲突时，先标记人工复核，不直接改写规则。
    - 页面需要非 390x844 背景尺寸时，先标记扩展需求，不用拉伸替代。

