# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.page-background
name: 页面背景
owner: design-system
status: draft

purpose: >
  用于新涨乐页面级背景还原与生成。当前新增只覆盖三类新版页面背景：
  一级页面背景、二级页面背景、三级及更深层页面背景，并保持黑白版一一对应。

usedIn:
  - primary-workspace-page
  - secondary-business-page
  - ai-chat-flow-page
  - stock-detail-page
  - trading-page
  - my-page
  - account-page
  - system-settings-page
  - trading-function-settings-page
  - tertiary-or-deeper-page

humanRules:
  do:
    - 按页面层级选择背景，而不是用近似纯色或截图重画。
    - 一级页面使用 `分类=新版工作区/一级`。
    - AI Chat 对话流、个股详情、交易、我的、账户等二级页面使用 `分类=新版二级页`。
    - 系统设置、交易功能设置，以及三、四、五级页面使用 `分类=新三级页`。
    - 黑版使用 `Dark=On`，白版使用 `Dark=Off`；同一页面层级的黑白版必须一一对应。
    - 背景应作为页面根层底图，位于导航、内容、底栏、浮层之下。
  dont:
    - 不要把 `KYC`、`Agent`、`临时对话浮层`、卡片背景、旧版背景纳入本次新增范围。
    - 不要把页面示例 frame、截图或 demo 误写成新的 component family。
    - 不要用普通矩形、渐变色块或截图背景替代正式 Figma 背景组件。
    - 不要在本次只做 authoring 新增时扩展到 Agent 流程、canon、checklist、renderer 或 binding 产物。

riskWarnings:
  - id: page-background-wrong-hierarchy
    severity: P0
    rule: 页面层级背景选错会明显影响测试还原效果，尤其是 AI Chat、交易、我的、账户等二级页面。
  - id: page-background-theme-mismatch
    severity: P0
    rule: 黑白版必须使用同一 `分类` 下的 `Dark=On/Off` 配对，不得跨分类混用。
  - id: page-background-example-vs-component
    severity: P1
    rule: 示例页面只能作为使用实例，不得反向覆盖真实背景组件的 family 和 variant 定义。

layoutContract:
  zIndex:
    semanticLayer: bottom-page-shell-layer
    rule: 页面背景是 page root 的最底层结构，只负责承载页面氛围和底色，不参与内容交互。
    allowedAbove:
      - top_nav
      - scroll_content_body
      - bottom_bar
      - modal_or_sheet_when_explicitly_opened
      - toast_or_alert_when_explicitly_opened
    forbiddenAbove:
      - unrelated_background_fill
      - screenshot_overlay
      - hand_drawn_gradient_mask
      - opacity_cover
      - blur_cover
  size:
    canonicalViewport:
      width: 390
      height: 844
    rule: 新版工作区/一级、新版二级页、新三级页背景默认按 390x844 页面底图使用；特殊浮层、卡片和旧版背景不属于本次新增范围。
    cropPolicy: 不裁切为卡片背景，不拉伸为非 390 宽度的通用装饰层；确需适配长页时由后续 canon/checklist 明确扩展。
  theme:
    property: Dark
    darkValue: "On"
    lightValue: "Off"
    rule: Dark=On/Off 是正式主题配对，不是临时色值差异；同一页面层级必须使用同一分类下的主题配对。

allowedZones:
  - page_background
  - app_shell_background
  - page_root
  - workspace_page_root
  - secondary_page_root
  - tertiary_page_root

forbiddenZones:
  - content_card
  - message_feed
  - bottom_bar
  - top_nav
  - modal_body
  - screenshot_layer

requiredPairings:
  - matching-page-hierarchy
  - matching-theme-dark-on-or-off

forbiddenPairings:
  - hand_drawn_solid_rect
  - screenshot_background
  - old-page-background-variant
  - agent-background-variant
  - kyc-background-variant
  - temporary-dialog-background-variant

examples:
  good:
    - name: 一级页面 / 黑白配对
      reason: "`分类=新版工作区/一级`，按主题分别使用 `Dark=On` 与 `Dark=Off`。"
    - name: AI Chat、交易、我的、账户二级页面
      reason: 使用 `分类=新版二级页`，避免把二级页面套成一级工作区背景。
    - name: 系统设置与深层设置页
      reason: 使用 `分类=新三级页`，与更深层页面层级一致。
  bad:
    - name: 用白版一级页背景生成交易二级页
      reason: 页面层级错误，测试时会出现背景氛围和层级不一致。
    - name: 把 Figma 示例页面登记成 component family
      reason: 示例页面只是 usage instance，真实 family 是 `背景/母组件`。

componentHumanRules:
  ruleScope: page-background-component-set
  appliesTo:
    figmaPage: 通用
    figmaSection: 2.2 页面背景
    componentId: component.page-background
    confirmedFamilyCount: 1
    confirmedVariantCountThisTask: 6
  definition: >
    `背景/母组件` 是当前真实背景 component set；本次只维护其中三类新版页面背景及黑白配对。
  humanEditableFields:
    - purpose
    - usedIn
    - humanRules
    - riskWarnings
    - layoutContract
    - allowedZones
    - forbiddenZones
    - requiredPairings
    - forbiddenPairings
    - examples
    - componentHumanRules
    - extensionModel
    - scenarioTaxonomy
  do:
    - "`componentFamilies` 只登记真实 Figma 母组件。"
    - 三类新增背景作为同一 component family 下的 variant rules 维护。
    - 示例页面、测试页面和截图参考只进入 `usageInstanceGroups`。
    - 页面层级归类优先使用人工明确规则；没有明确规则时再看 Figma 使用实例，不用视觉相似度硬推断。
  dont:
    - 不要为每张页面示例新增独立组件。
    - 不要把未纳入本次范围的 `Agent` 背景扩展进本 brief。
    - 不要把 `component.page-background` 与已有 `component.chat-background` 强行合并；前者维护新版通用页面背景，后者仍是 AI Chat 专项历史入口。
  sourceBoundary:
    componentTruth: 背景/母组件 component set 与其 variant properties。
    usageTruth: 下方页面 frame 和实例只作为 usageInstanceGroups 证据。
    excludedTruth:
      - KYC 背景
      - Agent 背景
      - 临时对话浮层背景
      - 通栏/非通栏卡片背景
      - 旧一级页/旧二级页背景
      - 大片背景

extensionModel:
  mode: authoring-only
  principle: >
    本 brief 是背景组件在人类输入层的结构入口。`componentFamilies` 只记录真实 Figma 母组件；
    `variantGroups` 和 `familyVariantHumanRules` 记录本次确认的三类新版背景及黑白配对；
    `scenarioTaxonomy` 记录页面层级归类；`usageInstanceGroups` 记录示例页面，不反向定义组件。
  scopeThisTask:
    - authoring/components/page-background.brief.yaml
    - authoring/components/index.yaml
  skippedByUserRequest:
    - Agent expansion flow
    - canon component expansion
    - checklist expansion
    - bindings expansion
    - renderer expansion
  addNewComponentFamilyWhen:
    - Figma 页面背景区域新增了另一个真实 component set 或可复用背景母组件。
    - 新对象拥有独立 variant property 或独立使用边界，不能归入 `背景/母组件`。
  requiredForNewComponentFamily:
    - familyId
    - figmaNodeId
    - figmaExactName
    - componentKey
    - familyType
    - usedIn
    - allowedZones
    - forbiddenZones
    - humanRules
  addNewFamilyVariantWhen:
    - "`背景/母组件` 中新增了真实 variant，且属于本次通用页面背景范围。"
    - 现有三类页面层级规则发生变化，需要新增或替换 variant。
  requiredForNewFamilyVariant:
    - familyId
    - variantId
    - figmaNodeId
    - figmaExactName
    - componentKey
    - variantProperties
    - humanUse
  addUsageInstanceWhen:
    - 设计师选中了真实页面 frame、prototype、截图参考或测试页面。
    - 该页面能帮助判断背景在一级、二级、三级及更深页面中的使用位置。
  requiredForUsageInstance:
    - frameNodeId
    - frameName
    - backgroundInstanceNodeId
    - observedVariant
    - usagePurpose
  expansionReadiness:
    authoringReady: true
    canonReady: false
    bindingReady: false
    checklistReady: false
    note: 当前只补齐 authoring 结构；后续是否扩展到 canon/bindings/checklist 由人工确认。

scenarioTaxonomy:
  hierarchyDecisionOrder:
    - explicit-human-page-assignment
    - route-or-navigation-depth
    - confirmed-figma-usage-instance
    - visual-inference-with-review-required
  pageLevels:
    - id: page-background.level-1
      variantCategory: 新版工作区/一级
      meaning: 一级页面和新版工作区首页背景。
      typicalPages:
        - 早点听首页
        - 盘前首页
        - 其他 APP 首页体系入口页
      forbiddenPages:
        - AI Chat 对话流
        - 交易页
        - 我的页
        - 账户页
        - 系统设置页
    - id: page-background.level-2
      variantCategory: 新版二级页
      meaning: 从一级页面进入后的核心业务页面背景。
      typicalPages:
        - AI Chat 对话流
        - 个股详情
        - 交易
        - 我的
        - 账户
      forbiddenPages:
        - 新版工作区一级首页
        - 系统设置页
        - 三、四、五级深层设置页
    - id: page-background.level-3-plus
      variantCategory: 新三级页
      meaning: 设置、管理、交易功能设置和三、四、五级页面背景。
      typicalPages:
        - 系统设置
        - 交易功能设置
        - 自选管理
        - 编辑分组
      forbiddenPages:
        - 一级首页
        - 常规二级核心业务页

