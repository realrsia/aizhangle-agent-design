# ============================================================
# 01_HUMAN_REQUIRED
# 人工必填区
# ============================================================

id: component.switch
name: 开关与选择控件
owner: design-system
status: draft

# [HUMAN REQUIRED]
purpose: >
  用于表达持久状态、选中状态或选项选择，包括 Switch、Segmented Switch、
  Checkbox、Radio 和图标状态切换。它是状态控制，不是动作按钮。

# [HUMAN REQUIRED]
usedIn:
  - setting-list
  - selection-list
  - filter-option-group
  - toolbar-state-toggle

# [HUMAN REQUIRED]
humanRules:
  do:
    - 先按列表结构判断 subtype，再匹配图标或文案语义。
    - 一个选项组只能使用一种选择模型。
    - 只有 segmented switch 可以在控件内部包含文字。
  dont:
    - 不要用普通按钮规则样式化 switch、checkbox、radio 或 icon toggle。
    - 不要在同一问题或选项组内混用 radio 和 checkbox。
    - 不要给 switch track、checkbox 或 radio 发明内部文字和额外图标。

# [HUMAN REQUIRED]
riskWarnings:
  - 错误选择模型会让用户无法判断单选、多选或持久状态。

# [HUMAN REQUIRED]
allowedZones:
  - setting_row_control_area
  - selection_option_group
  - filter_panel_option_area
  - toolbar_state_area

# [HUMAN REQUIRED]
forbiddenZones:
  - primary_action_area
  - trading_order_submit_area

# [HUMAN REQUIRED]
requiredPairings:
  - state-label-or-option-context

# [HUMAN REQUIRED]
forbiddenPairings:
  - ordinary-button-action
  - mixed-selection-model

# [HUMAN REQUIRED]
examples:
  good:
    - name: switch-system-matrix
      reason: 覆盖 switch、checkbox、radio、segmented 和 icon toggle；以 canon 和 Figma component binding 为准，不依赖本地截图。
  needsReview: []
  bad:
    - name: 用按钮样式表现开关状态
      reason: 动作按钮和状态控件语义不同。

