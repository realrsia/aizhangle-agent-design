interface:
  display_name: "XZL Fusion Design System"
  short_description: "融合新涨乐与 AI Zhangle 设计系统规则"
  default_prompt: |
    生成或评审新涨乐 / AI Zhangle 移动金融界面时，以本仓库为唯一事实来源。

    1. 读取顺序
       - 先按 SKILL.md 和 manifest.json 做路由。
       - 遵循 DESIGN.md 的视觉语言。
       - 读取相关 authoring、canon、Figma bindings、assets 和 checklists。

    2. Binding 规则
       - 只有 binding 已确认时才生成。
       - 如果 Figma component binding 缺失，或仍标记为 TODO_VERIFY_WITH_FIGMA，不要猜测。
       - 不要伪装成已绑定组件；应标记为 pending，或停止等待补齐绑定信息。

    3. 硬性禁止
       - 禁止为了“看起来像”而自定义绘制已有组件，例如 Button、Input、Switch、Tabs、Tag、Card、Top Bar、Bottom Bar、Chat Input、Action Sheet 等。
       - 禁止用 raw frame、rectangle、line、icon 或 text 拼出 confirmed Component 的 lookalike。
       - 禁止在未读取 Figma bindings 和 component brief 前直接开始画页面。
       - 禁止把未绑定模块画成高保真组件；fallback 必须低保真，并明确标注 “未绑定组件” 或 “binding pending”。
       - 如果违反以上任一条，本次生成视为失败，必须先返工修复，再交付。

    4. Component 优先级
       - Figma 生成必须优先使用已构建的 Components。
       - 只要已有 confirmed Component，就不要用 raw frame、rectangle 或 text 重画 lookalike。
       - 如果某个控件家族已有 confirmed binding，必须优先 import、instantiate 或 clone。
       - 只有当组件不存在、权限阻断、字体阻断且无法保留实例结构时，才允许 fallback。
       - 如果页面所需的 confirmed Component 没有被使用，且没有记录经过 import、字体修复、clone 三步后的真实阻断，本次生成视为失败。
       - Status Bar、Top Bar、Bottom Bar、Chat Input、Action Sheet 这类固定 chrome 若在目标页面应出现，缺失即视为失败；不能用“简化页面”替代。
       - 创建的 frame 如果是黑板 / 深色稿，它里面所有组件、clone、nested instance 都必须使用 dark / 黑板主题变量模式；创建的 frame 如果是白板 / 浅色稿，则内部所有组件必须使用 light / 白板主题变量模式。
       - 禁止在同一个黑板父级 frame 内混入 light 组件，或在白板父级 frame 内混入 dark 组件；发现混用必须先切换变量 mode 或替换正确 variant 后再交付。

    5. Auto Layout 规则
       - 每个 screen、module、card、list row、bottom area 和承载文字的容器都要使用 Auto Layout。
       - 卡片内容应根据内容和 padding 自适应伸缩，不要依赖固定手工坐标。
       - 移动端 frame 可从 390px 宽开始，但页面高度不必固定为 844px；当场景需要滚动内容时，允许 frame 纵向增长。
       - Status Bar、Top Bar、Bottom Bar / Chat Input 等固定 chrome 应独立放在顶部或底部，不要混入普通内容流。
       - 内容区可以用多层 Auto Layout 承载 section、card、row 和内部 module。
       - 任何包含 Instance 的 Auto Layout wrapper，高度都必须大于或等于内部 Instance，避免组件被裁切。

    6. 内容规则
       - 生成屏幕主体里不要留下占位、提示或说明文案，例如重复 dummy 字符、泛化标签、未解析 prompt。
       - 应基于页面的意图识别，填入真实感金融、新闻或对话内容，保证页面可读。

    7. Fallback 与说明位置
       - 若必须使用未绑定模块，应绘制明确低保真的 fallback block。
       - fallback 图层名或模块标识中必须写 “未绑定组件”，不要假装它是真实组件。
       - 视觉说明、交互说明、binding 报告和 review 注释不要放进屏幕主体。
       - 这些说明统一放到屏幕右侧的 annotation card。

    8. 交付前失败条件
       - 如果页面里出现自绘控件 lookalike、未标注 fallback、主题错、组件裁切、占位文案、raw TODO marker，视为未完成。
       - 如果 component coverage report 显示 confirmed Component 未被使用，视为未完成。
       - 如果 HTML 版本没有复用、导出或等价还原 Figma 中的 confirmed Component rendering，视为未完成。
       - 如果黑板 frame 中存在 light 主题组件，或白板 frame 中存在 dark 主题组件，视为未完成。
       - 发现失败条件时，必须先修复并重新验证 metadata 和 screenshot，再汇报。
  component_first_figma_generation_prompt: |
    Figma 视觉生成时，优先使用目标 Figma 文件中已有的 Components。

    1. 生成前检查
       - 先读取相关本地 scenario/component brief 和 Figma component bindings。
       - 列出每个页面应该使用的 component families。
       - 对每个将使用的 confirmed component key 做一次小型 import/instantiate probe。
       - 确认返回的 component properties 包含目标 light/dark variant。

    2. 生成前硬门禁
       - 未列出每个页面的 component families 前，不允许开始绘制页面。
       - 未生成 component coverage report 前，不允许开始绘制页面；报告必须包含 required / optional / confirmed / partial / pending / used / blocker。
       - 未完成 confirmed component key 的 import/instantiate probe 前，不允许创建最终 screen。
       - 未确认 light/dark variant 前，不允许放置组件或 clone。
       - 如果某个必要组件仍是 TODO_VERIFY_WITH_FIGMA，必须降级为 “binding pending” fallback，或停止等待补齐绑定。
       - 如果某个必要组件已有 confirmed binding，但最终页面未出现对应 Instance 或 clone，本次生成必须返工。

    3. 自绘控件禁止清单
       - 禁止自绘 Button、Input、Switch、Tabs、Tag、Card、Top Bar、Bottom Bar、Chat Input、Action Sheet、Message Feed 等控件家族。
       - 禁止用 rectangle/text/icon 组合出 confirmed Component 的 lookalike。
       - 禁止把 fallback 做成无法区分真组件的高保真控件。
       - 如果确实需要 fallback，图层名必须包含 “未绑定组件” 或 “binding pending”，并在右侧 annotation 写明原因。

    4. 组件使用规则
       - 页面应通过 import、instantiate 或 clone confirmed Components 来搭建。
       - 必须选择正确 variant，并显式确认 light/dark variable mode。
       - 只要 existing Component 可用，就不要用 rectangle 或 text 重画 component lookalike。
       - Bottom Bar、Top Bar、Action Sheet、Chat Input 等固定 chrome 是页面结构的一部分；目标场景需要时必须存在真实 Instance 或 clone。
       - 目标 Figma 文件里的既有 frame 只能作为参考；复用任何结构前，都要检查是否存在 wrong variant、clipped clone 或 placeholder text。

    5. 字体兼容
       - 如果因字体或权限导致 Component 无法 instantiate 或 append，先尝试保留真实 component instance。
       - 放置前可把实例内部文字字体覆盖为项目当前可用字体。
       - 字体阻断时必须按顺序尝试：
         1. import 后在临时 frame 中 instantiate。
         2. 读取并加载当前 text fonts；无法加载时，将内部中文改为 Noto Sans SC，数字改为 Noto Sans HK。
         3. 从目标文件已有的同 variant 正常实例 clone。
         4. 三步都失败后，才允许 fallback，并在 annotation 写明 blocker。
       - 由于当前 Figma 用户体系未开通商业版或团队版，引用字体无法上传云端。
       - 目前解决方式：
         - 中文文字使用 Noto Sans SC。
         - 数字文字使用 Noto Sans HK。

    6. Clone 与 fallback
       - 只有在能够保留结构时才 clone confirmed Component。
       - 如果无法保留结构，使用清晰标注的 “未绑定组件” 或 “binding pending” fallback module。
       - fallback 原因写到右侧 annotation panel。

    7. Partial component 处理
       - partial component 只使用已确认部分。
       - 示例：modal mask 已确认，但 body text override targets 仍 pending 时：
         - 使用 confirmed mask。
         - 创建明确标注的 fallback body。
         - 不要强行把业务文案写进未验证 component。
         - 不要重画 component lookalike。

    8. 主题要求
       - 主题是硬要求。
       - 最终交付前，必须确认每个 component clone 或 instance 都解析到要求的 light/dark mode。
       - 如果父级的frame是light/dark mode，它里面的组件就不允许出现相反的模式。
       - 如果创建的 frame 是黑板 / 深色稿，则该 frame 内所有 Components、clones、nested instances 都必须切到 dark / 黑板主题变量 mode。
       - 如果创建的 frame 是白板 / 浅色稿，则该 frame 内所有 Components、clones、nested instances 都必须切到 light / 白板主题变量 mode。
       - 不能只看外层 frame 背景色；必须检查右侧变量面板或 Plugin API 返回的 explicitVariableModes / resolved variables，确认内部组件没有沿用相反主题。
       - 从旧页面 clone 组件时，clone 完成后必须按新父级 frame 的黑板/白板属性重新确认并修正变量 mode。

    9. 屏幕与 annotation 边界
       - 生成屏幕主体中不要放说明、binding 报告或 review 注释。
       - 这些内容统一放在屏幕右侧。

    10. 最终验证
       - 生成后必须检查 Figma metadata 和 screenshot rendering。
       - 必须输出或记录 component coverage report，并确认每个 required confirmed Component 都已 used。
       - HTML 版本必须来自 corrected Figma output 的导出、截图或同一组件 renderer；禁止对 confirmed Components 重新写一套 CSS 近似稿。
       - 必须扫描每个 screen 的 frame 主题和内部组件主题；黑板 frame 内出现 light mode、白板 frame 内出现 dark mode，必须先修。
       - 扫描生成屏幕、nested imported instances 和 annotation cards，确认不存在：
         - 占位文案。
         - 未解析 prompt marker。
         - raw TODO marker。
         - wrong theme variant。
         - clipped instance。
         - component lookalike。
         - 自绘控件伪装成真实组件。
         - 形似 Button/Input/Switch/Tabs/Tag/Card 但未使用 Instance、clone 或明确 fallback 标注的节点。
       - annotation 中缺失 binding 的说明应写成 “binding pending” 或 “text override pending”，不要保留 raw TODO marker。
       - 所有问题修复后再汇报。
