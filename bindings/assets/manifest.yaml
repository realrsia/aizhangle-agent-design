id: binding.assets.manifest
kind: asset-manifest
schemaVersion: 1
version: 0.1.0
status: draft
title: Local Asset Manifest
summary: Local asset binding layer for assets copied into this repository.
basePath: bindings/assets/files
sourceRefs:
  - bindings/assets/files
pathAliases:
  - alias: assets/tokens/
    resolvesTo: bindings/assets/files/design-tokens/
    reason: Some component briefs keep legacy asset aliases; resolve them to local copied files.
  - alias: assets/templates/
    resolvesTo: bindings/assets/files/templates/
    reason: Some component briefs keep legacy asset aliases; resolve them to local copied files.
assetGroups:
  - id: design-tokens
    kind: token-source
    path: design-tokens/
    useFor:
      - token-provenance
      - component-token-source
  - id: templates
    kind: template
    path: templates/
    useFor:
      - checklist-source
      - component-module-contract
  - id: icons
    kind: icon
    path: icons/
    useFor:
      - component-icon-binding
      - header-and-table-tools
  - id: bottom-bar
    kind: component-assets
    path: bottom-bar/
    useFor:
      - bottom-bar-backgrounds
      - bottom-bar-icons
  - id: top-bar-watchlist-tabs
    kind: component-assets
    path: top-bar/watchlist-tabs/
    useFor:
      - watchlist-tab-backgrounds
      - html-runtime-maintenance
  - id: page-background
    kind: component-assets
    path: page-background/
    useFor:
      - primary-page-background
      - html-runtime-maintenance
  - id: fonts
    kind: font
    path: fonts/
    useFor:
      - financial-numeric-font
  - id: radius-tokens
    kind: token-source
    path: design-tokens/radius-tokens.json
    useFor:
      - radius-token-provenance
      - migration-check
  - id: typography-scale
    kind: template
    path: templates/page-typography-scale.json
    useFor:
      - typography-token-provenance
      - page-type-scale-reference
resourceRefs:
  - id: asset.font.zlcft.regular
    type: local-asset
    locator: bindings/assets/files/fonts/ZLCaiFuTi-Regular.ttf
  - id: asset.template.page-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/page-output-checklist.json
  - id: asset.template.button-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/button-output-checklist.json
  - id: asset.tokens.button
    type: local-asset
    locator: bindings/assets/files/design-tokens/button-tokens.json
  - id: asset.tokens.tag
    type: local-asset
    locator: bindings/assets/files/design-tokens/tag-tokens.json
  - id: asset.tokens.switch
    type: local-asset
    locator: bindings/assets/files/design-tokens/switch-tokens.json
  - id: asset.tokens.mapping
    type: local-asset
    locator: bindings/assets/files/design-tokens/token-mapping.json
  - id: asset.tokens.radius
    type: local-asset
    locator: bindings/assets/files/design-tokens/radius-tokens.json
    role: token-provenance
  - id: asset.tokens.chat-fidelity
    type: local-asset
    locator: bindings/assets/files/design-tokens/chat-fidelity-tokens.json
    role: ai-chat-fidelity-token-source
    sourceRefs:
      - authoring/components/message-feed.brief.yaml
      - authoring/scenarios/ai-chat.brief.yaml
  - id: asset.template.tag-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/tag-output-checklist.json
  - id: asset.template.switch-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/switch-output-checklist.json
  - id: asset.template.bottom-bar-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/bottom-bar-output-checklist.json
  - id: asset.template.trading-input-component
    type: local-asset
    locator: bindings/assets/files/templates/trading-input-component.json
  - id: asset.template.trading-order-form-inputs
    type: local-asset
    locator: bindings/assets/files/templates/trading-order-form-inputs.json
  - id: asset.template.trading-input-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/trading-input-output-checklist.json
  - id: asset.template.page-typography-scale
    type: local-asset
    locator: bindings/assets/files/templates/page-typography-scale.json
    role: typography-reference
  - id: asset.template.radius-output-checklist
    type: local-asset
    locator: bindings/assets/files/templates/radius-output-checklist.json
    role: checklist-source
  - id: icon.search-outlined
    type: local-asset
    assetKind: icon
    locator: bindings/assets/files/icons/search-outlined.svg
    role: offline-reference
    canonicalWhen:
      - html-prototype
      - local-static-preview
    notCanonicalFor:
      - figma-component-instance
  - id: template.bottom-bar
    type: local-asset
    assetKind: json-template
    locator: bindings/assets/files/templates/bottom-bar-component.json
    role: module-contract
    useFor:
      - html-prototype
      - checklist-evidence
      - offline-generation
    figmaReplacement:
      required: true
      bindingId: component.bottom-bar
