$schema: https://json-schema.org/draft/2020-12/schema
title: XZL Component Brief
type: object
required:
  - id
  - name
  - owner
  - status
  - purpose
  - usedIn
  - humanRules
  - figma
  - classification
  - reviewChecklist
  - agentExpansion
properties:
  id:
    type: string
    pattern: "^component\\.[a-z0-9-]+$"
  name:
    type: string
  owner:
    type: string
  status:
    enum:
      - draft
      - review
      - stable
      - deprecated
  purpose:
    type: string
  usedIn:
    type: array
    items:
      type: string
  humanRules:
    type: object
    required:
      - do
      - dont
  figma:
    type: object
    required:
      - componentKey
      - bindingMode
      - bindingFailurePolicy
  classification:
    type: object
    required:
      - primitiveFamily
      - componentType
      - riskLevel
  reviewChecklist:
    type: array
  agentExpansion:
    type: object
