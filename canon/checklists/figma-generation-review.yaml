id: checklist.figma-generation-review
kind: checklist
schemaVersion: 1
version: 0.1.0
status: draft
title: Figma Generation Review Checklist
summary: Second-pass checklist for Figma screens generated by Agents, especially the
  hard Figma generation constraints defined in SKILL.md.
appliesTo:
  archetypes:
  - archetype.mobile-chat-page
  - archetype.mobile-list-page
  - archetype.market-overview-page
  scenarios:
  - scenario.ai-chat
  - scenario.watchlist
  components:
  - component.action-sheet
  - component.bottom-bar
  - component.chat-background
  - component.chat-input
  - component.chat-topbar
  - component.message-feed
  - component.page-background
  - component.trading-action-button
  - component.trading-input
  - component.trading-page-modules
rules:
- id: route-before-generation
  severity: error
  target: figma-generation-process
  assert:
    manifestLoaded: true
    designEntrypointLoaded: true
    relevantAuthoringCanonBindingsLoaded: true
    generationStartedOnlyAfterRouting: true
  rationale: Figma generation must not start before routing through the repository
    source of truth.
  sourceRefs:
  - SKILL.md
  - manifest.json
  - DESIGN.md
  autofix:
    strategy: stop-load-required-sources-and-regenerate
- id: component-coverage-report-required
  severity: error
  target: component-coverage-report
  assert:
    requiredOptionalConfirmedPartialPendingUsedBlockerReported: true
    requiredConfirmedComponentsAllUsedOrBlocked: true
    blockersRecordedBeforeFallback: true
  rationale: A generation cannot be reviewed reliably without knowing which required
    components were used, pending, or blocked.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  autofix:
    strategy: produce-coverage-report-and-regenerate-missing-components
- id: component-source-evidence-required
  severity: error
  target: component-source-evidence
  assert:
    everyConfirmedComponentHasSourceEvidence: true
    sourceEvidenceIncludes:
    - componentFamily
    - bindingStatus
    - componentKeyOrSourceNodeId
    - usageMethod
    - blockerWhenNotUsed
    acceptedUsageMethods:
    - imported_component_key
    - source_instance_clone
    - same_source_real_instance_clone
    fallbackRequiresBlocker: true
  rationale: Confirmed component usage is only valid when the generated frame can
    prove the source component or source instance it used.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  autofix:
    strategy: import-source-component-or-record-blocker-before-fallback
- id: component-key-probe-before-generation
  severity: error
  target: figma-generation-process
  assert:
    componentFamilyMapCompletedBeforeMainScreenMutation: true
    everyConfirmedFamilyHasKeyProbeResult: true
    probeResultIncludes:
    - familyId
    - componentKeyOrComponentSetKey
    - importApi
    - intendedVariantOrTheme
    - status
    - blockerIfFailed
    requiredConfirmedProbeFailureStopsDelivery: true
    noHighFidelityFallbackAfterProbeFailure: true
  rationale: From-scratch generation must still use existing ComponentsKey. A failed
    import probe does not permit drawing a polished lookalike screen from raw frames.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  autofix:
    strategy: build-component-family-map-run-key-probes-and-stop-on-required-failures
- id: all-fallback-screen-forbidden
  severity: error
  target: figma-component-usage
  assert:
    screenNotPrimarilyRawFallbackWhenConfirmedComponentsExist: true
    fixedChromeNotFallbackWhenConfirmedBindingExists: true
    messageFeedVerifiedChildrenNotFallbackWhenKeysExist: true
    requiredConfirmedComponentsImportedOrDeliveryBlocked: true
    annotationCannotDowngradeP0ComponentFailureToPass: true
  rationale: A complete-looking screen made mostly from fallback frames hides the
    fact that the design system was not actually used.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  - canon/components/message-feed.meta.yaml
  autofix:
    strategy: replace-fallback-lookalikes-with-component-key-imports-or-mark-output-nonfinal
- id: generated-frame-clone-not-counted-as-component
  severity: error
  target: component-source-evidence
  assert:
    generatedEvalFrameCloneIsReferenceOnly: true
    priorGeneratedFrameCloneDoesNotCountAsConfirmedUsage: true
    generatedRepairFrameCloneDoesNotCountAsConfirmedUsage: true
    componentUsageMustTraceToOriginalSource: true
  rationale: Cloning previous evaluation outputs can preserve a look, but it does
    not prove that the agent routed to the original design-system component.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  autofix:
    strategy: replace-generated-clone-with-component-key-import-or-source-instance-clone
- id: confirmed-components-not-redrawn
  severity: error
  target: figma-component-usage
  assert:
    confirmedComponentsUseInstanceCloneOrImport: true
    forbidRawLookalikeForConfirmedFamilies: true
    forbiddenLookalikeFamilies:
    - Button
    - Input
    - Switch
    - Tabs
    - Tag
    - Card
    - Top Bar
    - Bottom Bar
    - Chat Input
    - Action Sheet
    - Message Feed
  rationale: Confirmed Figma components are the design source and must not be replaced
    by lookalike raw frames.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  - bindings/figma/critical-bindings.yaml
  autofix:
    strategy: replace-lookalikes-with-confirmed-instance-or-mark-fallback
- id: fallback-is-low-fidelity-and-labeled
  severity: error
  target: fallback-module
  assert:
    fallbackAllowedOnlyWhenBindingMissingOrBlocked: true
    fallbackMustBeLowFidelity: true
    fallbackLayerNameContains:
    - 未绑定组件
    - binding pending
    fallbackDoesNotMimicConfirmedComponent: true
  rationale: Pending bindings must stay visibly pending and cannot masquerade as production
    components.
  sourceRefs:
  - SKILL.md
  - docs/references/figma-binding-policy.md
  autofix:
    strategy: relabel-and-simplify-fallback-block
- id: partial-component-minimal-fallback
  severity: error
  target: partial-component-generation
  assert:
    verifiedSubcomponentsUsedBeforeFallback: true
    fallbackOnlyCoversMissingSubparts: true
    forbidWholeFamilyFallbackWhenSubcomponentsVerified: true
    partialFamiliesRequireGapList: true
    examplePartialFamilies:
    - component.message-feed
    - component.action-sheet
    - component.trading-page-modules
  rationale: A partial binding still contains usable verified pieces; the agent must
    not redraw the whole family when only a small subpart is missing.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  - canon/checklists/message-feed-review.yaml
  autofix:
    strategy: replace-broad-fallback-with-verified-subcomponents-and-minimal-gap-blocks
- id: fixed-chrome-separated
  severity: error
  target: mobile-page-layout
  assert:
    fixedChromeOutsideScrollContent: true
    fixedChromePinnedTopOrBottom: true
    contentAvoidsFixedChromeOverlap: true
    chromeFamilies:
    - Status Bar
    - Top Bar
    - Bottom Bar
    - Chat Input
    - Action Sheet
  rationale: Status, top, bottom, chat input, and modal chrome are structural zones,
    not ordinary scrolling content.
  sourceRefs:
  - SKILL.md
  - canon/archetypes/mobile-chat-page.yaml
  - canon/archetypes/mobile-list-page.yaml
  autofix:
    strategy: move-chrome-to-fixed-zone-and-adjust-content-padding
- id: nested-auto-layout-required
  severity: error
  target: auto-layout-structure
  assert:
    screenUsesAutoLayout: true
    textBearingContainersUseAutoLayout: true
    contentSectionsUseNestedAutoLayout: true
    cardContentResizesFromContentAndPadding: true
    noManualCoordinateLayoutForDynamicContent: true
  rationale: Generated screens must be editable and resilient to real financial copy
    length.
  sourceRefs:
  - SKILL.md
  - DESIGN.md
  - canon/foundations/visual-language.md
  autofix:
    strategy: convert-content-blocks-to-nested-auto-layout
- id: instance-wrapper-not-clipped
  severity: error
  target: instance-wrapper
  assert:
    wrapperHeightGreaterThanOrEqualToContainedInstance: true
    clipsContentDoesNotHideInstanceTextOrControls: true
    screenshotShowsNoInstanceClipping: true
  rationale: Auto Layout wrappers must not clip imported instances or nested component
    text.
  sourceRefs:
  - SKILL.md
  - canon/checklists/visual-review.yaml
  autofix:
    strategy: increase-wrapper-height-or-set-hug-fit-content
- id: text-containers-use-hug-and-fill
  severity: error
  target: auto-layout-text-sizing
  assert:
    textHeightUsesHugContents: true
    nonStructuralParentHeightUsesHugContents: true
    multilineBodyTextUsesFillContainerWidth: true
    fixedHeightAllowedOnlyForStructuralRegions: true
    fixedWidthAllowedOnlyForSmallLabelsNumericColumnsOrVerifiedComponentInternals: true
  rationale: Real business copy must not be clipped by Fixed Height or forced into
    brittle fixed-width text frames.
  sourceRefs:
  - SKILL.md
  - DESIGN.md
  autofix:
    strategy: set-text-to-fill-width-hug-height-and-parent-to-hug
- id: message-feed-scroll-covers-content
  severity: error
  target: mobile-chat-message-feed
  assert:
    messageFeedScrollCoversAllChildContent: true
    reasoningPanelWrapperCoversNestedChildren: true
    parentHeightsRecomputedAfterChildResize: true
    longAnswersDoNotClipAtViewportOrWrapper: true
  rationale: Long answers, reasoning panels, tables, charts, and related questions
    must remain visible inside the message feed scroll zone.
  sourceRefs:
  - SKILL.md
  - canon/components/message-feed.meta.yaml
  - canon/archetypes/mobile-chat-page.yaml
  autofix:
    strategy: recompute-scroll-and-wrapper-heights-from-child-bounds
- id: bottom-bar-body-keeps-20px-gap
  severity: error
  target: mobile-chat-bottom-input
  assert:
    bottomBarFixedAtFrameBottom: true
    bottomBarOutsideMessageFeed: true
    messageContentNotCoveredByBottomBarBody: true
    gapBetweenContentAndBottomBarBodyPx: 20
    transparentShadowMayOverlayMessageContent: true
    fullBottomBarHeightPlusExtraSpacerForbidden: true
  rationale: Chat input is fixed chrome, but its transparent shadow is a visual
    overlay rather than reserved layout height. Content avoids the solid body
    and safe area while remaining visible beneath the gradient.
  sourceRefs:
  - SKILL.md
  - DESIGN.md
  - canon/components/chat-input.meta.yaml
  - canon/archetypes/mobile-chat-page.yaml
  autofix:
    strategy: reserve-body-safe-area-and-20px-gap-without-reserving-transparent-shadow
- id: realistic-content-no-placeholders
  severity: error
  target: generated-screen-content
  assert:
    noRepeatedDummyCharacters: true
    noGenericPlaceholderLabels: true
    noRawTodoOrPromptMarkers: true
    realisticFinancialNewsChatContentInjected: true
    forbiddenScreenTextSamples:
    - 文字文字
    - placeholder
    - dummy
    - TODO
  rationale: Evaluation screens must be readable business examples, not prompt scaffolds.
  sourceRefs:
  - SKILL.md
  - docs/references/business-scenarios.md
  autofix:
    strategy: replace-placeholder-copy-with-representative-business-content
- id: annotation-outside-screen
  severity: error
  target: annotation-and-review-notes
  assert:
    screenBodyContainsNoBindingReport: true
    screenBodyContainsNoVisualOrInteractionExplanation: true
    rightSideAnnotationCardPresentWhenNotesExist: true
  rationale: Visual/interaction/binding notes must not pollute the generated product
    screen.
  sourceRefs:
  - SKILL.md
  autofix:
    strategy: move-notes-to-right-side-annotation-card
- id: theme-consistency-dark-light
  severity: error
  target: themed-figma-frame
  assert:
    parentFrameThemeMatchesAllComponents: true
    darkFrameContainsNoLightComponents: true
    lightFrameContainsNoDarkComponents: true
    explicitVariableModeOrVariantChecked: true
  rationale: A dark or light screen is invalid if imported components retain the opposite
    theme.
  sourceRefs:
  - SKILL.md
  - canon/foundations/themes/dark.theme.yaml
  - canon/foundations/themes/light.theme.yaml
  autofix:
    strategy: switch-component-variants-or-variable-mode-to-parent-theme
- id: exact-component-variant-match-required
  severity: error
  target: component-variant-selection
  assert:
    componentSetChildSelectedByExactVariantProperties: true
    fuzzyNameMatchAloneForbidden: true
    confirmedVariantComponentKeyPreferredWhenAvailable: true
    placedInstanceActualVariantComparedWithExpected: true
    aiChatBackgroundUsesExpectedVariant:
      分类: 新版工作区/一级
      Dark: "On"
    aiChatBottomInputUsesExpectedVariant:
      场景: 对话
      有关联问: "Off"
      有陪伴: "Off"
      有指数: "Off"
      Dark: "On"
    defaultHomeBottomBarForbiddenForAiChat: true
    oldSecondaryBackgroundForbiddenForAiChat: true
  rationale: Importing a correct component set is insufficient if the placed child
    variant is semantically wrong. AI Chat background and Bottom Bar variants must
    match the full expected property set, not just dark mode.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  - canon/components/chat-input.meta.yaml
  - authoring/scenarios/ai-chat.brief.yaml
  autofix:
    strategy: import-confirmed-variant-key-or-reselect-child-by-exact-properties
- id: token-source-evidence-required
  severity: error
  target: token-and-color-source
  assert:
    tokenComplianceRequiresSource: true
    tokenSourceMapCompletedBeforeMainScreenMutation: true
    acceptedColorSources:
    - figma_variable
    - figma_style
    - confirmed_component_rendering
    - canonical_token_marked_token_binding_pending_for_low_fidelity_fallback
    requiredTokenSourceMapIncludes:
    - page_background
    - card_or_surface
    - divider
    - text_primary
    - text_secondary
    - text_tertiary
    - action_blue
    - finance_red
    - finance_green
    - radius
    hardcodedFallbackColorsMarkedTokenPending: true
    hardcodedFallbackDoesNotPassTokenCompliance: true
    highFidelityFallbackUsesNoRawRgbOrHex: true
    unresolvedVariablesRequireLowFidelityOrStop: true
    noClaimOfNormativeColorWithoutVariableStyleOrConfirmedComponentEvidence: true
  rationale: A dark-looking or light-looking screen is not token compliant unless
    its colors come from variables, styles, or confirmed component rendering.
  sourceRefs:
  - SKILL.md
  - DESIGN.md
  - bindings/figma/variables.yaml
  - canon/foundations/visual-language.md
  autofix:
    strategy: build-token-source-map-bind-variables-or-mark-fallback-token-pending
- id: typography-source-evidence-required
  severity: error
  target: typography-source
  assert:
    typographySourceMapCompletedBeforeFallbackDrawing: true
    fallbackTextMapsToTypographyScale: true
    multilineConversationTextUses160PercentLineHeight: true
    financialNumbersUseZlCaiFuTiOrDocumentedNumericFontSubstitution: true
    arbitraryFontSizesForbiddenInHighFidelityFallback: true
    arbitraryLineHeightsForbiddenInHighFidelityFallback: true
    fontSubstitutionDoesNotEraseTypographyMapping: true
  rationale: Fallback business modules must still follow the page typography scale;
    arbitrary sizes and line heights create designs that cannot be traced to the
    system.
  sourceRefs:
  - SKILL.md
  - docs/references/foundations/typography.md
  - canon/foundations/tokens/typography.tokens.json
  autofix:
    strategy: map-text-to-typography-scale-or-downgrade-fallback-to-token-pending
- id: related-question-single-semantic-slot
  severity: error
  target: mobile-chat-related-questions
  assert:
    quickFollowUpPromptsRouteToMessageFeedRelatedQuestion: true
    noDuplicateFallbackQuickQuestionCardWhenRelatedQuestionComponentPresent: true
    relatedQuestionTextOverrideGapMarkedAsTextOverridePending: true
    duplicateAllowedOnlyWhenPrdDefinesDistinctModulesAndAnnotationExplainsDifference: true
    duplicateLayerNameScanIncludes:
    - 快捷追问
    - 后续追问
    - 关联问
    - related question
    - follow-up
    - quick question
  rationale: PRD quick follow-up prompts and the design-system related-question component
    represent the same answer-stack slot by default. Duplicating them creates a
    semantic and visual error.
  sourceRefs:
  - SKILL.md
  - canon/components/message-feed.meta.yaml
  - canon/archetypes/mobile-chat-page.yaml
  autofix:
    strategy: remove-duplicate-fallback-and-populate-or-annotate-related-question-component
- id: component-font-substitution-preserves-instance
  severity: error
  target: component-font-substitution
  assert:
    missingCommercialOrTeamFontsDoNotBecomeBindingBlocker: true
    pingFangScOrZlCaiFuTiMissingUsesNotoSubstitution: true
    componentInstanceOrCloneStructurePreservedAfterFontSubstitution: true
    fontSubstitutionReportIncludes:
    - componentFamily
    - originalFont
    - substitutedFont
    - affectedTextScope
    firstFontFailureDoesNotPermitRedraw: true
    fontSubstitutionFailureRequiresNonFontBlockerBeforeFallback: true
    vagueFontProblemNotesDoNotPass: true
  rationale: Current team account permissions may not support PingFang SC or
    ZLCaiFuTi cloud fonts. Missing fonts should be repaired by Noto substitution
    while preserving real component instances, not treated as permission to redraw.
  sourceRefs:
  - SKILL.md
  - bindings/figma/components.yaml
  autofix:
    strategy: substitute-noto-fonts-preserve-component-instance-and-report
- id: high-risk-trading-actions-not-ordinary-buttons
  severity: error
  target: high-risk-trading-action
  assert:
    tradingActionsUseTradingActionButtonOrPendingFallback: true
    ordinaryButtonDoesNotRepresentBuySellCancelSubmit: true
    riskContextVisible: true
  rationale: Buy, sell, cancel, submit, and permission-sensitive trading actions cannot
    be disguised as ordinary buttons.
  sourceRefs:
  - SKILL.md
  - canon/checklists/trading-action-button-review.yaml
  - canon/checklists/trading-page-modules-review.yaml
  autofix:
    strategy: replace-ordinary-action-with-trading-component-or-pending-risk-fallback
- id: final-screenshot-and-metadata-verified
  severity: error
  target: delivery-verification
  assert:
    figmaMetadataChecked: true
    screenshotRenderingChecked: true
    failedChecklistItemsBecomeFixItems: true
    noDeliveryUntilP0FailuresFixed: true
  rationale: Checklist failures should produce concrete modifications before delivery,
    not just a written caveat.
  sourceRefs:
  - SKILL.md
  autofix:
    strategy: rerun-screenshot-metadata-check-and-repair-p0-failures
