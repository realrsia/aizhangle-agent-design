componentId: component.chat-topbar
sourceBrief: authoring/components/chat-topbar.brief.yaml
sourceScenario: authoring/scenarios/ai-chat.brief.yaml
items:
  - id: chat-topbar-fullscreen-type
    severity: P0
    question: 是否使用全屏对话 header，而不是普通二级页 header？
    passCriteria: 结构为 47px 状态区 + 44px 对话 header，无标题、搜索、tab 或底部分割线。
  - id: chat-topbar-fixed
    severity: P0
    question: 顶部导航是否固定在页面顶部并独立于 message_feed？
    passCriteria: topbar 不进入滚动内容，message_feed 从 topbar 下方开始。
  - id: chat-topbar-not-trading-header
    severity: P0
    question: 是否没有用交易页 Stock Header、普通 header 或 tabbed navigation 替代对话顶部导航？
    passCriteria: 设计仓库 3.3 中的交易页头部示例不得被登记为 chat-topbar 正式来源。
  - id: chat-topbar-actions-order
    severity: P1
    question: 右侧图标顺序是否为消息、播放？
    passCriteria: 消息图标在左，播放图标在右，左侧保留关闭入口。
  - id: chat-topbar-height-structure
    severity: P1
    question: 是否保留完整 91px 顶部结构？
    passCriteria: 顶部 47px iOS 状态区和 44px 对话 header 都存在。
  - id: chat-topbar-formal-source-marked
    severity: P2
    question: 是否使用当前设计仓库对话流来源，而不是旧实测文件或原创 header？
    passCriteria: "来源指向 `figma://pbxELN7TYDDguIgbXfc1zB/400:25178`，并使用 `1月版全屏对话导航栏`。"
  - id: chat-topbar-light-variant-verified
    severity: P3
    question: 当 frame 名称与节点 `Dark` 属性冲突时，是否触发复核而不是按名称猜测？
    passCriteria: "`400:25178` 以节点属性为准；如自动化依赖 frame 名称，先标记复核。"
