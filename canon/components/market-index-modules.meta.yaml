id: component.market-index-modules
name: 大盘模块组件族
owner: design-system
status: draft
sourceBrief: authoring/components/market-index-modules.brief.yaml
classification:
  primitiveFamily: market_index_modules
  componentType: component_family_suite
  riskLevel: high
  isOrdinaryButton: false
  isTradingAction: false
purpose: >
  Maintains confirmed Figma component families for the Market Index page:
  background shell, title, index summary, abnormal A-share, barrage, auction,
  tabs, news, and first-screen scroll guide. Scenario files own page composition
  and usage examples only.
usage:
  usedIn:
    - market-index-full-page
    - market-index-first-screen
    - html-prototype-market-index
    - figma-review-market-index
  allowedZones:
    - page_shell
    - market_index_card_background
    - first_screen_crop_shell
    - market_index_card_header
    - page_section_title
    - market_index_top_summary
    - market_index_horizontal_scan
    - abnormal_sector_scan
    - market_index_signal_map
    - market_index_signal_barrage
    - rolling_message_zone
    - market_index_auction_read
    - market_index_opening_signal
    - market_index_content_switch
    - market_index_news_filter
    - market_index_news_feed
    - market_index_opportunity_extension
    - first_screen_guide
    - market_index_card_bottom_hint
  forbiddenZones:
    - news_list_item
    - inline_content_module
    - generic_dashboard_card
    - bottom_dock
    - top_nav
    - full_scroll_body
  requiredPairings:
    - full-light-and-dark-reference
    - first-screen-crop-reference
    - semantic-top-nav
    - semantic-bottom-structures
  forbiddenPairings:
    - usage-frame-as-family
    - screenshot-as-component-definition
    - first-screen-as-primary-truth
composition:
  scenarioSource: authoring/scenarios/market-index.brief.yaml
  scenarioRole: 页面组合、业务规则、全量/首屏 usage 真源。
  moduleOrderLocked: true
  indexTypesLocked: true
  newsTitleLabelsFixed: true
  pageComposition:
    topNav: fixed_system_component
    pageBody: scrollable_market_card
    bottomBar: fixed_system_component
    workspaceBottomNav: fixed_required_structure
  usageTruth:
    fullDark: "30:16491"
    fullLight: "30:17191"
    firstScreenDark: "3:2360"
    firstScreenLight: "3:4021"
  sourceBoundaryRule: Scenario/demo frames are usage evidence only; they must not become confirmed component families.
sourcePriority:
  rule: Follow the current repository source mapping and `docs/references/source-boundaries.md` conflict resolution.
  numericTokensFontsRadiusSpacingMetrics:
    - canon/foundations/
    - bindings/assets/manifest.yaml
    - local asset/template files
  pageStructureZonesDensityForbiddenSubstitutions:
    - canon/archetypes/xzl-fusion-screen-recipes.yaml
    - canon/components/component-semantics.yaml
  figmaFacts:
    - bindings/figma/components.yaml
    - actual Figma verification
  visualReview:
    - DESIGN.md
    - docs/references/foundations/visual-language.md
    - docs/references/process/design-taster.md
    - docs/references/anti-patterns.md
riskBoundaries:
  - id: market-index-background-source-of-truth
    severity: P0
    sourceRefs:
      - authoring/case-studies/market-index-background-shell-source-drift.md
    rule: Background shell component family must be distinguished from first-screen usage instances before implementation.
  - id: market-index-background-not-generic-card
    severity: P0
    sourceRefs:
      - authoring/case-studies/market-index-background-shell-source-drift.md
    rule: Preserve layered shell, glow, texture, stroke, and inner-effect relationships; do not flatten to a generic dashboard card.
  - id: market-index-title-source-locked
    severity: P0
    sourceRefs:
      - authoring/case-studies/market-index-title-generic-text-drift.md
    rule: Market title must use the dedicated title family and keep title text, status dot, and status text as separate elements.
  - id: market-index-title-flow-ownership
    severity: P1
    sourceRefs:
      - authoring/case-studies/market-index-title-generic-text-drift.md
    rule: Title placement belongs to the market card content flow, not an arbitrary screen-anchored text row.
  - id: market-index-theme-consistency
    severity: P0
    rule: Light and dark are real theme contracts and sometimes structural variants, not simple recolors.
  - id: market-index-top-nav-source-drift
    severity: P0
    sourceRefs:
      - authoring/case-studies/top-nav-source-drift-case.md
    rule: Market page top navigation follows source-priority rules; do not replace source-sensitive visual nodes with local lookalikes.
  - id: market-index-financial-semantics
    severity: P0
    rule: Red-up and green-down financial semantics cannot be reversed in index, abnormal A-share, or auction modules.
