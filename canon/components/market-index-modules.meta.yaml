    - dark-first-screen
    - dark-full
    - light-first-screen
    - light-full
slots:
  shell: 大盘页面和工作卡的背景外壳。
  title: 大盘标题与市场状态组合区。
  indexCarousel: 支持左右滑动的指数展示模块。
  abnormalAShare: A股异动主模块。
  hotQuestionToggle: A股异动右上角热问开关。
  barrage: 自动滚动双行弹幕区域。
  auction: 竞价金额、涨跌停统计、进度条和底部对比信息。
  tab: 资讯流前内容切换区。
  newsFeed: 不同分类资讯卡组成的资讯流。
  scrollGuide: 只在 1屏 初始状态出现、滑动后消失的引导。
tokens:
