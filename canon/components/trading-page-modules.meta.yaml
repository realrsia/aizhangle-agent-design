id: component.trading-page-modules
name: 交易页面模块组件族
owner: design-system
status: draft
sourceBrief: authoring/components/trading-page-modules.brief.yaml
classification:
  primitiveFamily: trading_page_modules
  componentType: component_family_board
  riskLevel: high
  isOrdinaryButton: false
  isTradingAction: false
purpose: >
  Maintains page-level Figma component families for Trading screens: top context,
  settings panels, and information panels. Shared trading inputs and high-risk
  trading action buttons stay owned by their independent components.
usage:
  usedIn:
    - trading_context_header
    - account-switch-header
    - stock_trading_detail_header
    - paper-trading-header
    - trading_setting_panel
    - condition_order_setting_panel
    - trading_order_form
    - trading_info_panel
    - position_info_panel
    - contract_info_panel
    - entrust_info_panel
    - condition_order_info_panel
  allowedZones:
    - trading_page
    - trading_context_header
    - trading_setting_panel
    - trading_info_panel
    - condition_order_info_panel
    - position_info_panel
    - contract_info_panel
    - entrust_info_panel
  forbiddenZones:
    - generic_dashboard_card
    - generic_form_card
    - generic_data_table
    - ordinary_button_group
    - ai_chat_message_body
    - marketing_or_content_card
  requiredPairings:
    - trading-context
    - selected-security
    - component.trading-input
    - component.trading-action-button
  forbiddenPairings:
    - screenshot-as-component-definition
    - generic-input-only
    - generic-data-table
    - trading-submit-area-without-context
composition:
  scenarioSource: authoring/scenarios/trading.brief.yaml
  scenarioRole: 业务组合、风险边界和候选组件引用。
  dependencyComponents:
    - component.trading-input
    - component.trading-action-button
    - component.bottom-bar
    - component.switch
  rule: Scenario frames and source selections are usage evidence only and must not become component families.
  businessOrder:
    - establish account/security/simulation context
    - expose settings and trading parameters
    - show high-risk trading action through shared action component
    - show information panels for holdings/contracts/entrust/condition orders/history
sourcePriority:
  rule: Follow the current repository source mapping and `docs/references/source-boundaries.md` conflict resolution.
  numericTokensFontsRadiusSpacingMetrics:
    - canon/foundations/
    - bindings/assets/manifest.yaml
    - local asset/template files
  pageStructureZonesDensityForbiddenSubstitutions:
    - canon/archetypes/xzl-fusion-screen-recipes.yaml
    - canon/components/component-semantics.yaml
  figmaFacts:
    - bindings/figma/components.yaml
    - actual Figma verification
  visualReview:
    - DESIGN.md
    - docs/references/foundations/visual-language.md
    - docs/references/process/design-taster.md
    - docs/references/anti-patterns.md
riskBoundaries:
  - id: trading-page-context-and-parameter-risk
    severity: P0
    rule: Account/security context, trading parameters, and information panels cannot drift independently.
  - id: trading-page-action-boundary
    severity: P0
    rule: Buy, sell, cancel, batch, and repeat-order entries must preserve trading semantics and must not become ordinary buttons.
  - id: trading-page-shared-control-boundary
    severity: P0
    rule: "`component.trading-input` and `component.trading-action-button` are dependencies, not private children of this component family board."
  - id: trading-page-top-nav-source-drift
    severity: P0
    sourceRefs:
      - authoring/case-studies/top-nav-source-drift-case.md
    rule: Top navigation source must be locked; account, security, and paper-trading top nav variants cannot be replaced by generic headers.
  - id: paper-trading-vs-live-trading
    severity: P0
    rule: Paper trading and live trading contexts cannot reuse the same top family without the simulation marker.
  - id: trading-info-panel-specificity
    severity: P1
    rule: Holdings, contracts, entrust, condition order, history entrust, and history strategy are not a generic data table.
