selectionRules:
  level1: 分类=新版工作区/一级
  level2: 分类=新版二级页
  level3Plus: 分类=新三级页
  dark: Dark=On
  light: Dark=Off
layoutBehavior:
  canonicalBitmap:
    width: 390
    height: 844
  placement:
    position: fixed
    anchor: top
    rule: 背景按 390x844 页面底图固定在页面顶部使用。
  longPageExtension:
    appliesWhen: page_content_height_gt_844
    rule: 页面长度超过 844 时，844 以下区域使用当前 Page Background 最底部颜色继续填充。
    forbidden:
      - stretch_bitmap_vertically
      - crop_into_card_background
      - tile_as_repeating_pattern
      - infer_new_gradient
  widthPolicy:
    rule: 默认按 390 宽页面使用；非 390 宽页面不在本次规则中扩展为新构图。
states:
  required:
    - level-1-dark
    - level-1-light
    - level-2-dark
    - level-2-light
    - level-3-plus-dark
    - level-3-plus-light
  excluded:
    - kyc
    - agent
    - temporary-dialog-sheet
    - full-width-card
    - non-full-width-card
    - old-level-1
    - old-level-2
    - large-card
slots:
  pageRoot:
    required: true
    description: 页面根层底图，位于导航、内容、底栏和浮层之下。
  pageLevel:
    required: true
    values:
      level1: 新版工作区/一级
      level2: 新版二级页
      level3Plus: 新三级页
  theme:
    required: true
    values:
      dark: Dark=On
      light: Dark=Off
tokens:
