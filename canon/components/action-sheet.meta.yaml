id: component.action-sheet
name: Action Sheet 弹窗
owner: design-system
status: draft
sourceBrief: authoring/components/action-sheet.brief.yaml
classification:
  primitiveFamily: overlay
  componentType: modal-action-sheet
  riskLevel: high
  maintenanceLevel: strong
  isOrdinaryButton: false
  isTradingAction: false
  isModal: true
  requiresMask: true
purpose: >
  Modal layer for New Zhangle / AI Zhangle content that requires the user to stop,
  read, confirm, consent, or complete an operation. It covers ordinary notices,
  risk warnings, trading confirmations, AI disclosures, permission/operation
  confirmations, reading dialogs, action sheets, agreement dialogs, AI Chat source
  dialogs, app version dialogs, and major update dialogs.
usage:
  usedIn:
    - ordinary-notice
    - risk-warning
    - trading-confirmation
    - ai-disclosure
    - permission-confirmation
    - operation-confirmation
    - stock-list-reading-dialog
    - action-sheet
    - gui-task-dialog
    - agreement-ip-dialog
    - ai-chat-source-dialog
    - app-version-dialog
    - major-update-ip-dialog
  allowedZones:
    - mobile_modal_layer
    - app_dialog_layer
    - action_sheet_layer
    - ai_chat_modal_layer
    - h5_modal_layer_when_confirmed
  forbiddenZones:
    - scroll_content_body
    - ordinary_card_footer
    - list_row_action_area
    - tab_navigation_area
    - bottom_bar_control_row
    - ai_chat_message_body_inline
  requiredPairings:
    - modal-mask
    - trigger-context
    - dismiss-or-confirm-action
    - risk-copy-when-needed
    - figma-library-instance
  forbiddenPairings:
    - lookalike-manual-frame
    - high-risk-without-explicit-confirmation
    - agreement-without-consent-action
    - ai-disclosure-without-source-context
    - trading-confirmation-without-selected-security
layoutContract:
  modality:
    type: modal
    rule: Action Sheet covered by this brief is modal.
  mask:
    required: true
    colorIntent: black-translucent
    rule: A black translucent mask sits below the sheet and above page content.
  zIndex:
    semanticLayer: modal-overlay-layer
    allowedAbove:
      - system_permission_dialog_when_native
      - system_keyboard_when_dialog_contains_input
    forbiddenAbove:
      - scroll_content_body
      - chart_layer
      - list_content
      - ordinary_card
      - page_demo_frame
  dismissal:
    defaultForHighRisk: explicit_user_action_required
    rule: Dismiss, mask-dismiss, and auto-dismiss behavior must come from the family or variant rule.
riskBoundaries:
  - id: modal-interrupts-flow
    severity: P1
    rule: Action Sheet interrupts the current user flow and must be necessary.
  - id: trading-and-fund-confirmation
    severity: P0
    rule: Trading, fund, account permission, or cancel/revoke actions require risk copy, primary/secondary actions, and an explicit confirmation path.
  - id: agreement-and-permission-consent
    severity: P0
    rule: Agreement, authorization, or permission flows cannot use simple close as consent.
  - id: ai-content-disclosure
    severity: P1
    rule: AI disclaimer, source expansion, and data-index explanation must state source, limitation, and traceability.
  - id: mask-and-layering
    severity: P1
    rule: Mask must not cover the sheet body or action buttons.
