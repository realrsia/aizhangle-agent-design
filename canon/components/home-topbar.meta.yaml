id: component.home-topbar
name: 首页顶部导航栏
owner: design-system
status: draft
classification:
  primitiveFamily: home_topbar
  componentType: fixed-home-navigation
  riskLevel: high
purpose: >
  首页体系固定顶部导航，包含 iOS 状态区、首页入口和今日股票行情入口。
  首页出招、首页大盘、首页早点听、首页提醒和首页任务共用同一结构。
usage:
  usedIn:
    - app-home-出招-page
    - app-home-大盘-page
    - app-home-早点听-page
    - app-home-提醒-page
    - app-home-任务-page
  allowedZones:
    - page_root_top
    - fixed_topbar
  forbiddenZones:
    - scroll_content_body
    - ordinary_card_header
    - secondary_page_title_header
  requiredPairings:
    - component.page-background
    - matching-theme
riskBoundaries:
  - id: home-topbar-scene
    severity: P0
    rule: 首页 Top Bar 只用于首页体系，不得替代全屏对话或二级页面标题栏。
  - id: home-topbar-transparent-background
    severity: P1
    rule: Top Bar 自身保持透明，直接覆盖在当前一级页面背景上。
variants:
  confirmed:
    - id: home-topbar-dark
      figmaNodeId: "921:6255"
      theme: dark
      width: 390
      height: 103
    - id: home-topbar-light
      figmaNodeId: "921:6238"
      theme: light
      width: 390
      height: 103
slots:
  statusRegion:
    required: true
    height: 44
  navigationRow:
    required: true
    top: 50
    height: 38
  homeEntry:
    required: true
  marketEntry:
    required: true
    title: 今日股票
    value: "+233.12"
htmlRuntime:
  assetPath: renderers/html/components/top-bar/top-bar.assets.inline.js
  path: renderers/html/components/top-bar/top-bar.inline.js
  customElement: xzl-home-top-bar
  defaultInteraction: static
sourceRefs:
  - figma://pbxELN7TYDDguIgbXfc1zB/921:6255
  - figma://pbxELN7TYDDguIgbXfc1zB/921:6238
reviewChecklist:
  path: canon/checklists/home-topbar-review.yaml
