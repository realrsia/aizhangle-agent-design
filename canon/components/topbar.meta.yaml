id: component.topbar
name: 场景顶部导航栏
owner: design-system
status: draft
classification:
  primitiveFamily: topbar
  componentType: fixed-navigation
  riskLevel: high
purpose: >
  承载非首页、非 AI 对话的高保真 HTML 顶部导航栏变体。
  HTML 输出必须根据页面场景选择对应 Top Bar；未被特殊声明的场景默认使用次级页面导航栏。
usage:
  allowedZones:
    - page_root_top
    - fixed_topbar
  forbiddenZones:
    - scroll_content_body
    - ordinary_card_header
  requiredPairings:
    - matching-theme
  defaultRule: >
    首页体系使用 component.home-topbar；AI 对话和任务助手使用 component.chat-topbar；
    交易、早点听详情页、自选、个股详情使用本组件对应变体；首页中的早点听入口卡片仍归属首页体系；
    其他未声明场景统一使用 secondary 变体。
riskBoundaries:
  - id: topbar-scene-selection
    severity: P0
    rule: 不得将首页 Top Bar、AI 对话 Top Bar 和二级页面 Top Bar 混用于错误业务场景；首页中的早点听入口卡片不得误用早点听详情页 Top Bar。
  - id: watchlist-tab-assets
    severity: P1
    rule: 自选页标签按钮必须复用已确认的 3x PNG 背景切图；不得用 CSS/SVG 手绘替代。
variants:
  confirmed:
    - id: topbar-trade-dark
      scene: trade
      theme: dark
      figmaNodeId: "774:47670"
      customElement: xzl-trade-top-bar
      width: 390
      height: 100
    - id: topbar-trade-light
