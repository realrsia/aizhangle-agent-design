reviewRules:
  - id: topbar-theme-match
    severity: P0
    rule: Top Bar 的 theme 必须与页面背景和其他固定 chrome 保持一致。
  - id: topbar-no-redraw-watchlist-tabs
    severity: P1
    rule: 自选标签背景使用 bindings/assets/files/top-bar/watchlist-tabs/ 中的四张切图。
  - id: topbar-default-secondary
    severity: P1
    rule: 未特殊声明页面统一使用 xzl-secondary-top-bar，不得空缺或复用首页导航。
