      是否展开: "Off"
      Dark: "Off"
  - familyId: message-feed.answer-body
    sourceFileName: 设计仓库
    sourceFileKey: pbxELN7TYDDguIgbXfc1zB
    figmaExactName: 智能体输出/正文
    componentSetKey: 5f21c28d3c07d477b36d55b34fc3492122ca07c6
    bindingStatus: verified_design_repository_search
    importApi: importComponentSetByKeyAsync
    familyType: component_set_instance
    humanUse: draft_answer_body
    variantProperties:
      分类: 无序号
      Dark: "On"
    supportedThemes:
      - dark
    missingFormalVariants:
      - theme: light
        requiredProperties:
          分类: 无序号
          Dark: "Off"
        status: missing_in_design_repository
        temporaryFallbackAllowed: true
        fallbackName: fallback / non-canonical / answer-body-light
        fallbackRules:
          - Use only for light message-feed answer body until 设计仓库 provides Dark=Off.
          - Keep high-fidelity typography, spacing, color semantics, and container behavior.
          - Do not use the Dark=On answer-body component in light pages.
