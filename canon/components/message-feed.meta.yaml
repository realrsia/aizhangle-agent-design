      Dark: "On"
  - familyId: message-feed.reasoning-panel
    sourceFileName: 设计仓库
    sourceFileKey: pbxELN7TYDDguIgbXfc1zB
    figmaExactName: 智能体输出/思考链
    componentSetKey: 217b02802185d4a9053dd4c9e477b67bd3f8000a
    januaryComponentSetKey: 3aef969e2174f71ef5951a1af9abf40dc5d3460a
    bindingStatus: verified_design_repository_search
    importApi: importComponentSetByKeyAsync
    familyType: component_set_instance
    humanUse: reasoning_chain_panel_do_not_render_as_generic_card
    variantProperties:
      状态: 完成态
      1月版: "On"
      Dark: "On"
    supportedThemes:
      - light
      - dark
    verifiedVariants:
      - theme: light
        mainComponentKey: a3466a76c7ab60b39eb00b1aa7b1b0df14dbc2b8
        figmaExactName: 状态=完成态, 1月版=On, Dark=Off
      - theme: dark
        mainComponentKeyStatus: verified_design_repository_search
        figmaExactName: 状态=完成态, 1月版=On, Dark=On
variants:
  confirmed: []
  candidates:
    - chat-page
    - message-page
    - long-answer
    - short-answer
    - related-page-opened
states:
  required:
    - default
  optional:
    - reasoning-expanded
    - reasoning-collapsed
    - answer-complete
slots:
  userMessage:
    description: 用户输入气泡。
  assistantIdentity:
    description: AI 头像和身份行。
  reasoningPanel:
    description: 思维链步骤、展开收起和检索内容。
  answerBody:
    description: 标题、正文、列表、表格等回答正文。
  answerFooter:
    description: 免责声明、来源、辅助功能。
  relatedQuestions:
    description: 关联问列表，位于回答内容之后，不进入底部输入栏。
fallbackLayoutRules:
  appliesTo:
    - fallback / non-canonical / stock-recommendation-card
    - fallback / non-canonical / stock-trend-chart
    - answer-detail / recommendation-rationale
    - financial-risk-disclaimer
    - fallback / non-canonical / answer-body-light
  layoutRequirements:
    outerContainerLayoutMode: VERTICAL
    textHorizontalSizing: fill-width
    textVerticalSizing: hug-contents-or-auto-height
    parentHeightRule: content-height-plus-padding-and-gaps
    spacingSource: auto-layout-padding-and-itemSpacing
  forbiddenPatterns:
    - textAutoResize=NONE on multiline explanatory copy
    - fixed parent height that removes expected padding
    - manual y-coordinate stacks for primary fallback text flow
    - near-zero width tag or pill wrappers that rely on overflow visibility
  longPageSpacingMinimums:
    chartToRecommendationRationale: 18
    recommendationRationaleToRiskDisclaimer: 14
    riskDisclaimerToRelatedQuestions: 16

wrapperTransparencyRules:
  appliesTo:
    - message-row / user-question
    - message-row / assistant-answer
    - layout wrappers around verified design-repository instances
  required:
    fills: []
    strokes: []
    effects: []
    visualSource: verified component instance, not wrapper
  allowedVisibleWrappers:
    - fallback / non-canonical / stock-recommendation-card
    - fallback / non-canonical / stock-trend-chart
    - answer-detail / recommendation-rationale
    - financial-risk-disclaimer
    - fallback / non-canonical / answer-body-light
  validation:
    - check parent wrapper fills/strokes/effects for every verified message-feed component instance.
    - check descendant overflow in addition to direct sibling overlap.
