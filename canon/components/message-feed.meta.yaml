id: component.message-feed
name: 对话消息流
owner: design-system
status: draft
sourceBrief: authoring/components/message-feed.brief.yaml
classification:
  primitiveFamily: message_feed
  componentType: content-layout
  riskLevel: high
  isOrdinaryCard: false
purpose: >
  Main vertical scroll region for AI Chat and message pages. It contains user
  messages, assistant identity, answer status, reasoning, answer body,
  disclaimers, actions, and related questions.
usage:
  usedIn:
    - ai-chat-page
    - message-page
  allowedZones:
    - message_feed
    - conversation_stack
    - assistant_content_stack
  forbiddenZones:
    - topbar
    - bottom_input
    - bottom_dock
  requiredPairings:
    - component.chat-topbar
    - component.chat-input
    - scroll-container
  forbiddenPairings:
    - generic-card-grid
    - market-dashboard-module
composition:
  aiChatScenario:
    source: authoring/scenarios/ai-chat.brief.yaml
    role: only primary scroll zone between fixed chat-topbar and fixed chat-input
    rule: Topbar and bottom input stay fixed; long answers, tables, charts, and related questions scroll inside message_feed and must not overlap fixed zones.
    requiredContent:
      - user question bubble
      - AI avatar or identity row
      - AI answer or reasoning status
      - AI answer body
      - bottom composer outside this component
      - financial cards or charts only when business content requires them
riskBoundaries:
  - id: message-feed-scroll-zone
    severity: P0
    rule: Message feed is the only main scrolling zone; topbar and chat input cannot be children of it.
  - id: message-feed-chat-hierarchy
    severity: P0
    rule: Keep shell, layout, block, item, content, and action hierarchy; numbered frames are not semantic sources.
  - id: message-feed-fallback
    severity: P0
    rule: Stock cards, K-line charts, unverified business content, and light answer body may be fallback only when clearly marked as non-canonical; reasoning uses the verified 设计仓库 component binding.
  - id: message-feed-answer-body-light-fallback
    severity: P0
    rule: 设计仓库 currently confirms 智能体输出/正文 only for Dark=On; light pages must not use the Dark=On answer body and may temporarily use fallback / non-canonical / answer-body-light.
  - id: message-feed-reasoning-light-variant
    severity: P0
    rule: 设计仓库 confirms 智能体输出/思考链 has a Dark=Off variant; light long pages must use 状态=完成态, 1月版=On, Dark=Off and must not use Dark=On or item/思考链/1月版.
  - id: message-feed-fallback-auto-layout
    severity: P0
    rule: message-feed fallback modules must use Auto Layout for text-bearing cards, charts, recommendation rationale, risk disclaimer, and light answer-body fallback; text should use fill-width plus Hug Contents/auto-height instead of fixed-height compression.
  - id: message-feed-layout-wrapper-transparent
    severity: P0
    rule: Auto Layout wrappers created only to position verified component instances must be visually transparent; fills, strokes, and effects must be empty so user input, avatar, status, reasoning, body, and related-question visuals come only from their imported design components.
  - id: message-feed-business-light-theme-adapted
    severity: P0
    rule: When embedding `指数` or `A股异动` in light message-feed pages, verify light theme support; if only a single dark-style component key is available, adapt text, axis, and hot-question colors to light theme and mark the adaptation until a real light variant is verified.
  - id: message-feed-long-page-visual-spacing
    severity: P1
    rule: Long-page lower content must pass visual rhythm checks, not only geometry overlap checks; chart-to-rationale, rationale-to-disclaimer, and disclaimer-to-related-question spacing must remain readable.
  - id: message-feed-financial-disclaimer
    severity: P1
    rule: Financial answers involving stocks, prices, K-lines, or risk prompts must preserve example/non-investment-advice semantics.
