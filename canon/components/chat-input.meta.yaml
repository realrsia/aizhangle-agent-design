    - 有陪伴=On
    - 有指数=On
    - 交易场景
    - 个股
states:
  required:
    - default
  optionalPendingFigma:
    - voice
    - keyboard
    - interruption
slots:
  inputPill:
    description: 输入胶囊或语音按住说话区域。
  utilityActions:
    description: 交易、我的、模式切换等辅助动作。
  agentChips:
    description: 深度回答、投顾回答、选助手等对话快捷入口。
  safeArea:
    description: iOS 底部安全区与 AI 生成提示。
layoutRules:
  fixedAtFrameBottom: true
  outsideMessageFeed: true
  bottomInputGapPxMin: 40
  explicitSpacerBeforeInput: recommended
  overlapWithMessageContent: forbidden
