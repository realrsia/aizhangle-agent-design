id: component.bottom-bar
name: 底部栏
owner: design-system
status: draft
sourceBrief: authoring/components/bottom-bar.brief.yaml
classification:
  primitiveFamily: bottom_bar
  componentType: fixed-bottom-composer-and-action-bar
  riskLevel: high
  maintenanceLevel: strong
  isOrdinaryButton: false
  isTradingAction: false
purpose: >
  New Zhangle / AI Zhangle mobile fixed bottom interaction contract for voice input,
  AI assistant entry, page-scene entry, market/index preview, stock trade actions,
  AI-content disclosure, and iOS safe area. It is not a generic button group,
  tab bar, or card footer.
usage:
  usedIn:
    - primary-page
    - app-home-出招-page
    - app-home-大盘-page
    - app-home-早点听-page
    - app-home-提醒-page
    - app-home-任务-page
    - ai-chat-page
    - stock-quote-page
    - trading-page
    - market-or-index-aware-page
    - account-page
    - position-page
    - app-my-position-page
  allowedZones:
    - mobile_frame_bottom
    - primary_page_bottom_composer
    - ai_chat_page_composer
    - stock_quote_bottom_action
    - trading_page_bottom_action
    - market_index_bottom_summary
  forbiddenZones:
    - scroll_content_body
    - ordinary_card_footer
    - content_section_tab_area
    - list_row_action_area
    - ai_chat_message_body
    - generic_form_footer
    - marketing_or_banner_area
  requiredPairings:
    - page-context
    - safe-area
    - figma-variant
    - light-or-dark-theme
    - voice-input-or-action-context
    - ai-disclosure-when-ai-content-visible
    - trading-context-when-buy-sell-cancel-visible
  forbiddenPairings:
    - generic-bottom-navigation
    - tabs-component-as-bottom-bar
    - ordinary-button-group-as-bottom-bar
    - trading-action-without-selected-security
    - ai-message-body-with-direct-trade-action
    - floating-card-substitute
layoutContract:
  zIndex:
    semanticLayer: foremost-page-ui-layer
    allowedAbove:
      - system_keyboard
      - modal_or_sheet_when_explicitly_opened
      - toast_or_alert_when_explicitly_opened
      - long_press_voice_input_replacement_state
    forbiddenAbove:
      - scroll_content_body
      - chart_layer
      - list_content
      - ordinary_card
      - companion_bubble_when_part_of_bottom_bar
      - generic_floating_button
  yAxis:
    anchor: screen-bottom
    requiredAlignment:
      - bottom_edge_to_frame_bottom
      - safe_area_preserved
      - home_indicator_visible_when_app_frame
riskBoundaries:
  - id: bottom-bar-structure-contract
    severity: P0
    rule: Misusing Bottom Bar breaks fixed bottom navigation, input, or trading-entry semantics.
  - id: trading-actions-in-bottom-bar
    severity: P0
    rule: Buy, sell, and cancel actions require a selected security and explicit trading context.
  - id: ai-generated-disclosure
    severity: P1
    rule: Fullscreen dialog or AI suggestion content should keep AI-generated disclosure unless hidden by human-approved rule.
  - id: bottom-bar-layer-and-position
    severity: P0
    rule: Bottom Bar must sit at the screen bottom and in the foremost persistent page layer.
