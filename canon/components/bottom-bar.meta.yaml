states:
  required:
    - default
    - dark
    - light
  optional:
    - ai-disclosure-visible
    - agent-chips-visible
    - companion-visible
    - index-visible
    - related-question-visible
    - trading-actions-visible
    - focused
    - disabled
  notes:
    focused: not-exposed-as-bottom-bar-main-variant
    disabled: not-exposed-as-bottom-bar-main-variant
slots:
  root: 底部栏根容器，宽度 390，固定在移动端 frame 底部。
  backgroundShadow: 底部渐变背景，按场景和可选模块高度变化。
  controlRow: 承载输入胶囊、入口、助手或交易行动的主操作行。
  inputPill: 语音或键盘输入胶囊；真实子组件为 `bottom bar/item/输入胶囊`。
  leftEntryIcon: 首页/对话/个股左侧入口。
  rightAssistantIcon: 首页/对话/个股右侧助手入口。
  collapseEntryButton: 首页入口展开后的向下箭头收起按钮。
  tradingActions: 个股交易上下文中的买、卖、撤行动入口。
  agentSuggestionChips: 全屏对话场景的 AI 助手建议胶囊。
  companionModule: 陪伴人物、提醒文案、可选详情链接和左对齐操作按钮。
  indexModule: 指数名称、代码、现价、涨跌额、涨跌幅。
  relatedQuestionToast: 用户空闲后的关联问 Toast。
  aiGeneratedDisclosure: AI 内容披露文案“内容由AI生成”。
  homeIndicator: iOS home indicator 和底部安全区。
