scenarios:
  - id: homepage-scene
    displayName: 首页场景
    variants:
      - default-dark
      - default-light
      - default-companion-dark
      - default-companion-light
    usedIn:
      - app-home-出招-page
      - app-home-大盘-page
      - app-home-早点听-page
      - app-home-提醒-page
      - app-home-任务-page
      - app-trade-entry-expanded-page
      - app-watchlist-entry-expanded-page
  - id: fullscreen-chat-scene
    displayName: 全屏对话场景
    variants:
      - chat-dark
      - chat-light
    allowedZones:
      - ai_chat_page_composer
      - assistant_conversation_bottom
      - fullscreen_dialog_bottom_composer
  - id: stock-scene
    displayName: 个股场景
    aliases:
      - 交易场景
      - 个股交易
    variants:
      - trading-dark
      - trading-light
      - stock-index-dark
      - stock-plain-light
      - trading-index-dark
      - trading-index-light
  - id: stock-related-question-scene
    displayName: 个股场景关联问
    variants:
      - trading-related-dark
      - trading-related-light
      - trading-related-index-dark
      - trading-related-index-light
  - id: companion-scene
    displayName: 陪伴场景
    variants:
      - default-companion-dark
      - default-companion-light
      - stock-index-companion-dark
      - stock-index-companion-light
      - trading-index-companion-dark
      - trading-index-companion-light
  - id: long-press-voice-input
    displayName: 长按语音输入
    componentFamily: bottom-bar.voice-input
    replacementRule: bottom-bar-disappears-while-voice-input-is-visible
