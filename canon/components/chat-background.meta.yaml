id: component.chat-background
name: 对话页背景
owner: design-system
status: draft
classification:
  primitiveFamily: page_background
  componentType: page-shell-foundation
  riskLevel: high
purpose: >
  AI Chat page background for the current design-repository dialog flow. It uses
  the page-background component source with the dialog-flow light-beam treatment,
  not a home-card background, pure color fill, hand-drawn gradient, or screenshot.
usage:
  usedIn:
    - ai-chat-page
    - message-page
  allowedZones:
    - page_background
    - app_shell_background
    - ai_chat_page_root
  forbiddenZones:
    - message_feed
    - chat_topbar
    - bottom_input
    - content_card
  requiredPairings:
    - component.chat-topbar
    - component.message-feed
    - component.chat-input
  forbiddenPairings:
    - ordinary_card_background
    - screenshot_background
    - hand_drawn_solid_rect
composition:
  aiChatScenario:
    source: authoring/scenarios/ai-chat.brief.yaml
    role: fixed page root background below topbar, message feed, and chat input
    layerOrder:
      - chat-background
      - message-feed
      - chat-topbar
      - chat-input
    rule: Background stays at page root and never enters the message feed scroll container.
riskBoundaries:
  - id: chat-background-library-source
    severity: P0
    rule: Do not replace the repository background component or variable with a hand-drawn rectangle.
  - id: chat-background-theme-height
    severity: P1
    rule: Dark/light selection must use the confirmed Figma `Dark` property; do not infer theme from frame names alone.
componentFamilies:
  - familyId: chat-background.repository-background
    displayName: 设计仓库背景/母组件
    fileName: 设计仓库
    fileKey: pbxELN7TYDDguIgbXfc1zB
    canvasNodeId: "212:2"
    canvasName: 对话流
    sectionNodeId: "400:24983"
    sectionName: 2.2 页面背景
    componentSetNodeId: "400:26745"
    figmaExactName: 背景/母组件
    componentSetKey: e7d0e3570253b5e750c00103dd65780e31461aa7
    importApi: importComponentSetByKeyAsync
    bindingMode: must_use_library_instance
    bindingFailurePolicy: stop_and_recheck
    componentPropertyDefinitions:
      分类:
        type: VARIANT
        variantOptions:
          - 新版工作区/一级
          - 新版二级页
          - 新三级页
          - KYC
          - Agent
          - 临时对话浮层
          - 通栏卡片
          - 非通栏卡片
          - 旧一级页
          - 旧二级页
          - 大片
      Dark:
        type: VARIANT
        variantOptions:
          - "On"
          - "Off"
variants:
  confirmed:
    - id: chat-background-workspace-dark
      familyId: chat-background.repository-background
      figmaNodeId: "400:26896"
      figmaExactName: 分类=新版工作区/一级, Dark=On
      componentSetNodeId: "400:26745"
      componentSetKey: e7d0e3570253b5e750c00103dd65780e31461aa7
      componentKey: 96ce857c0183e6d76f1d7877af90c4a5509864fe
      variantProperties:
        分类: 新版工作区/一级
        Dark: "On"
      humanUse: dark_theme_ai_chat_page_background
    - id: chat-background-workspace-light
      familyId: chat-background.repository-background
      figmaNodeId: "400:26805"
      figmaExactName: 分类=新版工作区/一级, Dark=Off
      componentSetNodeId: "400:26745"
      componentSetKey: e7d0e3570253b5e750c00103dd65780e31461aa7
      componentKey: a3a4ab7790fb34ab0cb1708986b968024fc70729
      variantProperties:
        分类: 新版工作区/一级
        Dark: "Off"
      humanUse: light_theme_ai_chat_page_background
states:
  required:
    - dark-workspace-level-one
    - light-workspace-level-one
slots:
  pageRoot:
    required: true
    description: Full-page background layer below all AI Chat content.
  theme:
    required: true
    values:
      dark: Dark=On
      light: Dark=Off
  height:
    required: true
    values:
      shortPage: resize_instance_to_page_height
      longPage: resize_instance_to_page_height
tokens:
  source: 设计仓库页面背景组件内部样式
  status: verified_with_figma_partial_variable_exposure
  observed:
