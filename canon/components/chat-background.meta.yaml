  status: verified_with_figma_partial_variable_exposure
  observed:
    - baseFill #F3F5F9
    - topGradient #E1EAFF to #F3F5F9
    - lightBeamAssetNode 99:41966
  verifiedVariablesFromBackgroundSet:
    - radius/20
    - color/xzl-color-background-a
    - color/xzl-color-background-b
