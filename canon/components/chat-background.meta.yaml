  verifiedVariablesFromBackgroundSet:
    - radius/20
    - color/xzl-color-background-a
    - color/xzl-color-background-b
    - color/xzl-color-background-d-card
  figmaFinding: "`背景/母组件` variant `400:26805` is the confirmed light AI Chat background; use parent component set `400:26745` and its partially verified variables as source evidence."
assetRefs: []
sourceRefs:
