    familyType: component_set_instance
    bindingMode: must_use_library_instance
    bindingFailurePolicy: stop_and_recheck
    status: draft-use-dialog-gui-instance-pending-formal-repository-component
    componentPropertyHints:
      展开:
        - "Off"
      胶囊数量:
        - "0"
      Dark:
        - "On"
        - "Off"
