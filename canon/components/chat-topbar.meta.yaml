id: component.chat-topbar
name: 对话顶部导航栏
owner: design-system
status: draft
sourceBrief: authoring/components/chat-topbar.brief.yaml
classification:
  primitiveFamily: chat_topbar
  componentType: navigation
  riskLevel: high
  isOrdinaryHeader: false
purpose: >
  Fixed top navigation for full-screen conversation pages. It contains the iOS
  status region, a compact conversation header, a left close action, and right
  message/play icon actions.
usage:
  usedIn:
    - ai-chat-page
    - message-page
  allowedZones:
    - topbar
    - full-screen-conversation-header
  forbiddenZones:
    - message_feed
    - bottom_input
    - ordinary-card-header
  requiredPairings:
    - iOS-status-region
    - component.message-feed
    - component.chat-input
  forbiddenPairings:
    - level-2-title-header
    - tabbed-navigation
composition:
  aiChatScenario:
    source: authoring/scenarios/ai-chat.brief.yaml
    role: fixed topbar outside message-feed scrolling
    rule: Do not replace with ordinary secondary page title header, search header, tab header, or trading Stock Header.
riskBoundaries:
  - id: chat-topbar-fullscreen-type
    severity: P0
    rule: The topbar must remain a full-screen conversation header, not an ordinary second-level page header.
  - id: chat-topbar-frame-theme-name-drift
    severity: P1
    rule: Example node `400:25178` sits in a white frame but reports `Dark=On`; automation must trust node properties and re-check frame naming if needed.
